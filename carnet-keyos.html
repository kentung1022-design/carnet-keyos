    const bays = [...set].sort((a,b)=> String(a).localeCompare(String(b), undefined, {numeric:true}));
    sel.innerHTML = '<option value="">— Pick or type new —</option>' + bays.map(b=>{
      const disabled = isBayDisabled(b, branch);
      const occ = bayConflictKey(b, k.id);
      const days = occ ? lastInDays(occ) : 0;
      let label;
      if(disabled)  label = `${b} 🚫 NOT AVAILABLE`;
      else if(occ)  label = `${b} ⚠ occupied by ${occ.reg} (${days}d)`;
      else          label = `${b} ✓ free`;
      return `<option value="${b}" ${disabled?'disabled':''}>${label}</option>`;
    }).join('');
  }
  refreshBays();
  $('#f-branch').addEventListener('change', refreshBays);
  $('#f-parking-sel').addEventListener('change', e=>{
    if(e.target.value){
      $('#f-parking').value = e.target.value;
      const occ = bayConflictKey(e.target.value, k.id);
      $('#f-bay-warn').innerHTML = occ
        ? `<span style="color:#991b1b;font-weight:700">⚠ Bay occupied by ${occ.reg}. You can still save — the new entry will be marked <b>FORCED</b> and the old key auto-checked-out.</span>`
        : '1 bay = 1 main key. Spares always go to BOX.';
    }
  });

  $('#f-map')?.addEventListener('click', ()=>{
    const branch = $('#f-branch')?.value || db.user.branch;

    pendingAddKeyForm = {
      car:   $('#f-car').value,
      reg:   $('#f-reg').value,
      dealer:$('#f-dealer').value,
      branch,
      serial:$('#f-serial').value,
      id:    $('#f-id').value,
      mode:  $('#f-create')?.value,
      spareEdit: $('#f-spare')?.value,
      prevDays:  $('#f-prev-days')?.value,
      prevHours: $('#f-prev-hours')?.value,
      existing: !!existing,
      existingId: existing?.id,
    };
    selectingBayFor = { action:'add-key', branch };
    homeBranch = branch;
    closeSheet();
    go('map');
  });
  $('#f-newdealer')?.addEventListener('click', e=>{
    e.preventDefault();
    if(!isAdmin()){ toast('Only admins can add a new dealer'); return; }
    const v = prompt('New dealer name:');
    if(v && v.trim()){
      if(db.dealers.includes(v.trim())){ toast('Dealer already exists'); return; }
      db.dealers.push(v.trim()); saveDB();
      const opt = document.createElement('option'); opt.textContent=v.trim(); opt.selected=true;
      $('#f-dealer').appendChild(opt);
    }
  });

  $('#f-save').onclick = ()=>{
    const car = $('#f-car').value.trim();
    const reg = $('#f-reg').value.trim().toUpperCase();
    const dealer  = $('#f-dealer').value.trim();
    const branch  = $('#f-branch').value;
    const parking = $('#f-parking').value.trim();
    if(!car || !reg){ toast('Need car + registration'); return; }

    let prevMs = null;
    if(isAdmin() && ($('#f-prev-days') || $('#f-prev-hours'))){
      const d = parseInt($('#f-prev-days')?.value||'0',10) || 0;
      const h = parseInt($('#f-prev-hours')?.value||'0',10) || 0;
      prevMs = Math.max(0, d*DAY + h*HOUR);
    }

    if(existing){
      const spare = $('#f-spare').value === 'true';
      if(!spare){
        const conflict = bayConflictKey(parking, existing.id);
        if(conflict){
          if(!confirm(`Bay ${parking} held by ${conflict.reg} — force replace? Old key auto-checked-out and marked UNASSIGNED.`)) return;
          if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
          conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
          db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
          notifyMovement(conflict, 'out', {purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
        }
      }
      Object.assign(existing, { car, reg, dealer, branch, parking: spare ? (parking||'BOX') : parking, spare });

      if(prevMs !== null){
        existing.totalParkedMs = prevMs;

        if(existing.status === 'available') existing.inSince = Date.now();
      }
      saveDB(); closeSheet(); render(); toast('Saved');
      return;
    }

    const mode = $('#f-create').value;
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1).padStart(3,'0');
    const common = { car, reg, dealer, branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };

    let forcedConflict = null;
    if(mode!=='spare'){
      const conflict = bayConflictKey(parking);
      if(conflict){
        if(!confirm(`Bay ${parking} held by ${conflict.reg}. Force-add anyway? Old key auto-checked-out.`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed)', forced:true});
        forcedConflict = conflict;
      }
    }
    const created = [];
    if(mode==='main' || mode==='pair'){
      created.push({ ...common, id: baseId,        serial: nextSerial(), parking: parking || '', spare:false });
    }
    if(mode==='spare' || mode==='pair'){
      const tmpDb = [...db.keys, ...created];
      const max = tmpDb.reduce((m,k)=>{ const n = parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      created.push({ ...common, id: baseId+'S',     serial: String(max+1), parking: 'BOX', spare:true });
    }
    if(!created.length){ toast('Pick what to create'); return; }

    if(prevMs !== null){
      created.forEach(c=>{
        c.totalParkedMs = prevMs;

        if(c.status === 'available') c.inSince = Date.now();
      });
    }
    db.keys.unshift(...created);
    saveDB(); closeSheet(); render();
    toast(`Created ${created.length} key${created.length>1?'s':''}${prevMs?' · prior parking carried over':''}`);
  };
}

/* ---------- branch transfer (from key profile or Home) ---------- */
function openTransfer(k){
  if(!db.branches.length){ toast('No branches configured'); return; }

  const currentBranch = k.branch || db.branches[0];
  const branchList = db.branches;

  const defaultDest = branchList.find(b => b !== currentBranch) || currentBranch;
  let chosen = { branch: defaultDest, bay: '' };
  let bayQuery = '';

  function renderSheet(){
    const branchOpts = branchList.map(b=>{
      const sameLabel = (b===currentBranch) ? ' (current — change bay only)' : '';
      return `<option value="${b}" ${b===chosen.branch?'selected':''}>${b}${sameLabel}</option>`;
    }).join('');
    const allBays = [...new Set(db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.parking && x.parking.toUpperCase()!=='BOX').map(x=>x.parking))].sort();
    const Q = bayQuery.trim().toLowerCase();
    const bays = Q ? allBays.filter(b=>b.toLowerCase().includes(Q)) : allBays;
    const occupied = {};
    db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.id!==k.id && x.status==='available').forEach(x=>{ occupied[x.parking]=x; });

    openSheet(`
      <h3 style="display:flex;align-items:center;gap:8px"><span class="btn-transfer" style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.6px">TRANSFER</span> ${k.car}</h3>
      <div class="muted" style="margin-bottom:10px">${k.reg} · currently at <b>${k.branch||'?'}</b> · 📍 ${k.parking||'—'}</div>

      <div class="field"><label>Move to branch</label>
        <select id="t-to">${branchOpts}</select>
      </div>

      <button class="btn-transfer btn block" id="t-map" style="margin-bottom:10px">🗺️ Pick bay from Parking Map (destination)</button>

      <div class="field"><label>Or pick a bay in ${chosen.branch}</label>
        <div class="search" style="margin-bottom:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="t-search" placeholder="Search bay number…" value="${bayQuery}">
        </div>
        <div class="filters" style="flex-wrap:wrap;padding-bottom:0;max-height:160px;overflow:auto">
          ${bays.length ? bays.map(b=>{
            const occ = occupied[b];
            const since = occ ? lastInDays(occ) : 0;
            return `<button class="chip" data-t-bay="${encodeURIComponent(b)}" style="${chosen.bay===b?'background:var(--brand);color:#fff;border-color:var(--brand)':occ?'background:#fee2e2;color:#991b1b;border-color:#fca5a5':'background:#dcfce7;color:#0a7d2b;border-color:#86efac'}">${b}${occ?` · <span style="font-size:10px">⚠ ${occ.reg} (${since}d)</span>`:' · ✓'}</button>`;
          }).join('') : '<div class="muted" style="font-size:12px;padding:4px">No bays found</div>'}
        </div>
        <div class="muted" style="font-size:11px;margin-top:6px">Green = free · Red = occupied (force-replace)</div>
      </div>

      <div class="field"><label>Or type a new bay</label><input id="t-park" placeholder="e.g. B2-15" value="${chosen.bay || k.parking || ''}"></div>
      <div class="field"><label>Note (optional)</label><input id="t-note" placeholder="e.g. rebalance stock, customer request"></div>
      <button class="btn-transfer btn block" id="t-go" style="padding:14px;font-size:15px">Confirm transfer</button>
    `);
    $('#t-to').addEventListener('change', e=>{ chosen.branch = e.target.value; chosen.bay=''; renderSheet(); });
    $('#t-search').addEventListener('input', e=>{ bayQuery = e.target.value; renderSheet(); setTimeout(()=>{ const i=$('#t-search'); if(i){i.focus(); i.setSelectionRange(bayQuery.length,bayQuery.length);} }, 0); });
    $$('[data-t-bay]').forEach(b=>b.addEventListener('click', ()=>{
      chosen.bay = decodeURIComponent(b.dataset.tBay);
      $('#t-park').value = chosen.bay;
    }));
    $('#t-park').addEventListener('input', e=>{ chosen.bay = e.target.value.trim(); });
    $('#t-map').addEventListener('click', ()=>{
      const to = $('#t-to').value;
      const note = $('#t-note').value.trim();
      selectingBayFor = { action:'transfer', k, branch:to, note, from:k.branch };
      homeBranch = to;
      closeSheet();
      go('map');
    });
    $('#t-go').onclick = ()=>{
      const to   = $('#t-to').value;
      const bay  = ($('#t-park').value || '').trim() || k.parking || '';
      const note = $('#t-note').value.trim();
      if(!to){ toast('Pick a branch'); return; }
      const from = k.branch || '?';
      const sameBranch = (to === from);
      if(sameBranch && bay && bay.toUpperCase() === (k.parking||'').toUpperCase()){
        toast('Same branch and same bay — nothing to change'); return;
      }

      const conflict = db.keys.find(x => !x.spare && x.id!==k.id && x.branch===to && (x.parking||'').toUpperCase()===bay.toUpperCase() && bay && bay.toUpperCase()!=='BOX' && x.status==='available');
      if(conflict){
        if(!confirm(`Bay ${bay} in ${to} held by ${conflict.reg}. Force replace? Old key marked UNASSIGNED.`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
        notifyMovement(conflict, 'out', {purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
      }
      if(sameBranch){

        k.parking = bay; k.unassigned = false;
        if(k.status==='out'){ k.status='available'; k.inSince = Date.now(); }
        db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict, note:note||'bay change via Transfer'});
        notifyMovement(k, 'in', {parking:bay, forced:!!conflict});
        saveDB(); closeSheet(); render(); toast(`${k.reg} bay → ${bay}${conflict?' (forced)':''}`);
      } else {
        db.history.unshift({ts:Date.now(), type:'transfer', keyId:k.id, user:db.user.name, from, to, note});
        notifyMovement(k, 'transfer', {from, to, note, forced:!!conflict});
        k.branch = to; k.parking = bay; k.unassigned = false;
        saveDB(); closeSheet(); render(); toast(`${k.reg} → ${to}${bay?' · '+bay:''}${conflict?' (forced)':''}`);
      }
    };
  }
  renderSheet();
}

function openNotifications(){

  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    try { Notification.requestPermission().then(()=>{}); } catch(_){}
  }
  const mine = (db.notifications||[]).filter(n => n.forUser === db.user.name).sort((a,b)=>b.ts-a.ts).slice(0,60);
  const unread = mine.filter(n=>!n.read).length;
  const palette = (t)=>(
    t==='in'? {tag:'IN', bg:'#dcfce7', fg:'#0a7d2b'} :
    t==='out'?{tag:'OUT',bg:'#fee2e2', fg:'#7f1d1d'} :
    t==='transfer'?{tag:'TRANSFER',bg:'#dbeafe',fg:'#1e40af'} :
    t==='overdue'?{tag:'OVERDUE',bg:'#fef3c7',fg:'#7a4a00'} :
    {tag:'DELETED',bg:'#374151',fg:'#f3f4f6'}
  );
  openSheet(`
    <h3 style="display:flex;align-items:center;gap:8px">🔔 Notifications <span class="muted" style="font-weight:400;font-size:13px">(${db.user.name})</span></h3>
    <div class="muted" style="margin-bottom:10px;font-size:13px">You'll be pinged any time someone moves a car you added (Key In / Out / Transfer / Delete).</div>

    <div class="row" style="margin-bottom:8px">
      <button class="btn secondary" id="nt-readall">${unread?'Mark all read':'All read ✓'}</button>
      <button class="btn secondary" id="nt-clear">Clear all</button>
    </div>

    ${typeof Notification !== 'undefined' && Notification.permission === 'denied' ? `
      <div class="card pad muted" style="font-size:12px">⚠ Browser notifications are blocked. You'll still see this list, but won't get pop-ups when the app is in the background.</div>
    ` : (typeof Notification !== 'undefined' && Notification.permission === 'default' ? `
      <button class="btn-add btn block" id="nt-allow" style="margin-bottom:8px">Allow browser pop-ups</button>
    ` : '')}

    ${mine.length ? mine.map(n=>{
      const p = palette(n.type);
      const line =
        n.type==='in'        ? `Checked in @ ${n.details?.parking||'—'}` :
        n.type==='out'       ? `Purpose: ${n.details?.purpose||'—'}` :
        n.type==='transfer'  ? `${n.details?.from||'?'} → ${n.details?.to||'?'}` :
        n.type==='overdue'   ? `⏰ ${n.details?.purpose||'—'} · ${n.details?.over||0}m past limit · last out by ${n.details?.owner||'?'}` :
                               `Removed${n.details?.purpose?' · '+n.details.purpose:''}`;
      return `<div class="key-card" data-nt-key="${n.keyId}" data-nt-id="${n.id}" style="margin-bottom:6px;${!n.read?'background:#fff7ed;border-left:4px solid #FF3D00':''}">
        <div style="width:64px;height:64px;border-radius:10px;background:${p.bg};display:grid;place-items:center;font-weight:800;font-size:11px;color:${p.fg};letter-spacing:.6px">${p.tag}</div>
        <div>
          <div class="title">${n.car} <span class="muted" style="font-weight:400">· ${n.reg}</span></div>
          <div class="meta"><span>${line}</span>${n.details?.forced?'<span style="background:#475569;color:#fff;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800">FORCED</span>':''}</div>
          <div class="meta"><span class="muted">by ${n.actor}</span><span class="muted">${fmt(n.ts)}</span></div>
        </div>
        <div class="muted">›</div>
      </div>`;
    }).join('') : '<div class="empty">No notifications yet</div>'}
  `);

  $$('[data-nt-key]').forEach(el=>el.addEventListener('click', ()=>{

    const n = db.notifications.find(x=>x.id===el.dataset.ntId); if(n) n.read = true;
    saveDB(); updateBellBadge();
    openKey(el.dataset.ntKey);
  }));
  $('#nt-readall')?.addEventListener('click', ()=>{
    db.notifications.forEach(n=>{ if(n.forUser===db.user.name) n.read = true; });
    saveDB(); updateBellBadge(); openNotifications();
  });
  $('#nt-clear')?.addEventListener('click', ()=>{
    if(!confirm('Clear all your notifications?')) return;
    db.notifications = db.notifications.filter(n=>n.forUser!==db.user.name);
    saveDB(); updateBellBadge(); closeSheet();
  });
  $('#nt-allow')?.addEventListener('click', ()=>{
    try { Notification.requestPermission().then(()=>openNotifications()); } catch(_){}
  });
}

    const from = picked.branch || '?';
    const bay  = ($('#qt-bay').value || '').trim() || picked.parking;

    const conflict = db.keys.find(k => !k.spare && k.id!==picked.id && k.branch===to && (k.parking||'').toUpperCase()===bay.toUpperCase() && bay && bay.toUpperCase()!=='BOX');
    if(conflict){
      if(!confirm(`Bay ${bay} in ${to} held by ${conflict.reg}. Force replace?\n• ${conflict.reg} marked UNASSIGNED`)) return;
      if(conflict.inSince){ conflict.totalParkedMs=(conflict.totalParkedMs||0)+(Date.now()-conflict.inSince); }
      conflict.inSince=null; conflict.status='out'; conflict.unassigned=true;
      db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
      notifyMovement(conflict, 'out', {purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
    }
    const note = $('#qt-note').value.trim();
    db.history.unshift({ts:Date.now(), type:'transfer', keyId:picked.id, user:db.user.name, from, to, note});
    notifyMovement(picked, 'transfer', {from, to, note});
    picked.branch = to; picked.parking = bay;
    saveDB(); closeSheet(); render(); toast(`${picked.reg} → ${to}`);
  };
}

/* ---------- scanner ---------- */
let scanner = null;
let scanAudio = null;

function scanBeep(){
  try {
    if(!scanAudio){ scanAudio = new (window.AudioContext || window.webkitAudioContext)(); }
    if(scanAudio.state === 'suspended') scanAudio.resume();
    const ctx = scanAudio;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 880;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(_){}

  try { navigator.vibrate && navigator.vibrate(60); } catch(_){}
}

async function applyCameraZoom(zoomFactor){
  try {
    const v = document.querySelector('#scan-region video');
    if(!v || !v.srcObject) return;
    const track = v.srcObject.getVideoTracks?.()[0]; if(!track) return;
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    if(typeof caps.zoom === 'object'){
      const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoomFactor));
      await track.applyConstraints({ advanced: [{ zoom: z }] });
    } else {

      v.style.transform = `scale(${zoomFactor})`;
      v.style.transformOrigin = 'center';
    }
  } catch(_){}
}

async function startScanner(){
  const region = $('#scan-region');
  if(!region) return;

  if(location.protocol === 'file:' || !window.isSecureContext){ return; }
  if(typeof Html5Qrcode === 'undefined'){
    region.innerHTML = `<div class="empty">Scanner library didn't load. Check internet and refresh.</div>`;
    return;
  }
  try {
    scanner = new Html5Qrcode('scan-region', {verbose:false});
    await scanner.start({facingMode:'environment'},
      {fps:12, qrbox:{width:280,height:280}, aspectRatio: 1.0, disableFlip:false},
      onScan, ()=>{});

    setTimeout(()=>applyCameraZoom(1.8), 600);
  } catch(e){
    region.innerHTML = `<div class="empty">Camera unavailable: ${e.message||e}<br>Use "Take photo" or "Pick from gallery" below.</div>`;
  }
}

  const q = ($('#scan-manual')?.value || '').trim();
  if(!q){ toast('Type a plate, serial, or key ID'); return; }

  const exact = db.keys.find(k=>k.serial===q)
             || db.keys.find(k=>k.id===q)
             || db.keys.find(k=>(k.reg||'').toUpperCase()===q.toUpperCase())
             || db.keys.find(k=>`SK_${k.serial}`===q);
  if(exact){ openKey(exact.id); return; }

  const Q = q.toLowerCase();
  const matches = db.keys.filter(k=>[k.id,k.serial,k.reg,k.car,k.branch].join(' ').toLowerCase().includes(Q)).slice(0,6);
  const out = $('#scan-manual-results');
  if(!out) return;
  if(!matches.length){ out.innerHTML = `<div class="muted">No matches.</div>`; return; }
  out.innerHTML = matches.map(k=>`
    <div class="key-card" data-id="${k.id}" style="margin-bottom:6px">

      <div><div class="title">${k.car}</div><div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span></div></div>
      <div class="muted">›</div>
    </div>
  `).join('');

  $$('#scan-manual-results .qrwrap[data-payload]').forEach(el=>qrInto(el, el.dataset.payload, 56));
}
function onScan(text){
  if(scanner){ scanner.stop().catch(()=>{}); scanner=null; }
  const raw  = (text||'').trim();
  const parts = raw.split('|');

  let k = null;
  if(parts[0]==='CARNET'){
    k = db.keys.find(x => x.id === parts[1])
     || db.keys.find(x => x.serial === parts[1])
     || db.keys.find(x => (x.reg||'').toUpperCase() === (parts[2]||'').toUpperCase());
  } else if(parts[0]==='USER'){
    toast('User QR scanned: '+(parts[1]||''));
    pendingAction = null;
    return;
  } else {
    k = db.keys.find(x => x.serial === raw)
     || db.keys.find(x => x.id === raw)
     || db.keys.find(x => (x.reg||'').toUpperCase() === raw.toUpperCase())
     || db.keys.find(x => `SK_${x.serial}` === raw);
  }

  if(!k){ toast('No matching key: '+raw.slice(0,40)); pendingAction=null; return; }
  scanBeep();

  if(pendingAction){
    const action = pendingAction;
    pendingAction = null;
    go('home', false);
    runActionOnKey(k, action);
    return;
  }
  openKey(k.id);
}

function download(name, content, type='text/plain'){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');

  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

function importFile(e){
  const f = e.target.files?.[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const txt = rd.result;
    try {
      if(f.name.endsWith('.json')){
        const obj = JSON.parse(txt);
        if(obj.keys) db = obj; else throw 0;
      } else {

        const lines = txt.trim().split(/\r?\n/);
        const head = lines.shift().toLowerCase().split(',');
        const idx = name => head.indexOf(name);
        const got = lines.map(l=>{
          const cols = parseCsvLine(l);
          return {
            id: cols[idx('id')] || ('K-'+Math.random().toString(36).slice(2,6).toUpperCase()),
            car: cols[idx('car')] || '',
            reg: (cols[idx('reg')]||'').toUpperCase(),
            dealer: cols[idx('dealer')] || '',
            parking: cols[idx('parking')] || '',
            spare: /true|1|yes/i.test(cols[idx('spare')]||''),
            status: cols[idx('status')] || 'available',
          };
        }).filter(k=>k.car && k.reg);

        const map = new Map(db.keys.map(k=>[k.id,k]));
        got.forEach(k=>map.set(k.id,k));
        db.keys = [...map.values()];
      }
      saveDB(); render(); toast('Imported');
    } catch(err){ toast('Import failed'); }
  };
  rd.readAsText(f);
}
function parseCsvLine(l){
  const out=[]; let cur='', q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(q){ if(c==='"' && l[i+1]==='"'){cur+='"'; i++;} else if(c==='"'){q=false;} else cur+=c; }
    else { if(c===','){ out.push(cur); cur=''; } else if(c==='"'){ q=true; } else cur+=c; }
  }
  out.push(cur); return out;
}

    {label:'Scan QR',              icon:'📷', do:()=>go('scan')},
    {label:'My QR (Key-Assign)',   icon:'👤', do:()=>{ closeSheet(); showMyQR(); }},
    ...(isAdmin() ? [{label:'Admin Dashboard', icon:'🛡️', do:()=>go('admin')}] : []),
    ...(isAdmin() ? [{label:'Aging Report (>180d)', icon:'⚠', do:()=>go('aging')}] : []),
    {label:'Settings & Data',      icon:'⚙️', do:()=>go('more')},
    {label:'Switch role (demo)',   icon:'🔄', do:()=>{ db.user.role = isAdmin()?'user':'admin'; saveDB(); toast(`Now: ${db.user.role}`); render(); }},
    {label:'Logout',               icon:'⎋',  do:()=>toast('Logout (demo)')},
  ];
  openSheet(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div class="qrwrap" data-payload="USER|${db.user.userId}|${db.user.dealer}" style="width:64px;height:64px;padding:6px;border:1px solid var(--border);border-radius:10px"></div>
      <div>
        <div style="font-weight:800">CARNET Key OS</div>
        <div class="muted" style="font-size:13px">${db.user.name} · ${db.user.dealer}</div>
        <div class="muted" style="font-size:12px">Branch: ${db.user.branch}</div>
      </div>
    </div>
    ${items.map((it,i)=>`
      <button class="btn secondary" data-i="${i}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;justify-content:flex-start;background:transparent;padding:14px 10px;border-bottom:1px solid var(--border);border-radius:0;font-weight:600">
        <span style="font-size:18px">${it.icon}</span><span>${it.label}</span>
      </button>
    `).join('')}
    <div class="muted" style="text-align:center;font-size:12px;margin-top:14px">v0.2 · web prototype</div>
  `);

  const big = $('.sheet .qrwrap[data-payload]'); if(big) qrInto(big, big.dataset.payload, 64);
  $$('.sheet button[data-i]').forEach(b=>b.addEventListener('click', ()=>{
    const it = items[+b.dataset.i]; closeSheet(); setTimeout(it.do, 50);
  }));
}

$('#btn-back').onclick = goBack;
$('#btn-menu').onclick = openDrawer;
$('#btn-settings').onclick = ()=>go('more');
$('#btn-bell').onclick = openNotifications;
$$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.view)));

history.replaceState({nav:'home'}, '', '#home');

installDelegatedHandlers();

/* ---------- aggressive cleanup of any stale service worker / caches ---------- */

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if(self.caches){
  caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
}

render();

setInterval(()=>{
  try { checkOverdueAndNotify(); } catch(_){}
  if(view==='keys' || view==='home') render();
}, 60000);

setTimeout(()=>{ try { checkOverdueAndNotify(); } catch(_){} updateBellBadge(); }, 800);

(function waitForQR(){
  let tries = 0;
  const t = setInterval(()=>{
    tries++;
    if(typeof QRCode !== 'undefined' && QRCode.toDataURL){ clearInterval(t); render(); }
    else if(tries > 20){ clearInterval(t); }
  }, 250);
})();

window.addEventListener('error', e=>{ console.error('Global error:', e.message); });
</script>
</body>
</html>
