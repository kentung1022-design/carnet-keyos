    `);
    $('#back-to-key').onclick = ()=>openKey(k.id);
    $('#kp-replace')?.addEventListener('change', async e=>{
      const f = e.target.files?.[0]; if(!f) return;
      try {
        const dataUrl = await compressImage(f, 800, 0.7);
        k.photo = dataUrl; saveDB(); closeSheet(); openKey(k.id); toast('Photo replaced');
      } catch(_){ toast('Could not read photo'); }
    });
    $('#kp-remove')?.addEventListener('click', ()=>{
      if(!confirm('Remove the car photo?')) return;
      delete k.photo; saveDB(); closeSheet(); openKey(k.id); toast('Removed');
    });
  });

  if($('#ua-in'))  $('#ua-in').onclick  = ()=>markIn(k);
  if($('#ua-out')) $('#ua-out').onclick = ()=>markOut(k);
  if($('#ua-tr'))  $('#ua-tr').onclick  = ()=>openTransfer(k);
  if($('#ua-del')) $('#ua-del').onclick = ()=>{
    if(!confirm(`Delete ${k.reg}? This will be logged in history.`)) return;
    db.history.unshift({ts:Date.now(), type:'deleted', keyId:k.id, user:db.user.name, snapshot:{...k}});
    notifyMovement(k, 'deleted', {purpose:'deleted'});
    db.keys = db.keys.filter(x=>x.id!==k.id);
    saveDB(); closeSheet(); render(); toast('Deleted');
  };
}

function runActionOnKey(k, action){
  if(!k) return;
  if(action === 'in'){
    if(k.status === 'available'){
      if(!confirm(`Force replace?\n${k.reg} is already parked at ${k.parking||'—'} — last user may have forgotten to Key Out.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markIn(k);
  } else if(action === 'out'){
    if(k.status === 'out'){
      if(!confirm(`Force replace?\n${k.reg} is already OUT — last user may have forgotten to Key In.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markOut(k);
  } else if(action === 'transfer'){
    openTransfer(k);
  }
}

function markOut(k){
  openPurposeSheet(k, purpose=>{
    if(!purpose) return;
    if(purpose === 'Sold/Delivered'){

      const ids = db.keys.filter(x => x.pairId && x.pairId===k.pairId).map(x=>x.id);
      const targets = ids.length ? ids : [k.id];
      targets.forEach(id=>{
        const t = db.keys.find(x=>x.id===id);
        db.history.unshift({ts:Date.now(), type:'deleted', keyId:id, user:db.user.name, purpose:'Sold/Delivered', snapshot:t ? {...t} : null});
        if(t) notifyMovement(t, 'deleted', {purpose:'Sold/Delivered'});
      });
      db.keys = db.keys.filter(x => !targets.includes(x.id));
      saveDB(); render(); closeSheet(); toast(`${k.reg} sold — ${targets.length} key${targets.length>1?'s':''} removed`);
      return;
    }

    const forced = (k.status==='out');
    if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
    k.inSince = null;
    k.status  = 'out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose, forced});
    notifyMovement(k, 'out', {purpose, forced});
    saveDB(); render(); closeSheet(); toast(`${k.reg} checked out${forced?' (FORCED)':''}`);
  });
}

function openPurposeSheet(k, cb){
  const list = db.purposes || [];
  openSheet(`
    <h3>Key Out — ${k.car}</h3>
    <div class="muted" style="margin-bottom:10px">${k.reg} · ${k.branch} · 📍 ${k.parking}</div>
    <div class="filters" style="flex-wrap:wrap">
      ${list.map(p=>`<button class="chip" data-purp="${encodeURIComponent(p)}" style="${p==='Sold/Delivered'?'background:#dc2626;color:#fff;border-color:#dc2626':''}">${p==='Sold/Delivered'?'⚠ ':''}${p}</button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="field"><label>Or type a custom purpose</label>
      <input id="p-custom" placeholder="e.g., showroom display">
    </div>
    <button class="btn block" id="p-go">Use custom purpose</button>
  `);
  $$('[data-purp]').forEach(b=>b.addEventListener('click', ()=>{
    const purpose = decodeURIComponent(b.dataset.purp);
    if(purpose === 'Sold/Delivered'){
      if(!confirm(`This will DELETE the main key and any paired spare for ${k.reg}. Continue?`)) return;
    }
    cb(purpose);
  }));
  $('#p-go').onclick = ()=>{
    const v = ($('#p-custom').value||'').trim();
    if(!v){ toast('Type a purpose or pick one above'); return; }
    cb(v);
  };
}
function markIn(k){

  if(k.spare){
    closeSheet();
    k.status='available'; k.inSince=Date.now(); k.parking='BOX'; k.unassigned=false;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:'BOX'});
    notifyMovement(k, 'in', {parking:'BOX'});
    saveDB(); render(); toast(`${k.reg} (spare) returned to BOX`);
    return;
  }

  openKeyInSheet(k);
}

function openKeyInSheet(k){
  const initBranch = k.branch || db.user.branch;

  let chosen = { branch: initBranch, bay: k.parking || '' };
  let bayQuery = '';

  function renderSheet(){
    const allBays = [...new Set(db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.parking && x.parking.toUpperCase()!=='BOX').map(x=>x.parking))].sort();
    const occupiedBy = {};
    db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.id!==k.id && x.status==='available').forEach(x=>{
      occupiedBy[x.parking] = x;
    });

    const Q = bayQuery.trim().toLowerCase();
    const bays = Q ? allBays.filter(b => b.toLowerCase().includes(Q)) : allBays;

    const lastBay = k.parking || '';
    const lastBayConflict = lastBay ? occupiedBy[lastBay] : null;

    openSheet(`
      <h3 style="display:flex;align-items:center;gap:8px"><span class="btn-in" style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.6px">KEY IN</span> ${k.car}</h3>
      <div class="muted" style="margin-bottom:10px">${k.reg} · last branch: ${k.branch||'—'}</div>

      ${lastBay ? `
        <div class="card pad" style="background:#fff4d6;border-color:#fde68a;margin-bottom:10px">
          <div style="font-size:12px;color:#7a4a00;font-weight:700;letter-spacing:.4px">LAST CHECKED OUT FROM</div>
          <div style="font-size:22px;font-weight:900;font-family:ui-monospace,Menlo,monospace;margin:4px 0">📍 ${lastBay}</div>
          <button class="btn-in btn block" id="ki-reuse">Re-confirm bay ${lastBay}${lastBayConflict?` (⚠ now held by ${lastBayConflict.reg})`:''}</button>
        </div>
      `:''}

      <div class="field"><label>Branch</label>
        <select id="ki-branch">${db.branches.map(b=>`<option ${b===chosen.branch?'selected':''}>${b}</option>`).join('')}</select>
      </div>

      <button class="btn-transfer btn block" id="ki-map" style="margin-bottom:10px">🗺️ Pick bay from Parking Map</button>

      <div class="field"><label>Or pick a different bay</label>
        <div class="search" style="margin-bottom:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="ki-search" placeholder="Search bay number…" value="${bayQuery}">
        </div>
        <div class="filters" style="flex-wrap:wrap;padding-bottom:0;max-height:200px;overflow:auto">
          ${bays.length ? bays.map(b=>{
            const occ = occupiedBy[b];
            const since = occ ? lastInDays(occ) : 0;
            return `<button class="chip" data-ki-bay="${encodeURIComponent(b)}" style="${chosen.bay===b?'background:var(--brand);color:#fff;border-color:var(--brand);':occ?'background:#fee2e2;color:#991b1b;border-color:#fca5a5':'background:#dcfce7;color:#0a7d2b;border-color:#86efac'}">${b}${occ?` · <span style="font-size:10px">⚠ ${occ.reg} (${since}d)</span>`:' · ✓'}</button>`;
          }).join('') : '<div class="muted" style="font-size:12px;padding:4px">No matching bays</div>'}
        </div>
        <div class="muted" style="font-size:11px;margin-top:6px">Green = free · Red = occupied (will need force-replace)</div>
      </div>

      <div class="field"><label>Or type a brand-new bay</label>
        <input id="ki-bay-text" placeholder="e.g. 3-22" value="${chosen.bay}">
      </div>

      <button class="btn-in btn block" id="ki-go" style="padding:14px;font-size:15px">Check in to <span id="ki-go-label">${chosen.bay||'—'}</span></button>
    `);

    $('#ki-reuse')?.addEventListener('click', ()=>{
      chosen.bay = lastBay;
      $('#ki-go').click();
    });
    $('#ki-map')?.addEventListener('click', ()=>{
      selectingBayFor = { k, branch: chosen.branch };
      homeBranch = chosen.branch;
      closeSheet();
      go('map');
    });
    $('#ki-branch').addEventListener('change', e=>{ chosen.branch = e.target.value; chosen.bay=''; renderSheet(); });
    $('#ki-search').addEventListener('input', e=>{ bayQuery = e.target.value; renderSheet(); setTimeout(()=>{$('#ki-search')?.focus(); $('#ki-search').setSelectionRange(bayQuery.length, bayQuery.length);}, 0); });
    $$('[data-ki-bay]').forEach(b=>b.addEventListener('click', ()=>{
      chosen.bay = decodeURIComponent(b.dataset.kiBay);
      $('#ki-bay-text').value = chosen.bay;
      $('#ki-go-label').textContent = chosen.bay;
    }));
    $('#ki-bay-text').addEventListener('input', e=>{
      chosen.bay = e.target.value.trim();
      $('#ki-go-label').textContent = chosen.bay || '—';
    });
    $('#ki-go').onclick = ()=>{
      const bay = ($('#ki-bay-text').value||'').trim() || chosen.bay;
      if(!bay){ toast('Pick or type a bay'); return; }
      const conflict = bayConflictKey(bay, k.id);
      if(conflict){
        const days = lastInDays(conflict);
        if(!confirm(`Bay ${bay} is held by ${conflict.reg} (checked in ${days}d ago).\n\nForce replace?\n• ${conflict.reg} will be auto-checked-out and marked UNASSIGNED\n• Both actions recorded as FORCED in history`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay claimed) — UNASSIGNED', forced:true});
        notifyMovement(conflict, 'out', {purpose:'auto-closed (bay claimed) — UNASSIGNED', forced:true});
      }
      k.status = 'available'; k.inSince = Date.now(); k.branch = chosen.branch; k.parking = bay; k.unassigned = false;
      db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict});
      notifyMovement(k, 'in', {parking:bay, forced:!!conflict});
      saveDB(); closeSheet(); render(); toast(`${k.reg} checked in @ ${bay}${conflict?' (forced)':''}`);
    };
  }
  renderSheet();
}

function lastInDays(k){
  if(k.inSince) return Math.floor((Date.now() - k.inSince)/DAY);
  const last = db.history.find(h=>h.keyId===k.id && h.type==='in');
  return last ? Math.floor((Date.now() - last.ts)/DAY) : 0;
}

function doCheckInToBay(k, branch, bay){
  if(!k || !branch || !bay) return false;
  const conflict = db.keys.find(x => !x.spare && x.id!==k.id && x.branch===branch && (x.parking||'').toUpperCase()===bay.toUpperCase() && bay.toUpperCase()!=='BOX' && x.status==='available');
  if(conflict){
    if(!confirm(`Bay ${bay} held by ${conflict.reg} (${lastInDays(conflict)}d). Force replace?\n• Old key auto-checked-out and marked UNASSIGNED\n• Both actions logged as FORCED`)) return false;
    if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
    conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
    db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
    notifyMovement(conflict, 'out', {purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
  }
  k.status='available'; k.inSince = Date.now(); k.branch = branch; k.parking = bay; k.unassigned = false;
  db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict});
  notifyMovement(k, 'in', {parking:bay, forced:!!conflict});
  saveDB(); render();
  toast(`${k.reg} checked in @ ${bay}${conflict?' (forced)':''}`);
  return true;
}

// Triggered from #f-map. Captures form state then navigates to the map. Debounced.
let __mapPickLockUntil = 0;
function triggerAddKeyMapPick(ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const now = Date.now();
  if(now < __mapPickLockUntil) return;
  __mapPickLockUntil = now + 1500;

  const f = document.getElementById('f-branch');
  if(!f){ alert('Form not ready — please reopen the Add Key form'); return; }
  const existing = window.__addKeyExisting;
  const branch = f.value || db.user.branch;

  // Capture every form field BEFORE we tear down the sheet
  pendingAddKeyForm = {
    car:       document.getElementById('f-car')?.value || '',
    reg:       document.getElementById('f-reg')?.value || '',
    dealer:    document.getElementById('f-dealer')?.value || '',
    branch,
    serial:    document.getElementById('f-serial')?.value || '',
    id:        document.getElementById('f-id')?.value || '',
    mode:      document.getElementById('f-create')?.value,
    spareEdit: document.getElementById('f-spare')?.value,
    prevDays:  document.getElementById('f-prev-days')?.value,
    prevHours: document.getElementById('f-prev-hours')?.value,
    existing:  !!existing,
    existingId: existing?.id,
  };
  selectingBayFor = { action:'add-key', branch };
  homeBranch = branch;

  // ----- Direct DOM manipulation: bypass render() to avoid any race -----
  // 1. Force the sheet closed
  const scrim = document.getElementById('scrim');
  if(scrim){ scrim.classList.remove('open'); }
  const sheet = document.getElementById('sheet');
  if(sheet){ sheet.innerHTML = ''; }

  // 2. Flip the global view state
  view = 'map';
  navStack.push('map');
  try { history.pushState({nav:'map'}, '', '#map'); } catch(_){}

  // 3. Directly inject the map HTML into #main
  const main = document.getElementById('main');
  if(main){
    try { main.innerHTML = viewParkingMap(); }
    catch(e){ alert('Map view error: ' + (e?.message || e)); return; }
    // Re-paint any QRs inside the rendered map
    main.querySelectorAll('.qrwrap[data-payload]').forEach(el=>{
      try { qrInto(el, el.dataset.payload, 64); } catch(_){}
    });
  }

  // 4. Update bottom tabs + back button
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view==='map'));
  const btnBack = document.getElementById('btn-back');
  if(btnBack){ btnBack.style.display = 'grid'; }
  window.scrollTo(0,0);
}

// Document-level capture-phase delegation — fires once per click regardless of DOM location.
document.addEventListener('click', e=>{
  const btn = e.target.closest('#f-map');
  if(btn){ triggerAddKeyMapPick(e); return; }
  // Sheet-content button handlers — these fire on clicks inside #sheet which is OUTSIDE #main
  const moveSpare = e.target.closest('[data-move-spare]');
  if(moveSpare){ openMoveSpareSheet(moveSpare.dataset.moveSpare); return; }
  const forceRep = e.target.closest('[data-force-replace]');
  if(forceRep){ openForceReplaceSheet(forceRep.dataset.forceReplace); return; }
}, true);

// Bay editor drag handlers — only meaningful when view==='bayedit'
document.addEventListener('pointerdown', e=>{
  if(view !== 'bayedit') return;
  // In delete mode, do NOT drag — let the click handler delete instead.
  if(bayEditor.deleteMode) return;
  if(e.target.closest('.be-draft') || e.target.closest('.be-saved')
     || e.target.closest('.be-built') || e.target.closest('.be-label')){
    beStartDrag(e);
  }
}, true);
document.addEventListener('pointermove', e=>{ if(beDrag) beMoveDrag(e); }, true);
document.addEventListener('pointerup',   e=>{ if(beDrag) beEndDrag(e);   }, true);
document.addEventListener('pointercancel', e=>{ if(beDrag) beEndDrag(e); }, true);

// (dblclick rename removed — replaced by tap-to-select inline edit panel)

function openAddKey(existing){

  const k = existing || {id:'K-'+String(db.keys.length+1).padStart(3,'0'), serial:nextSerial(), pairId:nextPairId(), car:'', reg:'', dealer:(db.dealers?.[0]||db.user.dealer), branch:db.user.branch, parking:'', spare:false, status:'available', inSince:Date.now(), totalParkedMs:0, createdBy:db.user.name};

      <div class="field"><label>Dealer ${isAdmin()?'<a href="#" id="f-newdealer" style="font-size:11px">+ new</a>':''}</label>

      </div>
      <div class="field"><label>Branch</label><select id="f-branch">${branchOpts}</select></div>
    </div>
    <div class="field"><label>Parking bay</label>
      <button type="button" class="btn-transfer btn block" id="f-map" style="margin-bottom:6px">🗺️ Pick bay from Parking Map</button>
      <select id="f-parking-sel">
        <option value="">— Pick or type new —</option>
      </select>
      <input id="f-parking" value="${k.parking}" placeholder="or type a new bay" style="margin-top:6px">
      <div id="f-bay-warn" class="muted" style="font-size:11px;margin-top:4px">1 bay = 1 main key. Spares always go to BOX.</div>
    </div>
    ${existing ? `
      <div class="field"><label>Key type</label>
        <select id="f-spare"><option value="false" ${!k.spare?'selected':''}>Main key</option><option value="true" ${k.spare?'selected':''}>Spare key (SK_)</option></select>
      </div>
    ` : `
      <div class="field"><label>What to create</label>
        <select id="f-create">
          <option value="main">Main key only</option>
          <option value="pair" selected>Main + Spare (auto-paired)</option>
          <option value="spare">Spare key only</option>
        </select>
      </div>
    `}
    <input id="f-id" type="hidden" value="${k.id}">
    ${isAdmin() ? (()=>{
      const totalMs = k.totalParkedMs || 0;
      const days = Math.floor(totalMs / DAY);
      const hours = Math.floor((totalMs % DAY) / HOUR);
      return `
        <div class="card pad" style="background:#fff7ed;border:1px solid #fdba74;padding:10px;margin:8px 0">
          <div style="font-size:11px;color:#9a3412;font-weight:800;letter-spacing:.5px;margin-bottom:6px">PREVIOUS PARKING TIME (ADMIN)</div>
          <div class="muted" style="font-size:12px;margin-bottom:8px">Carry over the total parking time from the old CARNET app. The new app keeps adding to this on top.</div>
          <div class="row">
            <div class="field"><label>Days</label><input id="f-prev-days" type="number" min="0" value="${days}"></div>
            <div class="field"><label>Hours</label><input id="f-prev-hours" type="number" min="0" max="23" value="${hours}"></div>
          </div>
          <div class="muted" style="font-size:11px">Current total: <b id="f-prev-preview">${fmtDur(totalMs)}</b></div>
        </div>
      `;
    })() : ''}
    <div class="muted" style="font-size:12px;margin-bottom:8px">Sticker label preview: <b id="f-preview">${k.spare?'SK_':''}${k.serial||''}</b></div>
    <button class="btn block" id="f-save">${existing?'Save changes':'Create'}</button>
  `);

  function refreshPrevPreview(){
    const d = parseInt($('#f-prev-days')?.value||'0',10) || 0;
    const h = parseInt($('#f-prev-hours')?.value||'0',10) || 0;
    const ms = d*DAY + h*HOUR;
    if($('#f-prev-preview')) $('#f-prev-preview').innerHTML = fmtDur(ms);
  }
  $('#f-prev-days')?.addEventListener('input', refreshPrevPreview);
  $('#f-prev-hours')?.addEventListener('input', refreshPrevPreview);

  $('#f-spare')?.addEventListener('change', e=>{
    const isSpare = e.target.value==='true';
    $('#f-preview').textContent = (isSpare?'SK_':'') + ($('#f-serial').value || '');
  });
  $('#f-create')?.addEventListener('change', e=>{
    const v = e.target.value;
    $('#f-preview').textContent = (v==='spare'?'SK_':'') + ($('#f-serial').value || '') + (v==='pair'?' + SK_':'');
    $('#f-parking').disabled = (v==='spare') || !isAdmin();
    $('#f-parking-sel').disabled = (v==='spare') || !isAdmin();
  });

  function refreshBays(){
    const branch = $('#f-branch').value;
    const sel = $('#f-parking-sel');
    const set = new Set();
    db.keys.filter(x=>!x.spare && x.branch===branch && x.parking && x.parking.toUpperCase()!=='BOX').forEach(x => set.add(x.parking));
    // Pull bays from EVERY map associated with this branch (built-ins, customs, blanks)
    getBaysForBranch(branch).forEach(b => set.add(b.id));
    const bays = [...set].sort((a,b)=> String(a).localeCompare(String(b), undefined, {numeric:true}));
    sel.innerHTML = '<option value="">— Pick or type new —</option>' + bays.map(b=>{
      const disabled = isBayDisabled(b, branch);
      const occ = bayConflictKey(b, k.id);
      const days = occ ? lastInDays(occ) : 0;
      let label;
      if(disabled)  label = `${b} 🚫 NOT AVAILABLE`;
      else if(occ)  label = `${b} ⚠ occupied by ${occ.reg} (${days}d)`;
      else          label = `${b} ✓ free`;
      return `<option value="${b}" ${disabled?'disabled':''}>${label}</option>`;
    }).join('');
  }
  refreshBays();
  $('#f-branch').addEventListener('change', refreshBays);
  $('#f-parking-sel').addEventListener('change', e=>{
    if(e.target.value){
      $('#f-parking').value = e.target.value;
      const occ = bayConflictKey(e.target.value, k.id);
      $('#f-bay-warn').innerHTML = occ
        ? `<span style="color:#991b1b;font-weight:700">⚠ Bay occupied by ${occ.reg}. You can still save — the new entry will be marked <b>FORCED</b> and the old key auto-checked-out.</span>`
        : '1 bay = 1 main key. Spares always go to BOX.';
    }
  });

  // Stash `existing` so the global click delegation can read it (sheets live outside #main)
  window.__addKeyExisting = existing || null;
  // #f-map is wired via the global document-level capture-phase delegation above — no need to re-bind here
  $('#f-newdealer')?.addEventListener('click', e=>{
    e.preventDefault();
    if(!isAdmin()){ toast('Only admins can add a new dealer'); return; }
    const v = prompt('New dealer name:');
    if(v && v.trim()){
      if(db.dealers.includes(v.trim())){ toast('Dealer already exists'); return; }
      db.dealers.push(v.trim()); saveDB();
      const opt = document.createElement('option'); opt.textContent=v.trim(); opt.selected=true;
      $('#f-dealer').appendChild(opt);
    }
  });

  $('#f-save').onclick = ()=>{
    const car = $('#f-car').value.trim();
    const reg = $('#f-reg').value.trim().toUpperCase();
    const dealer  = $('#f-dealer').value.trim();
    const branch  = $('#f-branch').value;
    const parking = $('#f-parking').value.trim();
    if(!car || !reg){ toast('Need car + registration'); return; }

    let prevMs = null;
    if(isAdmin() && ($('#f-prev-days') || $('#f-prev-hours'))){
      const d = parseInt($('#f-prev-days')?.value||'0',10) || 0;
      const h = parseInt($('#f-prev-hours')?.value||'0',10) || 0;
      prevMs = Math.max(0, d*DAY + h*HOUR);
    }

    if(existing){
      const spare = $('#f-spare').value === 'true';
      if(!spare){
        const conflict = bayConflictKey(parking, existing.id);
        if(conflict){
          if(!confirm(`Bay ${parking} held by ${conflict.reg} — force replace? Old key auto-checked-out and marked UNASSIGNED.`)) return;
          if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
          conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
          db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
          notifyMovement(conflict, 'out', {purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
        }
      }
      Object.assign(existing, { car, reg, dealer, branch, parking: spare ? (parking||'BOX') : parking, spare });

      if(prevMs !== null){
        existing.totalParkedMs = prevMs;

        if(existing.status === 'available') existing.inSince = Date.now();
      }
      saveDB(); closeSheet(); render(); toast('Saved');
      return;
    }

    const mode = $('#f-create').value;
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1).padStart(3,'0');
    const common = { car, reg, dealer, branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };

    let forcedConflict = null;
    if(mode!=='spare'){
      const conflict = bayConflictKey(parking);
      if(conflict){
        if(!confirm(`Bay ${parking} held by ${conflict.reg}. Force-add anyway? Old key auto-checked-out.`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed)', forced:true});
        forcedConflict = conflict;
      }
    }
    const created = [];
    if(mode==='main' || mode==='pair'){
      created.push({ ...common, id: baseId,        serial: nextSerial(), parking: parking || '', spare:false });
    }
    if(mode==='spare' || mode==='pair'){
      const tmpDb = [...db.keys, ...created];
      const max = tmpDb.reduce((m,k)=>{ const n = parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      created.push({ ...common, id: baseId+'S',     serial: String(max+1), parking: 'BOX', spare:true });
    }
    if(!created.length){ toast('Pick what to create'); return; }

    if(prevMs !== null){
      created.forEach(c=>{
        c.totalParkedMs = prevMs;

        if(c.status === 'available') c.inSince = Date.now();
      });
    }
    db.keys.unshift(...created);
    // Log each new key as a 'created' event in Recent Activity
    created.forEach(c => {
      db.history.unshift({ts:Date.now(), type:'created', keyId:c.id, user:db.user.name, parking:c.parking||'', spare:c.spare});
    });
    saveDB(); closeSheet(); render();
    toast(`Created ${created.length} key${created.length>1?'s':''}${prevMs?' · prior parking carried over':''}`);
  };
}

/* ---------- branch transfer (from key profile or Home) ---------- */
function openTransfer(k){
  if(!db.branches.length){ toast('No branches configured'); return; }

  const currentBranch = k.branch || db.branches[0];
  const branchList = db.branches;

  const defaultDest = branchList.find(b => b !== currentBranch) || currentBranch;
  let chosen = { branch: defaultDest, bay: '' };
  let bayQuery = '';

  function renderSheet(){
    const branchOpts = branchList.map(b=>{
      const sameLabel = (b===currentBranch) ? ' (current — change bay only)' : '';
      return `<option value="${b}" ${b===chosen.branch?'selected':''}>${b}${sameLabel}</option>`;
    }).join('');
    const allBays = [...new Set(db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.parking && x.parking.toUpperCase()!=='BOX').map(x=>x.parking))].sort();
    const Q = bayQuery.trim().toLowerCase();
    const bays = Q ? allBays.filter(b=>b.toLowerCase().includes(Q)) : allBays;
    const occupied = {};
    db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.id!==k.id && x.status==='available').forEach(x=>{ occupied[x.parking]=x; });

    openSheet(`
      <h3 style="display:flex;align-items:center;gap:8px"><span class="btn-transfer" style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.6px">TRANSFER</span> ${k.car}</h3>
      <div class="muted" style="margin-bottom:10px">${k.reg} · currently at <b>${k.branch||'?'}</b> · 📍 ${k.parking||'—'}</div>

      <div class="field"><label>Move to branch</label>
        <select id="t-to">${branchOpts}</select>
      </div>

      <button class="btn-transfer btn block" id="t-map" style="margin-bottom:10px">🗺️ Pick bay from Parking Map (destination)</button>

      <div class="field"><label>Or pick a bay in ${chosen.branch}</label>
        <div class="search" style="margin-bottom:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="t-search" placeholder="Search bay number…" value="${bayQuery}">
        </div>
        <div class="filters" style="flex-wrap:wrap;padding-bottom:0;max-height:160px;overflow:auto">
          ${bays.length ? bays.map(b=>{
            const occ = occupied[b];
            const since = occ ? lastInDays(occ) : 0;
            return `<button class="chip" data-t-bay="${encodeURIComponent(b)}" style="${chosen.bay===b?'background:var(--brand);color:#fff;border-color:var(--brand)':occ?'background:#fee2e2;color:#991b1b;border-color:#fca5a5':'background:#dcfce7;color:#0a7d2b;border-color:#86efac'}">${b}${occ?` · <span style="font-size:10px">⚠ ${occ.reg} (${since}d)</span>`:' · ✓'}</button>`;
          }).join('') : '<div class="muted" style="font-size:12px;padding:4px">No bays found</div>'}
        </div>
        <div class="muted" style="font-size:11px;margin-top:6px">Green = free · Red = occupied (force-replace)</div>
      </div>

      <div class="field"><label>Or type a new bay</label><input id="t-park" placeholder="e.g. B2-15" value="${chosen.bay || k.parking || ''}"></div>
      <div class="field"><label>Note (optional)</label><input id="t-note" placeholder="e.g. rebalance stock, customer request"></div>
      <button class="btn-transfer btn block" id="t-go" style="padding:14px;font-size:15px">Confirm transfer</button>
    `);
    $('#t-to').addEventListener('change', e=>{ chosen.branch = e.target.value; chosen.bay=''; renderSheet(); });
    $('#t-search').addEventListener('input', e=>{ bayQuery = e.target.value; renderSheet(); setTimeout(()=>{ const i=$('#t-search'); if(i){i.focus(); i.setSelectionRange(bayQuery.length,bayQuery.length);} }, 0); });
    $$('[data-t-bay]').forEach(b=>b.addEventListener('click', ()=>{
      chosen.bay = decodeURIComponent(b.dataset.tBay);
      $('#t-park').value = chosen.bay;
    }));
    $('#t-park').addEventListener('input', e=>{ chosen.bay = e.target.value.trim(); });
    $('#t-map').addEventListener('click', ()=>{
      const to = $('#t-to').value;
      const note = $('#t-note').value.trim();
      selectingBayFor = { action:'transfer', k, branch:to, note, from:k.branch };
      homeBranch = to;
      closeSheet();
      go('map');
    });
    $('#t-go').onclick = ()=>{
      const to   = $('#t-to').value;
      const bay  = ($('#t-park').value || '').trim() || k.parking || '';
      const note = $('#t-note').value.trim();
      if(!to){ toast('Pick a branch'); return; }
      const from = k.branch || '?';
      const sameBranch = (to === from);
      if(sameBranch && bay && bay.toUpperCase() === (k.parking||'').toUpperCase()){
        toast('Same branch and same bay — nothing to change'); return;
      }

      const conflict = db.keys.find(x => !x.spare && x.id!==k.id && x.branch===to && (x.parking||'').toUpperCase()===bay.toUpperCase() && bay && bay.toUpperCase()!=='BOX' && x.status==='available');
      if(conflict){
        if(!confirm(`Bay ${bay} in ${to} held by ${conflict.reg}. Force replace? Old key marked UNASSIGNED.`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
        notifyMovement(conflict, 'out', {purpose:'auto-closed (transferred-in) — UNASSIGNED', forced:true});
      }
      if(sameBranch){

        k.parking = bay; k.unassigned = false;
        if(k.status==='out'){ k.status='available'; k.inSince = Date.now(); }
        db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict, note:note||'bay change via Transfer'});
        notifyMovement(k, 'in', {parking:bay, forced:!!conflict});
        saveDB(); closeSheet(); render(); toast(`${k.reg} bay → ${bay}${conflict?' (forced)':''}`);
      } else {
        db.history.unshift({ts:Date.now(), type:'transfer', keyId:k.id, user:db.user.name, from, to, note});
        notifyMovement(k, 'transfer', {from, to, note, forced:!!conflict});
        k.branch = to; k.parking = bay; k.unassigned = false;
        saveDB(); closeSheet(); render(); toast(`${k.reg} → ${to}${bay?' · '+bay:''}${conflict?' (forced)':''}`);
      }
    };
  }
  renderSheet();
}

function openNotifications(){

  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    try { Notification.requestPermission().then(()=>{}); } catch(_){}
  }
  const mine = (db.notifications||[]).filter(n => n.forUser === db.user.name).sort((a,b)=>b.ts-a.ts).slice(0,60);
  const unread = mine.filter(n=>!n.read).length;
  const palette = (t)=>(
    t==='in'? {tag:'IN', bg:'#dcfce7', fg:'#0a7d2b'} :
    t==='out'?{tag:'OUT',bg:'#fee2e2', fg:'#7f1d1d'} :
    t==='transfer'?{tag:'TRANSFER',bg:'#dbeafe',fg:'#1e40af'} :
    t==='overdue'?{tag:'OVERDUE',bg:'#fef3c7',fg:'#7a4a00'} :
    {tag:'DELETED',bg:'#374151',fg:'#f3f4f6'}
  );
  openSheet(`
    <h3 style="display:flex;align-items:center;gap:8px">🔔 Notifications <span class="muted" style="font-weight:400;font-size:13px">(${db.user.name})</span></h3>
    <div class="muted" style="margin-bottom:10px;font-size:13px">You'll be pinged any time someone moves a car you added (Key In / Out / Transfer / Delete).</div>

      <button class="btn secondary" id="nt-readall">${unread?'Mark all read':'All read ✓'}</button>
      <button class="btn secondary" id="nt-clear">Clear all</button>

    ${typeof Notification !== 'undefined' && Notification.permission === 'denied' ? `
      <div class="card pad muted" style="font-size:12px">⚠ Browser notifications are blocked. You'll still see this list, but won't get pop-ups when the app is in the background.</div>
    ` : (typeof Notification !== 'undefined' && Notification.permission === 'default' ? `
      <button class="btn-add btn block" id="nt-allow" style="margin-bottom:8px">Allow browser pop-ups</button>
    ` : '')}

    ${mine.length ? mine.map(n=>{

      const line =
        n.type==='in'        ? `Checked in @ ${n.details?.parking||'—'}` :
        n.type==='out'       ? `Purpose: ${n.details?.purpose||'—'}` :
        n.type==='transfer'  ? `${n.details?.from||'?'} → ${n.details?.to||'?'}` :
        n.type==='overdue'   ? `⏰ ${n.details?.purpose||'—'} · ${n.details?.over||0}m past limit · last out by ${n.details?.owner||'?'}` :
                               `Removed${n.details?.purpose?' · '+n.details.purpose:''}`;
      return `<div class="key-card" data-nt-key="${n.keyId}" data-nt-id="${n.id}" style="margin-bottom:6px;${!n.read?'background:#fff7ed;border-left:4px solid #FF3D00':''}">
        <div style="width:64px;height:64px;border-radius:10px;background:${p.bg};display:grid;place-items:center;font-weight:800;font-size:11px;color:${p.fg};letter-spacing:.6px">${p.tag}</div>
        <div>
          <div class="title">${n.car} <span class="muted" style="font-weight:400">· ${n.reg}</span></div>
          <div class="meta"><span>${line}</span>${n.details?.forced?'<span style="background:#475569;color:#fff;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800">FORCED</span>':''}</div>
          <div class="meta"><span class="muted">by ${n.actor}</span><span class="muted">${fmt(n.ts)}</span></div>
        </div>
        <div class="muted">›</div>
      </div>`;
    }).join('') : '<div class="empty">No notifications yet</div>'}
  `);

  $$('[data-nt-key]').forEach(el=>el.addEventListener('click', ()=>{

/* ---------- scanner ---------- */
let scanner = null;
let scanAudio = null;

function scanBeep(){
  try {
    if(!scanAudio){ scanAudio = new (window.AudioContext || window.webkitAudioContext)(); }
    if(scanAudio.state === 'suspended') scanAudio.resume();
    const ctx = scanAudio;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 880;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(_){}

  try { navigator.vibrate && navigator.vibrate(60); } catch(_){}
}

async function applyCameraZoom(zoomFactor){
  try {
    const v = document.querySelector('#scan-region video');
    if(!v || !v.srcObject) return;
    const track = v.srcObject.getVideoTracks?.()[0]; if(!track) return;
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    if(typeof caps.zoom === 'object'){
      const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoomFactor));
      await track.applyConstraints({ advanced: [{ zoom: z }] });
    } else {

      v.style.transform = `scale(${zoomFactor})`;
      v.style.transformOrigin = 'center';
    }
  } catch(_){}
}

async function startScanner(){
  const region = $('#scan-region');
  if(!region) return;

  if(location.protocol === 'file:' || !window.isSecureContext){ return; }
  if(typeof Html5Qrcode === 'undefined'){
    region.innerHTML = `<div class="empty">Scanner library didn't load. Check internet and refresh.</div>`;
    return;
  }
  try {
    scanner = new Html5Qrcode('scan-region', {verbose:false});
    await scanner.start({facingMode:'environment'},
      {fps:12, qrbox:{width:280,height:280}, aspectRatio: 1.0, disableFlip:false},
      onScan, ()=>{});

    setTimeout(()=>applyCameraZoom(1.8), 600);
  } catch(e){
    region.innerHTML = `<div class="empty">Camera unavailable: ${e.message||e}<br>Use "Take photo" or "Pick from gallery" below.</div>`;
  }
}
async function scanFromFile(e){
  const f = e.target.files?.[0]; if(!f) return;
  if(typeof Html5Qrcode === 'undefined'){
    toast('Scanner library not loaded — check internet');

function runManualLookup(){
  const q = ($('#scan-manual')?.value || '').trim();
  if(!q){ toast('Type a plate, serial, or key ID'); return; }

  const exact = db.keys.find(k=>k.serial===q)
             || db.keys.find(k=>k.id===q)
             || db.keys.find(k=>(k.reg||'').toUpperCase()===q.toUpperCase())
             || db.keys.find(k=>`SK_${k.serial}`===q);
  if(exact){ openKey(exact.id); return; }

  const Q = q.toLowerCase();
  const matches = db.keys.filter(k=>[k.id,k.serial,k.reg,k.car,k.branch].join(' ').toLowerCase().includes(Q)).slice(0,6);
  const out = $('#scan-manual-results');
  if(!out) return;
  if(!matches.length){ out.innerHTML = `<div class="muted">No matches.</div>`; return; }
  out.innerHTML = matches.map(k=>`
    <div class="key-card" data-id="${k.id}" style="margin-bottom:6px">
      <div class="qrwrap" data-payload="${qrPayload(k)}"></div>
      <div><div class="title">${k.car}</div><div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span></div></div>
      <div class="muted">›</div>
    </div>
  `).join('');

  $$('#scan-manual-results .qrwrap[data-payload]').forEach(el=>qrInto(el, el.dataset.payload, 56));
}
function onScan(text){
  if(scanner){ scanner.stop().catch(()=>{}); scanner=null; }
  const raw  = (text||'').trim();
  const parts = raw.split('|');

  let k = null;
  if(parts[0]==='CARNET'){
    k = db.keys.find(x => x.id === parts[1])
     || db.keys.find(x => x.serial === parts[1])
     || db.keys.find(x => (x.reg||'').toUpperCase() === (parts[2]||'').toUpperCase());
  } else if(parts[0]==='USER'){
    toast('User QR scanned: '+(parts[1]||''));
    pendingAction = null;
    return;
  } else {
    k = db.keys.find(x => x.serial === raw)
     || db.keys.find(x => x.id === raw)
     || db.keys.find(x => (x.reg||'').toUpperCase() === raw.toUpperCase())
     || db.keys.find(x => `SK_${x.serial}` === raw);
  }

  if(!k){ toast('No matching key: '+raw.slice(0,40)); pendingAction=null; return; }
  scanBeep();

  if(pendingAction){
    const action = pendingAction;
    pendingAction = null;
    go('home', false);
    runActionOnKey(k, action);
    return;
  }
  openKey(k.id);
}

/* ---------- export / import ---------- */
function download(name, content, type='text/plain'){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function csvEsc(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replaceAll('"','""')+'"' : v; }

function exportKeysCSV(){
  if(!isAdmin()){ toast('Export is admin-only'); return; }
  const rows = [['id','serial','serial_display','car','reg','dealer','branch','parking','spare','status','total_parked_ms','total_parked_human','in_since_iso','qr_payload']];
  db.keys.forEach(k=>{
    const total = totalParkedMs(k);
    rows.push([k.id, k.serial||'', serialDisplay(k), k.car, k.reg, k.dealer, k.branch||'', k.parking, k.spare, k.status, total, fmtDur(total), k.inSince?new Date(k.inSince).toISOString():'', qrPayload(k)]);
  });
  download('carnet-keys.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'), 'text/csv');
  toast('Exported '+db.keys.length+' keys');
}
function exportHistoryCSV(){
  if(!isAdmin()){ toast('Export is admin-only'); return; }
  const rows = [['timestamp','type','keyId','reg','car','user','purpose','parking','from_branch','to_branch','note']];
  db.history.forEach(h=>{
    const k = db.keys.find(k=>k.id===h.keyId) || {};
    rows.push([new Date(h.ts).toISOString(), h.type, h.keyId, k.reg||'', k.car||'', h.user||'', h.purpose||'', h.parking||'', h.from||'', h.to||'', h.note||'']);
  });
  download('carnet-history.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'), 'text/csv');
  toast('Exported '+db.history.length+' moves');
}
/* ---------- PDF reports (jsPDF + autoTable) ---------- */
function makePdf(){
  const ns = window.jspdf || {};
  const J = ns.jsPDF || window.jsPDF;
  if(!J){ toast('PDF library not loaded — check internet'); return null; }
  const doc = new J({ unit:'mm', format:'a4' });

  doc.setFillColor(0,0,0); doc.rect(0, 0, 210, 14, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('CARNET Key OS', 10, 9);
  doc.setTextColor(255,61,0); doc.text('V', 10 + doc.getTextWidth('CAR'), 9);
  doc.setTextColor(255,255,255); doc.setFontSize(9);
  doc.text(`Generated ${new Date().toLocaleString()}  ·  ${db.user.name} (${db.user.role})`, 10, 13);
  doc.setTextColor(0,0,0);
  return doc;
}

function pdfMyKeys(){
  const doc = makePdf(); if(!doc) return;
  const isAd = isAdmin();
  const mine = db.keys.filter(k => isAd || k.createdBy === db.user.name);
  doc.setFontSize(15); doc.setFont('helvetica','bold');

  doc.autoTable({
    startY: 28, theme:'grid',
    styles:{ fontSize:8, cellPadding:1.6 },
    headStyles:{ fillColor:[0,0,0], textColor:[255,255,255] },
    head:[['Serial','Plate','Car','Branch','Bay','Type','Status','Dealer','Created by']],
    body: mine.map(k=>[serialDisplay(k), k.reg, k.car, k.branch||'', k.parking||'', k.spare?'Spare':'Main', k.unassigned?'UNASSIGNED':k.status, k.dealer||'', k.createdBy||'']),
  });
  doc.save(`carnet-${isAd?'all-keys':'my-keys'}-${stamp()}.pdf`);
  toast('PDF saved');

function pdfMyHistory(){
  const doc = makePdf(); if(!doc) return;
  const isAd = isAdmin();
  const myKeyIds = new Set(db.keys.filter(k => isAd || k.createdBy === db.user.name).map(k=>k.id));

  const rows = db.history.filter(h => {
    if(isAd) return true;
    if(myKeyIds.has(h.keyId)) return true;
    return h.snapshot && h.snapshot.createdBy === db.user.name;
  }).slice().sort((a,b)=>b.ts-a.ts).slice(0, 1000);
  doc.setFontSize(15); doc.setFont('helvetica','bold');
  doc.text(`${isAd?'All movement history':'My movement history'} · ${rows.length} entries`, 10, 24);
  doc.autoTable({
    startY: 28, theme:'grid',
    styles:{ fontSize:8, cellPadding:1.6 },
    headStyles:{ fillColor:[0,0,0], textColor:[255,255,255] },
    head:[['When','Type','Plate','Car','Purpose / Bay / Branch','User','Force']],
    body: rows.map(h=>{
      const k = db.keys.find(x=>x.id===h.keyId) || h.snapshot || {};
      const detail =
        h.type==='out'       ? `Purpose: ${h.purpose||'—'}` :
        h.type==='in'        ? `Bay: ${h.parking||'—'}` :
        h.type==='transfer'  ? `${h.from||'?'} → ${h.to||'?'}${h.note?' · '+h.note:''}` :
                               `${h.purpose||''}`;
      return [new Date(h.ts).toLocaleString(), h.type.toUpperCase(), k.reg||'', k.car||'', detail, h.user||'', h.forced?'YES':''];
    }),
  });
  doc.save(`carnet-${isAd?'history-all':'history-mine'}-${stamp()}.pdf`);
  toast('PDF saved');
}

function pdfAgingReport(){
  if(!isAdmin()){ toast('Admin only'); return; }
  const doc = makePdf(); if(!doc) return;
  const items = db.keys.filter(k=>!k.spare && isOver180(k)).sort((a,b)=>currentParkedMs(b)-currentParkedMs(a));
  doc.setFontSize(15); doc.setFont('helvetica','bold');
  doc.text(`Aging report (>180 days) · ${items.length} cars`, 10, 24);
  doc.autoTable({
    startY: 28, theme:'grid',
    styles:{ fontSize:9, cellPadding:1.8 },
    headStyles:{ fillColor:[180,69,9], textColor:[255,255,255] },
    head:[['Plate','Car','Days parked','Dealer','Branch','Bay','Serial']],
    body: items.map(k=>[k.reg, k.car, ageDays(k), k.dealer||'', k.branch||'', k.parking||'', serialDisplay(k)]),
  });
  doc.save(`carnet-aging-${stamp()}.pdf`);
  toast('PDF saved');
}
function stamp(){ const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`; }

function importFile(e){
  const f = e.target.files?.[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const txt = rd.result;
    try {
      if(f.name.endsWith('.json')){
        const obj = JSON.parse(txt);
        if(obj.keys) db = obj; else throw 0;
      } else {

        const lines = txt.trim().split(/\r?\n/);
        const head = lines.shift().toLowerCase().split(',');
        const idx = name => head.indexOf(name);
        const got = lines.map(l=>{
          const cols = parseCsvLine(l);
          return {
            id: cols[idx('id')] || ('K-'+Math.random().toString(36).slice(2,6).toUpperCase()),
            car: cols[idx('car')] || '',
            reg: (cols[idx('reg')]||'').toUpperCase(),
            dealer: cols[idx('dealer')] || '',
            parking: cols[idx('parking')] || '',
            spare: /true|1|yes/i.test(cols[idx('spare')]||''),
            status: cols[idx('status')] || 'available',
          };
        }).filter(k=>k.car && k.reg);

        const map = new Map(db.keys.map(k=>[k.id,k]));
        got.forEach(k=>map.set(k.id,k));
        db.keys = [...map.values()];
      }
      saveDB(); render(); toast('Imported');
    } catch(err){ toast('Import failed'); }
  };
  rd.readAsText(f);
}
function parseCsvLine(l){
  const out=[]; let cur='', q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(q){ if(c==='"' && l[i+1]==='"'){cur+='"'; i++;} else if(c==='"'){q=false;} else cur+=c; }
    else { if(c===','){ out.push(cur); cur=''; } else if(c==='"'){ q=true; } else cur+=c; }
  }
  out.push(cur); return out;
}
