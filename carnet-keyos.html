<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>CARNET Key OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Arial Black,system-ui' font-size='30' font-weight='900' text-anchor='middle' fill='%23fff'%3EC%3C/text%3E%3Cpath d='M22 12 L32 50 L42 12' stroke='%23FF3D00' stroke-width='4' fill='none' opacity='.0'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.0/dist/jspdf.plugin.autotable.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/jspdf-autotable@3.8.0/dist/jspdf.plugin.autotable.min.js';"></script>
<style>
  :root{
    /* CARNET theme — white bg, black text, orange brand accent */
    --bg:#ffffff; --card:#ffffff; --text:#000000; --muted:#6b7280;
    --brand:#FF3D00;         /* CARNET orange-red (the 'V' in the logo) */
    --brand-2:#FF6E40;
    --accent:#FF3D00;
    --good:#e6f7ec; --good-fg:#0a7d2b;
    --bad:#fde7e7;  --bad-fg:#b71c1c;
    --warn:#fff4d6; --warn-fg:#7a4a00;
    --border:#e5e7eb; --hover:#f3f4f6;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
    --radius:14px;
    --topbar-bg:#000000;     /* CARNET logo background = black */
    --topbar-fg:#ffffff;
    /* Action colors (consistent app-wide) */
    --action-in:#16a34a;       /* Key In   = green   */
    --action-out:#dc2626;      /* Key Out  = red     */
    --action-transfer:#0ea5e9; /* Transfer = blue    */
    --action-add:#FF3D00;      /* Add      = CARNET orange */
    --action-force:#9ca3af;    /* Forced   = neutral gray (clear grey) */
  }
  .btn-in       { background:var(--action-in)      ; color:#fff }
  .btn-out      { background:var(--action-out)     ; color:#fff }
  .btn-transfer { background:var(--action-transfer); color:#fff }
  .btn-add      { background:var(--action-add)     ; color:#fff }
  .btn-force    { background:var(--action-force)   ; color:#fff }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand)}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid #000;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .logo{font:900 22px/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:1px;display:flex;align-items:center;flex:1;font-style:italic;transform:skewX(-6deg);user-select:none}
  .topbar .logo .v{color:var(--brand);display:inline-block}
  .topbar .small-tag{color:#9ca3af;font:600 11px/1 system-ui;margin-left:8px;text-transform:uppercase;letter-spacing:1.2px;font-style:normal;transform:skewX(6deg);display:inline-block}
  .icon-btn{background:transparent;border:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--topbar-fg)}
  .icon-btn:hover{background:rgba(255,255,255,.1)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:14px}

  /* Dashboard */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.brand{background:linear-gradient(160deg,#ccfbf1,#a7f3d0);border-color:#5eead4;color:#064e3b}
  .stat.info{background:linear-gradient(160deg,#dbeafe,#bae6fd);border-color:#7dd3fc;color:#0c4a6e}
  .stat.warn{background:linear-gradient(160deg,#fef3c7,#fde68a);border-color:#fcd34d;color:#78350f}
  .stat.bad {background:linear-gradient(160deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#7f1d1d}

  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .quick button{padding:14px 10px;border-radius:14px;border:0;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;line-height:1.1}
  .qa-out{background:var(--action-out)}
  .qa-in {background:var(--action-in)}
  .qa-tr {background:var(--action-transfer)}
  .quick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

  /* Tabs / nav */
  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:70}
  main{padding-bottom:80px}
  .tab{background:transparent;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer;border-radius:10px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
  .tab.active{color:var(--brand)}
  .tab:hover{background:var(--hover)}

  /* List items */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 8px}
  .listhead h2{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .key-card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
  .key-card:hover{background:var(--hover)}
  .key-card .qrwrap{width:64px;height:64px;background:#fff;border-radius:10px;padding:4px;display:grid;place-items:center;border:1px solid var(--border)}
  .key-card .qrwrap canvas, .key-card .qrwrap img{width:100%;height:100%}
  .key-card .title{font-weight:700;font-size:15px}
  .key-card .meta{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px}
  .key-card .meta span{display:inline-flex;align-items:center;gap:4px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
  .pill.avail{background:var(--good);color:var(--good-fg)}
  .pill.out{background:var(--bad);color:var(--bad-fg)}
  .pill.spare{background:#e0e7ff;color:#3730a3}

  /* Forms */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input, .field select, .field textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .btn{padding:12px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn.secondary{background:var(--hover);color:var(--text)}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .btn.danger{background:#dc2626;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.block{display:block;width:100%}

  /* Search bar */
  .search{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;font-weight:500;color:var(--text)}
  .search svg{width:22px;height:22px;flex:none;color:var(--muted)}
  .filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* Modal / sheet */
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .scrim.open{display:flex;animation:fadein .15s ease}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:16px 16px 0 0;padding:16px;max-height:78vh;overflow:auto;animation:slideup .22s ease;margin-bottom:72px}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .grab{width:42px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 12px}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}

  /* QR full screen */
  .qr-big{display:grid;place-items:center;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--border)}
  .qr-big canvas, .qr-big img{width:240px;height:240px}
  .qr-caption{text-align:center;color:var(--muted);margin-top:8px;font-size:13px}

  /* Movement history */
  .mv{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;border-left:4px solid var(--good-fg)}
  .mv.out{border-left-color:#dc2626}
  .mv .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mv .car{font-weight:700}
  .mv .reg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:13px}
  .mv .row2{display:flex;gap:12px;color:var(--muted);font-size:12.5px;margin-top:4px;flex-wrap:wrap}

  /* Scanner */
  #scan-region{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:300px}
  #scan-region video{width:100%!important;height:auto!important}
  .scan-hint{color:var(--muted);text-align:center;margin-top:8px;font-size:13px}

  /* Toast — must never block taps */
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.show{opacity:1}

  /* Empty / loading */
  .empty{padding:32px 14px;text-align:center;color:var(--muted)}
  .skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--hover),var(--border),var(--hover));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* Misc */
  .hide{display:none!important}
  .muted{color:var(--muted)}
  .right{margin-left:auto}
  .gap{height:8px}
  details summary{cursor:pointer;padding:8px 0;color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Back" style="display:none">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo">CAR<span class="v">V</span>ET<span class="small-tag">Key OS</span></div>
    <button class="icon-btn" id="btn-bell" aria-label="Notifications" style="position:relative">
      <svg viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16l-2-2zM10 20a2 2 0 0 0 4 0"/></svg>
      <span id="bell-badge" style="display:none;position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;background:#FF3D00;color:#fff;font-size:10px;font-weight:800;border-radius:9px;place-items:center;border:2px solid var(--topbar-bg)"></span>
    </button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 4.37 16.96l.06-.06A1.65 1.65 0 0 0 4.76 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.29l.06.06a1.65 1.65 0 0 0 1.82.33H9A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.18.27.27.6.27.91v.09H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <!-- Bottom nav -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
    <button class="tab" data-view="keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.65-8.65 2.5 2.5-2.5 2.5-2-2-2 2 2 2"/></svg><span>Keys</span></button>
    <button class="tab" data-view="scan"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 12h10"/></svg><span>Scan</span></button>
    <button class="tab" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button class="tab" data-view="mycar"><svg viewBox="0 0 24 24"><path d="M3 13l2-5a3 3 0 0 1 3-2h8a3 3 0 0 1 3 2l2 5"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2H7v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/></svg><span>My Car</span></button>
  </nav>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ==========================================================
   CARNET Key OS — improved cross-platform PWA prototype
   Single-file. Works on iOS + Android + desktop.
   Storage: localStorage (drop-in replaceable with Supabase/Firebase)
   ========================================================== */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const DB_KEY = 'carnet_keyos_v1';

const HOUR = 3600000, DAY = 86400000;
const NOW  = Date.now();
const DEFAULT_DB = {
  user:{ name:'Ken Tung', dealer:'EXECAR', branch:'Cheras', userId:'10000899', role:'admin' },
  branches:['Cheras','Kuchai'],
  dealers:['EXECAR','SKT','DDH','King','Fatcar','Tony'],

  purposes:['Demo','Inspection','Paint','Petrol','Warm Up','180 Days Check','Car Wash - Cheras','Car Wash - Kuchai','Sold/Delivered'],

  purposeLimits:{'Demo':240,'Inspection':60,'Paint':480,'Petrol':30,'Warm Up':30,'180 Days Check':60,'Car Wash - Cheras':120,'Car Wash - Kuchai':120,'Sold/Delivered':0},

  disabledBays:{ Cheras:[], Kuchai:[] },

  overdueNotified:{},
  users:[
    {id:'U1', name:'Ken Tung',          username:'ken',    password:'demo123', dealer:'EXECAR', position:'Director',          role:'admin'},
    {id:'U2', name:'hisham hashim',     username:'hisham', password:'demo123', dealer:'EXECAR', position:'Sales Advisor',     role:'user'},
    {id:'U3', name:'KC Hero',           username:'kc',     password:'demo123', dealer:'EXECAR', position:'Yard Staff',        role:'user'},
    {id:'U4', name:'Tony',              username:'tony',   password:'demo123', dealer:'Tony',   position:'Owner',             role:'user'},
    {id:'U5', name:'Muhammad Hafizzul', username:'hafiz',  password:'demo123', dealer:'EXECAR', position:'Sales Advisor',     role:'user'},
  ],

  keys:[],
  notifications:[],
  history:[],
};

function loadDB(){
  try { return JSON.parse(localStorage.getItem(DB_KEY)) ?? structuredClone(DEFAULT_DB); }
  catch { return structuredClone(DEFAULT_DB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

/* ---------- helpers ---------- */
const fmt = d => new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* Notifications — push to creator on any movement, plus all admins on forced actions. */
function notifyMovement(k, type, details){
  if(!k) return;
  db.notifications = db.notifications || [];
  details = details || {};

  const recipients = new Set();
  if(k.createdBy && k.createdBy !== db.user.name) recipients.add(k.createdBy);
  if(details.forced){

    (db.users||[]).filter(u => u.role==='admin' && u.name !== db.user.name).forEach(u => recipients.add(u.name));
  }
  if(!recipients.size){ updateBellBadge(); return; }

  const baseId = 'N' + Date.now() + Math.random().toString(36).slice(2,5);
  recipients.forEach((forUser, i)=>{
    db.notifications.unshift({
      id: baseId + '-' + i,
      ts: Date.now(),
      forUser, actor: db.user.name,
      type, keyId: k.id, car: k.car, reg: k.reg,
      details, read:false,
    });
  });
  if(db.notifications.length > 300) db.notifications.length = 300;

  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try {
      const tag = type==='in'?'Key In':type==='out'?'Key Out':type==='transfer'?'Branch Transfer':'Deleted';
      const body =
        type==='in'        ? `${k.car} (${k.reg}) checked in @ ${details.parking||'—'} by ${db.user.name}` :
        type==='out'       ? `${k.car} (${k.reg}) checked out · ${details.purpose||'—'} by ${db.user.name}${details.forced?' [FORCED]':''}` :
        type==='transfer'  ? `${k.car} (${k.reg}) transferred ${details.from||'?'} → ${details.to||'?'} by ${db.user.name}` :
                             `${k.car} (${k.reg}) removed · ${details.purpose||''} by ${db.user.name}`;
      new Notification(`CARNET · ${tag}${details.forced?' [FORCED]':''}`, { body, tag: baseId });
    } catch(_){}
  }
  updateBellBadge();
}
function myUnreadNotifs(){
  return (db.notifications||[]).filter(n => n.forUser === db.user.name && !n.read).length;
}
function updateBellBadge(){
  const n = myUnreadNotifs();
  const badge = document.getElementById('bell-badge'); if(!badge) return;
  if(n>0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = 'grid'; }
  else { badge.style.display = 'none'; }
}

const currentParkedMs = k => (k.status==='available' && k.inSince) ? Math.max(0, Date.now() - k.inSince) : 0;
const totalParkedMs   = k => (k.totalParkedMs||0) + currentParkedMs(k);
function fmtDur(ms){
  if(!ms || ms<0) ms = 0;
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h ${m%60}m`;
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}

function lastOutMs(k){
  const last = db.history.find(h=>h.keyId===k.id && h.type==='out');
  return last ? Date.now() - last.ts : 0;
}

function isAdmin(){ return (db.user?.role || 'user') === 'admin'; }
function canEditKey(k){ return isAdmin() || (k.createdBy && k.createdBy === db.user.name); }

function ageDays(k){ const ms = currentParkedMs(k); return Math.floor(ms / DAY); }
function isOver180(k){ return ageDays(k) > 180; }

/* Car Wash — a car is "in car wash" if its current status is OUT and the last key-out purpose
   begins with "Car Wash" + a branch name. */
function carWashBranch(k){
  if(!k || k.status !== 'out') return null;
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  if(!last) return null;
  const p = String(last.purpose || '');
  if(!/^\s*car\s*wash/i.test(p)) return null;
  const m = p.match(/car\s*wash\s*[-–—:]?\s*(.+)/i);
  return m ? m[1].trim() : (k.branch || '?');
}
function carsInCarWash(branch){
  return db.keys.filter(k => {
    const b = carWashBranch(k);
    return b && (!branch || b.toLowerCase() === branch.toLowerCase());
  });
}

function overdueMinutes(k){
  if(!k || k.status !== 'out') return 0;
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  if(!last) return 0;
  const limit = (db.purposeLimits||{})[last.purpose] || 0;
  if(!limit) return 0;
  const mins = Math.floor((Date.now() - last.ts) / 60000);
  return mins > limit ? (mins - limit) : 0;
}
function overdueOwnerName(k){
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  return last?.user || null;
}

function checkOverdueAndNotify(){
  db.overdueNotified = db.overdueNotified || {};
  const newlyOverdue = [];
  db.keys.forEach(k=>{
    if(k.status !== 'out') return;
    const over = overdueMinutes(k);
    if(over <= 0) return;
    const last = db.history.find(h => h.keyId === k.id && h.type === 'out'); if(!last) return;
    const tagKey = `${k.id}|${last.ts}`;
    if(db.overdueNotified[tagKey]) return;
    db.overdueNotified[tagKey] = Date.now();
    newlyOverdue.push({k, last, over});
  });
  if(!newlyOverdue.length) return;
  newlyOverdue.forEach(({k, last, over})=>{
    const owner = last.user;
    const recipients = new Set();
    if(owner && owner !== db.user.name) recipients.add(owner);
    if(k.createdBy && k.createdBy !== db.user.name) recipients.add(k.createdBy);
    (db.users||[]).filter(u => u.role==='admin' && u.name !== db.user.name).forEach(u => recipients.add(u.name));
    const baseId = 'NO' + Date.now() + Math.random().toString(36).slice(2,5);
    recipients.forEach((forUser, i)=>{
      db.notifications.unshift({
        id: baseId + '-' + i, ts: Date.now(),
        forUser, actor: 'system',
        type: 'overdue', keyId: k.id, car: k.car, reg: k.reg,
        details: {purpose: last.purpose, over, owner},
        read: false,
      });
    });
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try { new Notification(`⏰ Overdue · ${k.reg}`, { body: `${k.car} · ${last.purpose} · ${over}m overdue · last user ${owner}`, tag: baseId }); } catch(_){}
    }
  });
  saveDB(); updateBellBadge();
}

function qrServerUrl(text, size=256){

}

async function getQrDataUrl(text, size=1024){
  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try { return await QRCode.toDataURL(text, {margin:1, width:size, errorCorrectionLevel:'M'}); } catch(_){}
  }
  const resp = await fetch(qrServerUrl(text, size));
  const blob = await resp.blob();
  return await new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
function loadImg(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }

function compressImage(file, maxWidth=800, quality=0.7){
  return new Promise((res, rej)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function qrInto(el, text, size=64){
  if(!el) return;
  el.innerHTML = '';
  const renderSize = Math.max(size*4, 256);

  const img = document.createElement('img');
  img.alt = 'QR'; img.draggable = false;
  img.style.cssText = 'width:100%;height:100%;display:block;border-radius:4px;pointer-events:none;background:#fff';
  img.src = qrServerUrl(text, renderSize);
  el.appendChild(img);

  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try {
      const p = QRCode.toDataURL(text, {margin:1, width:renderSize, errorCorrectionLevel:'M', color:{dark:'#000000',light:'#FFFFFF'}});
      Promise.resolve(p).then(url=>{ img.src = url; }).catch(()=>{});
    } catch(_){}
  }
}

async function downloadQR(payload, filename){
  filename = (filename||'qr')+'.png';

  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try {
      const url = await QRCode.toDataURL(payload, {margin:2, width:1024, errorCorrectionLevel:'M'});
      return triggerDownload(url, filename);
    } catch(_){}
  }

  try {
    const resp = await fetch(qrServerUrl(payload, 1024));
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    triggerDownload(url, filename);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){

    window.open(qrServerUrl(payload, 1024), '_blank');
    toast('Opened QR in new tab — long-press to save');
  }
}
function triggerDownload(url, filename){
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Saved to downloads');
}

/* ---------- 15×30 cm printable sticker ---------- */

async function downloadSticker(k){
  if(!k) return;
  toast('Building sticker…');
  const DPI = 300;
  const CM  = DPI / 2.54;
  const W   = Math.round(15 * CM);
  const H   = Math.round(30 * CM);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, W-8, H-8);

  const halfH   = H / 2;
  const qrPadX  = W * 0.06;
  const qrPadTop= W * 0.06;
  const qrSize  = Math.min(W - qrPadX*2, halfH - qrPadTop*2);
  const qrX     = (W - qrSize) / 2;
  const qrY     = (halfH - qrSize) / 2;
  try {
    const dataUrl = await getQrDataUrl(qrPayload(k), 1400);
    const img     = await loadImg(dataUrl);
    ctx.drawImage(img, qrX, qrY, qrSize, qrSize);
  } catch(e){ toast('QR fetch failed — check internet'); return; }

  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W*0.08, halfH); ctx.lineTo(W*0.92, halfH); ctx.stroke();

  ctx.fillStyle = '#0f766e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `700 ${Math.round(W*0.06)}px system-ui, -apple-system, "Segoe UI", Arial`;
  ctx.fillText('CARNET Key OS', W/2, halfH + W*0.025);

  const rowsTop   = halfH + W*0.14;
  const rowsBot   = H    - W*0.07;
  const rowGap    = (rowsBot - rowsTop) / 3;
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#0f172a';

  function drawRow(idx, label, value, valueFont, mono=false){
    const y = rowsTop + rowGap*idx + rowGap/2;
    ctx.fillStyle = '#64748b';
    ctx.font = `500 ${Math.round(W*0.035)}px system-ui, Arial`;
    ctx.fillText(label, W/2, y - rowGap*0.32);
    ctx.fillStyle = '#0f172a';
    ctx.font = `${valueFont} ${mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, Arial'}`;
    ctx.fillText(value, W/2, y + rowGap*0.05);
  }

  drawRow(0, 'PLATE',  k.reg || '—',         `900 ${Math.round(W*0.16)}px`);
  drawRow(1, 'MODEL',  k.car || '—',         `700 ${Math.round(W*0.09)}px`);
  drawRow(2, 'SERIAL', serialDisplay(k)||'—',`700 ${Math.round(W*0.10)}px`, true);

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const fname = `sticker_${serialDisplay(k)}_${k.reg}.png`.replace(/[^\w.-]/g,'_');
    triggerDownload(url, fname);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

let view = 'home';

function go(v, push=true){
  const sameView = (v === view);
  view = v;
  if(push && !sameView){
    navStack.push(v);
    history.pushState({nav:v}, '', '#'+v);
  }
  $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
  render();
  if(!sameView) window.scrollTo(0,0);

  if($('#scrim').classList.contains('open')){ closeSheet(); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));
    $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
    render();
  }
}

  if($('#scrim')?.classList.contains('open')){ closeSheet(); history.pushState({nav:view}, '', '#'+view); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));

function matchMvFilter(h, f, inBranchFn){
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const today = h.ts >= startOfToday.getTime();
  const purposeLc = String(h.purpose||'').toLowerCase();
  switch(f){
    case 'all':         break;
    case 'in':          if(h.type!=='in') return false; break;
    case 'out':         if(h.type!=='out') return false; break;
    case 'transfer':    if(h.type!=='transfer') return false; break;
    case 'deleted':     if(h.type!=='deleted') return false; break;
    case 'sold':        if(!(h.type==='deleted' && purposeLc.includes('sold'))) return false; break;
    case 'warmup':      if(!purposeLc.includes('warm')) return false; break;
    case 'inspection':  if(!purposeLc.includes('inspect')) return false; break;
    case '180d': {
      const k = db.keys.find(x=>x.id===h.keyId); if(!k || !isOver180(k)) return false; break;
    }
    case 'forced':      if(!h.forced) return false; break;
    case 'today':       if(!today) return false; break;
    case 'week':        if((Date.now()-h.ts) > 7*86400000) return false; break;
    case 'today-in':    if(h.type!=='in'       || !today) return false; break;
    case 'today-out':   if(h.type!=='out'      || !today) return false; break;
    case 'today-tr':    if(h.type!=='transfer' || !today) return false; break;
    case 'today-sold':  if(!(h.type==='deleted' && purposeLc.includes('sold') && today)) return false; break;
    default: break;
  }
  if(typeof inBranchFn === 'function'){
    const k = db.keys.find(x=>x.id===h.keyId);
    if(k && !inBranchFn(k)) return false;
  }
  return true;
}

function renderMv(h){
  const live = db.keys.find(k=>k.id===h.keyId);
  const k = live || (h.snapshot ? {...h.snapshot, car:(h.snapshot.car||'(deleted)')+' (deleted)'} : {car:'(deleted)',reg:'',id:''});
  const palette = {
    in:       {tag:'IN',       bg:'#dcfce7', fg:'#166534', bar:'#16a34a'},
    out:      {tag:'OUT',      bg:'#fee2e2', fg:'#991b1b', bar:'#dc2626'},
    transfer: {tag:'TRANSFER', bg:'#dbeafe', fg:'#1e40af', bar:'#0ea5e9'},
    deleted:  {tag:'DELETED',  bg:'#374151', fg:'#f3f4f6', bar:'#111827'},
  }[h.type] || {tag:h.type, bg:'#f1f5f9', fg:'#334155', bar:'#94a3b8'};

  let line;
  if(h.type==='transfer')    line = `${h.from||'?'} → ${h.to||'?'}${h.note?' · '+h.note:''}`;
  else if(h.type==='out')    line = `Purpose: ${h.purpose||'—'}`;
  else if(h.type==='in')     line = `Returned to: ${h.parking||'—'}`;
  else if(h.type==='deleted')line = `Removed${h.purpose?' · '+h.purpose:''}`;
  else line = '';

  const clickable = !!live;
  return `<div class="mv" data-key-id="${live?live.id:''}" style="cursor:${clickable?'pointer':'default'};background:var(--card);border:1px solid var(--border);border-left:6px solid ${palette.bar};border-radius:12px;padding:12px;margin-bottom:8px">
    <div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="background:${palette.bg};color:${palette.fg};padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.6px">${palette.tag}</span>
        ${h.forced?'<span style="background:#475569;color:#fff;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.6px">FORCED</span>':''}
        <div class="car" style="font-weight:700">${k.car}</div>
      </div>
      <div class="reg" style="font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:13px">${k.reg||''}</div>
    </div>
    <div class="row2" style="display:flex;gap:12px;color:var(--muted);font-size:12.5px;margin-top:6px;flex-wrap:wrap">
      <span>${line}</span>
      <span style="margin-left:auto">${h.user||''}</span>
      <span>${fmt(h.ts)}</span>
    </div>
  </div>`;
}

function doBulkOut(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }

  openSheet(`
    <h3>Bulk Key Out · ${ids.length} key${ids.length>1?'s':''}</h3>
    <div class="muted" style="margin-bottom:10px">Pick a purpose to apply to every selected key.</div>
    <div class="filters" style="flex-wrap:wrap">
      ${db.purposes.map(p=>`<button class="chip" data-bp="${encodeURIComponent(p)}" style="${p==='Sold/Delivered'?'background:#dc2626;color:#fff;border-color:#dc2626':''}">${p==='Sold/Delivered'?'⚠ ':''}${p}</button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="field"><label>Or custom</label><input id="bp-custom" placeholder="e.g., showroom"></div>
    <button class="btn block" id="bp-go">Apply custom</button>
  `);
  const apply = (purpose)=>{
    if(purpose==='Sold/Delivered' && !confirm(`Sold/Delivered will DELETE ${ids.length} keys + their spares. Continue?`)) return;
    let removed=0, outted=0;
    ids.forEach(id=>{
      const k = db.keys.find(x=>x.id===id); if(!k) return;
      if(purpose==='Sold/Delivered'){
        const pair = db.keys.filter(x=>x.pairId && x.pairId===k.pairId);
        pair.forEach(p=>{
          db.history.unshift({ts:Date.now(), type:'deleted', keyId:p.id, user:db.user.name, purpose:'Sold/Delivered', snapshot:{...p}});
          notifyMovement(p, 'deleted', {purpose:'Sold/Delivered'});
        });
        db.keys = db.keys.filter(x => !pair.find(p=>p.id===x.id));
        removed += pair.length;
      } else {
        const forced = (k.status==='out');
        if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
        k.inSince = null; k.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose, forced});
        notifyMovement(k, 'out', {purpose, forced});
        outted++;
      }
    });
    bulkSel.clear(); saveDB(); closeSheet(); render();

function doBulkIn(){

  let done=0;
  ids.forEach(id=>{
    const k = db.keys.find(x=>x.id===id); if(!k) return;
    if(k.status==='available') return;
    const parking = k.spare ? 'BOX' : (k.parking||'BOX');
    k.status = 'available'; k.inSince = Date.now(); k.parking = parking;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking});
    notifyMovement(k, 'in', {parking});
    done++;
  });
  bulkSel.clear(); saveDB(); render(); toast(`Checked in ${done}`);
}

function runBulkAdd(rows){
  let created = 0, skipped = 0;
  rows.forEach(row=>{
    if(!row.reg || !row.car){ skipped++; return; }
    if(row.branch && !db.branches.includes(row.branch)) db.branches.push(row.branch);
    if(row.dealer && !db.dealers.includes(row.dealer)) db.dealers.push(row.dealer);
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1+created).padStart(3,'0');
    const common = { car:row.car, reg:row.reg.toUpperCase(), dealer:row.dealer, branch:row.branch||db.user.branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };
    const toAdd = [];
    if(row.mode==='main' || row.mode==='pair'){
      toAdd.push({...common, id:baseId, serial:nextSerial(), parking:row.bay||'', spare:false});
    }
    if(row.mode==='spare' || row.mode==='pair'){
      const tmp = [...db.keys, ...toAdd];
      const max = tmp.reduce((m,k)=>{ const n=parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      toAdd.push({...common, id:baseId+'S', serial:String(max+1), parking:'BOX', spare:true});
    }
    db.keys.unshift(...toAdd); created += toAdd.length;
  });
  saveDB(); render(); toast(`Added ${created}${skipped?', skipped '+skipped:''}`);
}

function bayKey(bayId, branch){
  return db.keys.find(k=>!k.spare && (k.branch===branch) && (k.parking||'').toUpperCase()===bayId.toUpperCase());
}

function bayCurrentKey(bayId, branch){
  return db.keys.find(k => !k.spare && k.branch===branch && k.status==='available' && (k.parking||'').toUpperCase()===bayId.toUpperCase());
}

function isBayDisabled(bayId, branch){
  const list = (db.disabledBays?.[branch] || []).map(s=>String(s).toUpperCase());
  return list.includes(String(bayId).toUpperCase());
}
function toggleBayDisabled(bayId, branch){
  if(!db.disabledBays) db.disabledBays = {};
  if(!db.disabledBays[branch]) db.disabledBays[branch] = [];
  const list = db.disabledBays[branch];
  const i = list.findIndex(x => String(x).toUpperCase() === String(bayId).toUpperCase());
  if(i >= 0) list.splice(i, 1); else list.push(bayId);
  saveDB();
}

function KUCHAI_B2_BAYS(){
  const bays = [];
  const W = 50, H = 56;
  const GAP = 4;

  function row(startId, count, startX, y){
    for(let i=0;i<count;i++){
      bays.push({id:`B2-${startId+i}`, x:startX + i*(W+GAP), y, w:W, h:H});
    }
  }

  row(87, 3, 230, 60);
  row(90, 3, 230 + 3*(W+GAP) + 36, 60);
  row(93, 9, 230 + 6*(W+GAP) + 72, 60);

  row(102, 6, 30,  200);

  row(108, 6, 30 + 6*(W+GAP) + 30, 200);

  row(114, 11, 30 + 12*(W+GAP) + 60, 200);

  row(125, 5, 30, 360);

  const tandemStartX = 30 + 5*(W+GAP) + 18;

}

function openAssignEmptyBay(bayId, branch){

  const baseCandidates = db.keys.filter(k => !k.spare);
  let assignQuery = '';

  function renderRows(){
    const Q = assignQuery.trim().toLowerCase();
    const list = (Q
      ? baseCandidates.filter(k => [k.car, k.reg, k.dealer, k.id, k.serial, k.branch, k.parking].join(' ').toLowerCase().includes(Q))
      : baseCandidates.slice()
    ).sort((a,b)=>{

      const sa = a.status==='out' ? 0 : 1;
      const sb = b.status==='out' ? 0 : 1;
      if(sa !== sb) return sa - sb;
      return (a.reg||'').localeCompare(b.reg||'');
    });
    const out = $('#ab-list'); if(!out) return;
    out.innerHTML = list.length ? list.map(k=>{
      const isOut = k.status==='out';
      const verb  = isOut ? 'Check IN here' : `Move from ${k.branch} bay ${k.parking||'—'}`;
      const verbClass = isOut ? 'btn-in' : 'btn-transfer';
      return `
      <div class="key-card" data-ab-id="${k.id}" style="margin-bottom:6px">
        ${k.photo
          ? `<div class="qrwrap" data-payload="${qrPayload(k)}" style="background:#fff;padding:0;overflow:hidden"><img src="${k.photo}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`
          : `<div class="qrwrap" data-payload="${qrPayload(k)}"></div>`}
        <div>
          <div class="title">${k.car}</div>
          <div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span></div>
          <div class="meta"><span class="pill ${isOut?'out':'avail'}">${isOut?'OUT':'Parked @ '+k.parking}</span><span class="${verbClass}" style="padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.3px">${verb}</span></div>
        </div>
        <div class="muted">›</div>
      </div>`;
    }).join('') : `<div class="muted" style="font-size:13px;padding:8px 0">${Q?'No match':'No cars yet — tap "Add new key" above'}</div>`;
    $$('#ab-list .qrwrap[data-payload]').forEach(el=>qrInto(el, el.dataset.payload, 56));
    $$('#ab-list [data-ab-id]').forEach(el=>el.addEventListener('click', ()=>{
      const k = db.keys.find(x=>x.id===el.dataset.abId); if(!k) return;
      const wasParkedElsewhere = (k.status==='available') && (k.branch !== branch || (k.parking||'') !== bayId);

      if(wasParkedElsewhere){
        if(!confirm(`Move ${k.reg} from ${k.branch} bay ${k.parking||'—'} → ${branch} bay ${bayId}?`)) return;
      }
      const from = k.branch; const oldBay = k.parking;

      k.status='available'; k.inSince=Date.now(); k.branch=branch; k.parking=bayId; k.unassigned=false;
      if(wasParkedElsewhere && from !== branch){
        db.history.unshift({ts:Date.now(), type:'transfer', keyId:k.id, user:db.user.name, from, to:branch, note:`bay ${oldBay||'—'} → ${bayId}`});
        notifyMovement(k, 'transfer', {from, to:branch, note:`bay ${oldBay||'—'} → ${bayId}`});
      } else {
        db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bayId});
        notifyMovement(k, 'in', {parking:bayId});
      }
      saveDB(); closeSheet(); render(); toast(`${k.reg} → ${branch} bay ${bayId}`);
    }));
  }

  openSheet(`
    <h3>Bay ${bayId} · ${branch}</h3>
    <div class="muted" style="margin-bottom:10px">Search a car to assign here, or add a new one.</div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="ab-q" placeholder="Search plate / model…" autofocus>
    </div>
    <div class="gap"></div>
    <button class="btn-add btn block" id="ab-new" style="margin-bottom:10px">＋ Add new key into this bay</button>
    <h3 style="font-size:14px;margin:0 0 6px">All cars (tap to assign here)</h3>
    <div id="ab-list"></div>
  `);
  renderRows();
  $('#ab-q').addEventListener('input', e=>{ assignQuery = e.target.value; renderRows(); });
  $('#ab-new').onclick = ()=>{
    closeSheet();
    openAddKey();
    setTimeout(()=>{
      if($('#f-branch'))  $('#f-branch').value = branch;
      if($('#f-parking')) $('#f-parking').value = bayId;
    }, 80);
  };
}

function openEditBay(k){
  if(!isAdmin()){ toast('Admin only'); return; }
  openSheet(`
    <h3>Edit bay for ${k.car}</h3>
    <div class="muted" style="margin-bottom:10px">${k.reg} · current bay: <b>${k.parking||'—'}</b></div>
    <div class="field"><label>New bay number</label><input id="eb-bay" value="${k.parking||''}"></div>
    <div class="row">
      <button class="btn-in btn" id="eb-save">Save</button>
      <button class="btn-out btn" id="eb-clear">Clear (set OUT)</button>
    </div>
  `);
  $('#eb-save').onclick = ()=>{
    const v = $('#eb-bay').value.trim(); if(!v){ toast('Need bay'); return; }
    const conflict = bayConflictKey(v, k.id);
    if(conflict){
      if(!confirm(`Bay ${v} held by ${conflict.reg} — force replace? Old key marked UNASSIGNED.`)) return;
      if(conflict.inSince){ conflict.totalParkedMs=(conflict.totalParkedMs||0)+(Date.now()-conflict.inSince); }
      conflict.inSince=null; conflict.status='out'; conflict.unassigned=true;
      db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'admin moved bay — UNASSIGNED', forced:true});
      notifyMovement(conflict, 'out', {purpose:'admin moved bay — UNASSIGNED', forced:true});
    }
    k.parking = v;
    k.status = 'available';
    if(!k.inSince) k.inSince = Date.now();
    k.unassigned = false;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:v, forced:!!conflict});
    notifyMovement(k, 'in', {parking:v, forced:!!conflict});
    saveDB(); closeSheet(); render(); toast(`Bay updated → ${v}`);
  };
  $('#eb-clear').onclick = ()=>{
    if(k.inSince){ k.totalParkedMs=(k.totalParkedMs||0)+(Date.now()-k.inSince); }
    k.inSince=null; k.status='out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose:'admin cleared bay', forced:true});
    notifyMovement(k, 'out', {purpose:'admin cleared bay', forced:true});
    saveDB(); closeSheet(); render(); toast('Bay cleared');
  };
}

function exportAgingCSV(){
  if(!isAdmin()){ toast('Admin only'); return; }

}

            ? `<div class="qrwrap" data-payload="${qrPayload(k)}" style="background:#fff;padding:0;overflow:hidden"><img src="${k.photo}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:8px"></div>`
            : `<div class="qrwrap" data-payload="${qrPayload(k)}"></div>`}
          <div>
            <div class="title">${k.car}</div>
            <div class="meta"><span>🪪 ${k.reg}</span><span>🏢 ${k.branch||k.dealer}</span><span>📍 ${k.parking||'—'}</span><span>🆔 ${serialDisplay(k)}</span></div>
            <div class="meta">
              ${k.unassigned?'<span class="pill" style="background:#FF3D00;color:#fff;font-weight:800">⚠ UNASSIGNED</span>':''}
              ${over>0?`<span class="pill" style="background:#dc2626;color:#fff;font-weight:800">⏰ ${fmtDur(over*60000)}</span>`:''}
              <span class="pill ${k.status==='available'?'avail':'out'}">${k.status==='available'?'Available':'Out'}</span>
              ${k.spare?'<span class="pill spare">Spare</span>':''}
              ${k.status==='available' ? `<span class="muted">⏱ ${fmtDur(parked)}</span>` : `<span class="muted">↑ Out ${fmtDur(lastOutMs(k))}</span>`}
            </div>
          </div>
          <div class="muted">›</div>
        </div>
      `;
    }).join('') : `<div class="empty">${Q?'No matches.':'You haven\'t added any keys yet. Tap "＋ Add New Key" above.'}</div>`}
  `;
}

/* ---------- bindings via event delegation (wired ONCE at script init) ---------- */
function bindDynamic(){ /* no-op kept for backward compat */ }

function installDelegatedHandlers(){
  const main = $('#main');

  main.addEventListener('click', (e)=>{
    const t = e.target;

    const hit = (sel) => t.closest(sel);

    const stat = hit('[data-stat]');
    if(stat){
      const s = stat.dataset.stat;
      if(s==='avail')  { keysFilter={q:'',status:'available',spare:'main', branch:homeBranch};  go('keys'); }
      if(s==='spare')  { keysFilter={q:'',status:'available',spare:'spare',branch:homeBranch};  go('keys'); }
      if(s==='outnow') { keysFilter={q:'',status:'out',      spare:'all',  branch:homeBranch};  go('keys'); }
      if(s==='out30')  { mvFilter='out'; go('history'); }
      if(s==='aging')  { go('aging'); }
      if(s==='overdue'){ keysFilter={q:'overdue',status:'out',spare:'all',branch:homeBranch}; go('keys'); }
      if(s==='carwash'){ openCarWashList(homeBranch==='all'?'':homeBranch); }

      if(s==='today-in')   { mvFilter='today-in';   go('history'); }
      if(s==='today-out')  { mvFilter='today-out';  go('history'); }
      if(s==='today-tr')   { mvFilter='today-tr';   go('history'); }
      if(s==='today-sold') { mvFilter='today-sold'; go('history'); }
      return;
    }

    const chipBr = hit('.chip[data-fbr]'); if(chipBr){ homeBranch = chipBr.dataset.fbr; render(); return; }

    const mcf = hit('[data-mcf]'); if(mcf){ myCarFilter = mcf.dataset.mcf; render(); return; }
    if(hit('#qa-out')){ openHomeKeyAction('out'); return; }
    if(hit('#qa-in')) { openHomeKeyAction('in');  return; }
    if(hit('#qa-transfer')){ openHomeKeyAction('transfer'); return; }
    if(hit('#carwash-btn')){ openCarWashList(homeBranch); return; }
    if(hit('#go-history')){ go('history'); return; }

    if(hit('#add-key')){ openAddKey(); return; }
    if(hit('#export-all')){ exportKeysCSV(); return; }
    if(hit('#bulk-toggle')){ if(!isAdmin()){ toast('Admin only'); return; } bulkMode = !bulkMode; bulkSel.clear(); render(); return; }
    if(hit('#bulk-out')){ if(!isAdmin()){ toast('Admin only'); return; } doBulkOut(); return; }
    if(hit('#bulk-in')){  if(!isAdmin()){ toast('Admin only'); return; } doBulkIn();  return; }
    const chipFs = hit('[data-fs]'); if(chipFs){ keysFilter.status = chipFs.dataset.fs; if(view!=='keys') go('keys'); else render(); return; }
    const chipFp = hit('.chip[data-fp]'); if(chipFp){ keysFilter.spare  = chipFp.dataset.fp; render(); return; }
    const chipFbk= hit('.chip[data-fbk]');if(chipFbk){ keysFilter.branch = chipFbk.dataset.fbk; render(); return; }

    const chipMv = hit('.chip[data-fmv]'); if(chipMv){ mvFilter = chipMv.dataset.fmv; render(); return; }

    const mv = hit('.mv[data-key-id]');
    if(mv){
      const id = mv.dataset.keyId;
      if(id) openKey(id);
      return;
    }

    const card = hit('.key-card[data-id]');
    if(card){
      const id = card.dataset.id;
      if(bulkMode && card.dataset.bulk){
        if(bulkSel.has(id)) bulkSel.delete(id); else bulkSel.add(id);
        render();
      } else {
        openKey(id);
      }
      return;
    }

    if(hit('#scan-manual-go')){ runManualLookup(); return; }
    const zm = hit('[data-zm]');
    if(zm){
      window.__scanZoom = (window.__scanZoom||1.8) + (zm.dataset.zm==='in'?0.3:-0.3);
      window.__scanZoom = Math.max(1, Math.min(5, window.__scanZoom));
      applyCameraZoom(window.__scanZoom);
      return;
    }

    if(hit('#export-history')){ exportHistoryCSV(); return; }

    if(hit('#show-myqr')){ showMyQR(); return; }
    if(hit('#login-as')){ openLoginSheet(); return; }
    if(hit('#logout')){
      if(!confirm('Logout?')) return;

      db.user = { name:'Guest', dealer:'—', branch:'Cheras', userId:'00000000', role:'user' };
      saveDB(); render(); openLoginSheet();
      return;
    }
    if(hit('#branch-hub')){ openBranchHub(); return; }
    if(hit('#export-keys-csv')){ exportKeysCSV(); return; }
    if(hit('#export-keys-json')){ exportJSON(); return; }
    if(hit('#export-history-csv')){ exportHistoryCSV(); return; }
    if(hit('#export-aging-csv')){ exportAgingCSV(); return; }
    if(hit('#dl-all-stickers')){ if(!isAdmin()){ toast('Admin only'); return; } downloadAllStickers(); return; }
    if(hit('#pdf-keys')){    pdfMyKeys();    return; }
    if(hit('#pdf-history')){ pdfMyHistory(); return; }
    if(hit('#pdf-aging')){   pdfAgingReport(); return; }
    if(hit('#pdf-my-keys')){ pdfMyKeys(); return; }
    if(hit('#pdf-my-history')){ pdfMyHistory(); return; }

    const zoomBtn = hit('[data-zoom]');
    if(zoomBtn){
      ev_stop(e);
      const z = zoomBtn.dataset.zoom;
      if(z==='in')    mapZoom = Math.min(3, +(mapZoom + 0.25).toFixed(2));
      if(z==='out')   mapZoom = Math.max(0.6, +(mapZoom - 0.25).toFixed(2));
      if(z==='reset') mapZoom = 1;
      render();
      return;
    }

    const kfBtn = hit('.chip[data-kf]'); if(kfBtn){ kuchaiFloor = kfBtn.dataset.kf; render(); return; }

    if(hit('#map-edit-toggle')){ mapEditMode = !mapEditMode; render(); return; }
    const editBay = hit('[data-edit-bay]');
    if(editBay){
      ev_stop(e);
      const k = db.keys.find(x=>x.id===editBay.dataset.editBay); if(k) openEditBay(k);
      return;
    }

    if(hit('#cancel-bay-select')){ selectingBayFor = null; render(); toast('Cancelled'); return; }

    if(selectingBayFor){
      const svgBaySel = hit('g.bay[data-id]');
      const emptyBaySel = hit('[data-empty-bay]');
      const gridTileSel = hit('[data-bay-tile]');
      let bayId = null, occupiedBy = null;
      if(svgBaySel){
        const occ = db.keys.find(x=>x.id===svgBaySel.dataset.id);
        bayId = occ?.parking || null;
        occupiedBy = occ;
      } else if(emptyBaySel){ bayId = emptyBaySel.dataset.emptyBay; }
      else if(gridTileSel){
        bayId = decodeURIComponent(gridTileSel.dataset.bayTile||'');
        occupiedBy = db.keys.find(x=>x.id===gridTileSel.dataset.id);
      }
      if(bayId){
        const ctx = selectingBayFor;

        if(isBayDisabled(bayId, ctx.branch || 'Cheras')){ toast(`Bay ${bayId} is not available`); return; }

        if(ctx.action === 'bulk-add'){
          if(occupiedBy){
            if(!confirm(`Bay ${bayId} held by ${occupiedBy.reg}. Use anyway? You'll be asked to force-replace when saving.`)) return;
          }
          if(bulkRows[ctx.rowIndex]) bulkRows[ctx.rowIndex].bay = bayId;
          selectingBayFor = null;
          go('home', false); openBulkAdd();
          toast(`Bay ${bayId} set on row ${ctx.rowIndex+1}`);
          return;
        }

        if(ctx.action === 'add-key'){
          if(occupiedBy){
            if(!confirm(`Bay ${bayId} held by ${occupiedBy.reg}. Use anyway? You'll be asked to force-replace when saving.`)) return;
          }

          const draft = pendingAddKeyForm || {};
          draft.parking = bayId;
          pendingAddKeyForm = null;
          selectingBayFor = null;

          if(draft.existing){
            const found = db.keys.find(x=>x.id===draft.existingId);
            if(found) openAddKey(found); else openAddKey();
          } else {
            openAddKey();
          }

          requestAnimationFrame(()=>{
            const set = (id, v) => { const el = document.getElementById(id); if(el && v != null && v !== '') el.value = v; };
            set('f-car',        draft.car);
            set('f-reg',        draft.reg);
            set('f-dealer',     draft.dealer);
            set('f-branch',     draft.branch);
            set('f-create',     draft.mode);
            set('f-spare',      draft.spareEdit);
            set('f-prev-days',  draft.prevDays);
            set('f-prev-hours', draft.prevHours);
            set('f-parking',    draft.parking);

            const br = document.getElementById('f-branch');
            if(br && draft.branch) br.dispatchEvent(new Event('change'));
          });
          toast(`Bay ${bayId} selected → ${bayId}`);
          return;
        }
        const verbing = ctx.action==='transfer' ? 'Transfer' : 'Check in';
        const verbed  = ctx.action==='transfer' ? 'transferred' : 'checked in';
        const occMsg = occupiedBy
          ? `\n\n⚠ Bay ${bayId} currently held by ${occupiedBy.reg} (${lastInDays(occupiedBy)}d).\nOK = force-replace (old key auto-checked-out + marked UNASSIGNED, both actions logged as FORCED).`
          : `\n\n✓ Bay ${bayId} is empty.`;
        if(!confirm(`${verbing} ${ctx.k.reg} (${ctx.k.car}) to bay ${bayId}${ctx.action==='transfer'?` in ${ctx.branch}`:''}?${occMsg}`)) return;
        selectingBayFor = null;

        if(occupiedBy){
          if(occupiedBy.inSince){ occupiedBy.totalParkedMs = (occupiedBy.totalParkedMs||0) + (Date.now() - occupiedBy.inSince); }
          occupiedBy.inSince = null; occupiedBy.status = 'out'; occupiedBy.unassigned = true;
          const tag = ctx.action==='transfer' ? '(transferred-in)' : '(bay reclaimed)';
          db.history.unshift({ts:Date.now(), type:'out', keyId:occupiedBy.id, user:db.user.name, purpose:`auto-closed ${tag} — UNASSIGNED`, forced:true});
          notifyMovement(occupiedBy, 'out', {purpose:`auto-closed ${tag} — UNASSIGNED`, forced:true});
        }
        if(ctx.action === 'transfer'){
          const from = ctx.k.branch || '?';
          db.history.unshift({ts:Date.now(), type:'transfer', keyId:ctx.k.id, user:db.user.name, from, to:ctx.branch, note:ctx.note||''});
          notifyMovement(ctx.k, 'transfer', {from, to:ctx.branch, note:ctx.note||'', forced:!!occupiedBy});
          ctx.k.branch  = ctx.branch;
          ctx.k.parking = bayId;
          ctx.k.unassigned = false;
          saveDB(); render(); toast(`${ctx.k.reg} → ${ctx.branch} bay ${bayId}${occupiedBy?' (forced)':''}`);
        } else {
          ctx.k.status='available'; ctx.k.inSince=Date.now(); ctx.k.branch=ctx.branch; ctx.k.parking=bayId; ctx.k.unassigned=false;
          db.history.unshift({ts:Date.now(), type:'in', keyId:ctx.k.id, user:db.user.name, parking:bayId, forced:!!occupiedBy});
          notifyMovement(ctx.k, 'in', {parking:bayId, forced:!!occupiedBy});
          saveDB(); render(); toast(`${ctx.k.reg} checked in @ ${bayId}${occupiedBy?' (forced)':''}`);
        }
        return;
      }
    }

    const disBay = hit('[data-disabled-bay]');
    if(disBay){
      const bayId  = disBay.dataset.disabledBay;
      const branch = disBay.dataset.branch || 'Cheras';
      if(isAdmin() && mapEditMode){
        if(confirm(`Bay ${bayId} (${branch}) is NOT AVAILABLE. Mark it AVAILABLE again?`)){
          toggleBayDisabled(bayId, branch); render(); toast(`${branch} ${bayId} → Available`);
        }
      } else {
        toast(`Bay ${bayId} is not available`);
      }
      return;
    }

    const emptyBay = hit('[data-empty-bay]');
    if(emptyBay){
      const bayId  = emptyBay.dataset.emptyBay;
      const branch = emptyBay.dataset.branch || 'Cheras';
      if(isAdmin() && mapEditMode){
        if(confirm(`Mark ${branch} bay ${bayId} as NOT AVAILABLE?\n(Red on the map; no one can assign cars to it until you mark it Available again.)`)){
          toggleBayDisabled(bayId, branch); render(); toast(`${branch} ${bayId} → Not Available`);
        }
        return;
      }
      openAssignEmptyBay(bayId, branch);
      return;
    }

    const svgBay = hit('g.bay[data-id]');
    if(svgBay){ openKey(svgBay.dataset.id); return; }

    if(hit('#admin-users')){ openManageUsers(); return; }
    if(hit('#admin-purposes')){ openManagePurposes(); return; }
    if(hit('#admin-branches')){ openManageBranches(); return; }
    if(hit('#admin-dealers')){ openManageDealers(); return; }
    if(hit('#bulk-add')){ if(!isAdmin()){ toast('Admin only'); return; } openBulkAdd(); return; }
    if(hit('#bulk-mode')){ bulkMode = !bulkMode; bulkSel.clear(); go('keys'); return; }
    const goBtn = hit('[data-go]'); if(goBtn){ go(goBtn.dataset.go); return; }
    if(hit('#wipe')){
      if(confirm('Reset all data back to the demo set?')){ db = structuredClone(DEFAULT_DB); saveDB(); render(); toast('Reset done'); }
      return;
    }
  });

  main.addEventListener('input', (e)=>{
    if(e.target.id === 'kq'){
      keysFilter.q = e.target.value;
      const v = e.target.value; render();
      const box = $('#kq');
      if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
    if(e.target.id === 'hq'){
      homeQuery = e.target.value;
    }
    if(e.target.id === 'mcq'){
      myCarQuery = e.target.value;
      const v = e.target.value; render();
      const box = $('#mcq'); if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
    if(e.target.id === 'hsq'){
      historyQuery = e.target.value;
      const v = e.target.value; render();
      const box = $('#hsq'); if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
  });

  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'hq' && e.key === 'Enter'){
      e.preventDefault();
      keysFilter = { q:homeQuery, status:'all', spare:'all', branch:homeBranch };
      go('keys');
    }
  });

  main.addEventListener('change', (e)=>{
    if(e.target.id === 'scan-file' || e.target.id === 'scan-cam') return scanFromFile(e);
    if(e.target.id === 'import-file') return importFile(e);
  });

  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'scan-manual' && e.key === 'Enter'){
      e.preventDefault(); runManualLookup();
    }
  });
}

/* ---------- key actions ---------- */
function openKey(id){
  const k = db.keys.find(k=>k.id===id); if(!k) return;
  const moves = db.history.filter(h=>h.keyId===id).sort((a,b)=>b.ts-a.ts);
  const parkedNow = currentParkedMs(k);
  const canAct = canEditKey(k);
  openSheet(`
    <h3 style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k.car}</span>
      <button class="icon-btn" id="sh-photo-action" title="${k.photo ? 'View key photo' : (canEditKey(k) ? 'Upload key photo' : 'No key photo')}" style="background:${k.photo?'#000':'var(--hover)'};color:${k.photo?'#fff':'var(--muted)'};border-radius:10px;width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:18px">📸</button>
    </h3>
    <div class="muted" style="margin-bottom:8px">${k.reg} · ${k.branch||k.dealer} · 📍 ${k.parking}</div>
    ${k.unassigned ? `
      <div class="card pad" style="background:#fff7ed;border:2px solid #FF3D00;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="font-size:28px">⚠</div>
          <div>
            <div style="font-weight:800;color:#9a3412">Action required — UNASSIGNED</div>
            <div style="color:#9a3412;font-size:12px">This key was auto-closed when another car claimed its bay. ${canAct?'You can':'Only the creator ('+(k.createdBy||'—')+') or an admin can'} now Key In, Key Out, Transfer, or Delete it.</div>
          </div>
        </div>
        ${canAct ? `
          <div class="row" style="margin-bottom:6px">
            <button class="btn-in btn" id="ua-in">Key In</button>
            <button class="btn-out btn" id="ua-out">Key Out</button>
          </div>
          <div class="row">
            <button class="btn-transfer btn" id="ua-tr">Transfer</button>
            <button class="btn-force btn" id="ua-del">Delete</button>
          </div>

function runActionOnKey(k, action){
  if(!k) return;
  if(action === 'in'){
    if(k.status === 'available'){
      if(!confirm(`Force replace?\n${k.reg} is already parked at ${k.parking||'—'} — last user may have forgotten to Key Out.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markIn(k);
  } else if(action === 'out'){
    if(k.status === 'out'){
      if(!confirm(`Force replace?\n${k.reg} is already OUT — last user may have forgotten to Key In.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markOut(k);
  } else if(action === 'transfer'){
    openTransfer(k);
  }
}

function markOut(k){
  openPurposeSheet(k, purpose=>{
    if(!purpose) return;
    if(purpose === 'Sold/Delivered'){

      const ids = db.keys.filter(x => x.pairId && x.pairId===k.pairId).map(x=>x.id);
      const targets = ids.length ? ids : [k.id];
      targets.forEach(id=>{
        const t = db.keys.find(x=>x.id===id);
        db.history.unshift({ts:Date.now(), type:'deleted', keyId:id, user:db.user.name, purpose:'Sold/Delivered', snapshot:t ? {...t} : null});
        if(t) notifyMovement(t, 'deleted', {purpose:'Sold/Delivered'});
      });
      db.keys = db.keys.filter(x => !targets.includes(x.id));
      saveDB(); render(); closeSheet(); toast(`${k.reg} sold — ${targets.length} key${targets.length>1?'s':''} removed`);
      return;
    }

    const forced = (k.status==='out');
    if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
    k.inSince = null;
    k.status  = 'out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose, forced});
    notifyMovement(k, 'out', {purpose, forced});
    saveDB(); render(); closeSheet(); toast(`${k.reg} checked out${forced?' (FORCED)':''}`);
  });
}

function markIn(k){

  if(k.spare){
    closeSheet();
    k.status='available'; k.inSince=Date.now(); k.parking='BOX'; k.unassigned=false;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:'BOX'});
    notifyMovement(k, 'in', {parking:'BOX'});
    saveDB(); render(); toast(`${k.reg} (spare) returned to BOX`);
    return;
  }

  openKeyInSheet(k);
}

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

function lastInDays(k){
  if(k.inSince) return Math.floor((Date.now() - k.inSince)/DAY);
  const last = db.history.find(h=>h.keyId===k.id && h.type==='in');
  return last ? Math.floor((Date.now() - last.ts)/DAY) : 0;
}

function doCheckInToBay(k, branch, bay){
  if(!k || !branch || !bay) return false;
  const conflict = db.keys.find(x => !x.spare && x.id!==k.id && x.branch===branch && (x.parking||'').toUpperCase()===bay.toUpperCase() && bay.toUpperCase()!=='BOX' && x.status==='available');
  if(conflict){
    if(!confirm(`Bay ${bay} held by ${conflict.reg} (${lastInDays(conflict)}d). Force replace?\n• Old key auto-checked-out and marked UNASSIGNED\n• Both actions logged as FORCED`)) return false;
    if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
    conflict.inSince = null; conflict.status = 'out'; conflict.unassigned = true;
    db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
    notifyMovement(conflict, 'out', {purpose:'auto-closed (bay reclaimed) — UNASSIGNED', forced:true});
  }
  k.status='available'; k.inSince = Date.now(); k.branch = branch; k.parking = bay; k.unassigned = false;
  db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict});
  notifyMovement(k, 'in', {parking:bay, forced:!!conflict});
  saveDB(); render();
  toast(`${k.reg} checked in @ ${bay}${conflict?' (forced)':''}`);
  return true;
}
