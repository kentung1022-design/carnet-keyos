<style>
  :root{
    /* CARNET theme — white bg, black text, orange brand accent */
    --bg:#ffffff; --card:#ffffff; --text:#000000; --muted:#6b7280;
    --brand:#FF3D00;         /* CARNET orange-red (the 'V' in the logo) */
    --brand-2:#FF6E40;
    --accent:#FF3D00;
    --good:#e6f7ec; --good-fg:#0a7d2b;
    --bad:#fde7e7;  --bad-fg:#b71c1c;
    --warn:#fff4d6; --warn-fg:#7a4a00;
    --border:#e5e7eb; --hover:#f3f4f6;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
    --radius:14px;
    --topbar-bg:#000000;     /* CARNET logo background = black */
    --topbar-fg:#ffffff;
    /* Action colors (consistent app-wide) */
    --action-in:#16a34a;       /* Key In   = green   */
    --action-out:#dc2626;      /* Key Out  = red     */
    --action-transfer:#0ea5e9; /* Transfer = blue    */
    --action-add:#FF3D00;      /* Add      = CARNET orange */
    --action-force:#9ca3af;    /* Forced   = neutral gray (clear grey) */
  }
  .btn-in       { background:var(--action-in)      ; color:#fff }
  .btn-out      { background:var(--action-out)     ; color:#fff }
  .btn-transfer { background:var(--action-transfer); color:#fff }
  .btn-add      { background:var(--action-add)     ; color:#fff }
  .btn-force    { background:var(--action-force)   ; color:#fff }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand)}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid #000;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .logo{font:900 22px/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:1px;display:flex;align-items:center;flex:1;font-style:italic;transform:skewX(-6deg);user-select:none}
  .topbar .logo .v{color:var(--brand);display:inline-block}
  .topbar .small-tag{color:#9ca3af;font:600 11px/1 system-ui;margin-left:8px;text-transform:uppercase;letter-spacing:1.2px;font-style:normal;transform:skewX(6deg);display:inline-block}
  .icon-btn{background:transparent;border:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--topbar-fg)}
  .icon-btn:hover{background:rgba(255,255,255,.1)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:14px}

  /* Dashboard */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.brand{background:linear-gradient(160deg,#ccfbf1,#a7f3d0);border-color:#5eead4;color:#064e3b}
  .stat.info{background:linear-gradient(160deg,#dbeafe,#bae6fd);border-color:#7dd3fc;color:#0c4a6e}
  .stat.warn{background:linear-gradient(160deg,#fef3c7,#fde68a);border-color:#fcd34d;color:#78350f}
  .stat.bad {background:linear-gradient(160deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#7f1d1d}

  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .quick button{padding:14px 10px;border-radius:14px;border:0;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;line-height:1.1}
  .qa-out{background:var(--action-out)}
  .qa-in {background:var(--action-in)}
  .qa-tr {background:var(--action-transfer)}
  .quick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

  /* Tabs / nav */
  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:70}
  main{padding-bottom:80px}
  .tab{background:transparent;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer;border-radius:10px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
  .tab.active{color:var(--brand)}
  .tab:hover{background:var(--hover)}

  /* List items */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 8px}
  .listhead h2{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .key-card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
  .key-card:hover{background:var(--hover)}
  .key-card .qrwrap{width:64px;height:64px;background:#fff;border-radius:10px;padding:4px;display:grid;place-items:center;border:1px solid var(--border)}
  .key-card .qrwrap canvas, .key-card .qrwrap img{width:100%;height:100%}
  .key-card .title{font-weight:700;font-size:15px}
  .key-card .meta{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px}
  .key-card .meta span{display:inline-flex;align-items:center;gap:4px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
  .pill.avail{background:var(--good);color:var(--good-fg)}
  .pill.out{background:var(--bad);color:var(--bad-fg)}
  .pill.spare{background:#e0e7ff;color:#3730a3}

  /* Forms */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input, .field select, .field textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .btn{padding:12px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn.secondary{background:var(--hover);color:var(--text)}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .btn.danger{background:#dc2626;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.block{display:block;width:100%}

  /* Search bar */
  .search{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;font-weight:500;color:var(--text)}
  .search svg{width:22px;height:22px;flex:none;color:var(--muted)}
  .filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* Modal / sheet */
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .scrim.open{display:flex;animation:fadein .15s ease}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:16px 16px 0 0;padding:16px;max-height:78vh;overflow:auto;animation:slideup .22s ease;margin-bottom:72px}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .grab{width:42px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 12px}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}

  /* QR full screen */
  .qr-big{display:grid;place-items:center;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--border)}
  .qr-big canvas, .qr-big img{width:240px;height:240px}
  .qr-caption{text-align:center;color:var(--muted);margin-top:8px;font-size:13px}

  /* Movement history */
  .mv{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;border-left:4px solid var(--good-fg)}
  .mv.out{border-left-color:#dc2626}
  .mv .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mv .car{font-weight:700}
  .mv .reg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:13px}
  .mv .row2{display:flex;gap:12px;color:var(--muted);font-size:12.5px;margin-top:4px;flex-wrap:wrap}

  /* Scanner */
  #scan-region{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:300px}
  #scan-region video{width:100%!important;height:auto!important}
  .scan-hint{color:var(--muted);text-align:center;margin-top:8px;font-size:13px}

  /* Toast — must never block taps */
  @keyframes mapBayPulse { 0%,100%{ filter: drop-shadow(0 0 0 #FF3D00); } 50%{ filter: drop-shadow(0 0 8px #FF3D00); } }
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.show{opacity:1}

  /* Empty / loading */
  .empty{padding:32px 14px;text-align:center;color:var(--muted)}
  .skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--hover),var(--border),var(--hover));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* Misc */
  .hide{display:none!important}
  .muted{color:var(--muted)}
  .right{margin-left:auto}
  .gap{height:8px}
  details summary{cursor:pointer;padding:8px 0;color:var(--brand);font-weight:600}
</style>
</head>

function loadDB(){
  let stored;
  try { stored = JSON.parse(localStorage.getItem(DB_KEY)); } catch { stored = null; }
  if(!stored) return structuredClone(DEFAULT_DB);
  // Backfill any missing top-level fields from DEFAULT_DB so old localStorage works with newer code.
  // Critical for: users (needed for login), session, bayRenames, disabledBays, customBays.
  const fresh = structuredClone(DEFAULT_DB);
  Object.keys(fresh).forEach(k => {
    if(stored[k] === undefined) stored[k] = fresh[k];
  });
  // If users array is empty OR the first user lacks username/password (old schema), reseed
  if(!Array.isArray(stored.users) || stored.users.length === 0
     || !stored.users[0].username || !stored.users[0].password){
    stored.users = fresh.users;
  }
  // Force-merge any missing seed user (by username) so e.g. ken is always present even after partial migrations
  const haveUsernames = new Set(stored.users.map(u => String(u.username||'').toLowerCase()));
  fresh.users.forEach(u => {
    if(!haveUsernames.has(String(u.username).toLowerCase())) stored.users.push(u);
  });
  // Backfill session if missing
  if(!stored.session) stored.session = { authed:false };
  return stored;
}

/* ---------- helpers ---------- */
const fmt = d => new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* Notifications — push to creator on any movement, plus all admins on forced actions. */
function notifyMovement(k, type, details){
  if(!k) return;
  db.notifications = db.notifications || [];
  details = details || {};

  const recipients = new Set();
  if(k.createdBy && k.createdBy !== db.user.name) recipients.add(k.createdBy);
  if(details.forced){

    (db.users||[]).filter(u => u.role==='admin' && u.name !== db.user.name).forEach(u => recipients.add(u.name));
  }
  if(!recipients.size){ updateBellBadge(); return; }

  const baseId = 'N' + Date.now() + Math.random().toString(36).slice(2,5);
  recipients.forEach((forUser, i)=>{
    db.notifications.unshift({
      id: baseId + '-' + i,
      ts: Date.now(),
      forUser, actor: db.user.name,
      type, keyId: k.id, car: k.car, reg: k.reg,
      details, read:false,
    });
  });
  if(db.notifications.length > 300) db.notifications.length = 300;

  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try {
      const tag = type==='in'?'Key In':type==='out'?'Key Out':type==='transfer'?'Branch Transfer':'Deleted';
      const body =
        type==='in'        ? `${k.car} (${k.reg}) checked in @ ${details.parking||'—'} by ${db.user.name}` :
        type==='out'       ? `${k.car} (${k.reg}) checked out · ${details.purpose||'—'} by ${db.user.name}${details.forced?' [FORCED]':''}` :
        type==='transfer'  ? `${k.car} (${k.reg}) transferred ${details.from||'?'} → ${details.to||'?'} by ${db.user.name}` :
                             `${k.car} (${k.reg}) removed · ${details.purpose||''} by ${db.user.name}`;
      new Notification(`CARNET · ${tag}${details.forced?' [FORCED]':''}`, { body, tag: baseId });
    } catch(_){}
  }
  updateBellBadge();
}
function myUnreadNotifs(){
  return (db.notifications||[]).filter(n => n.forUser === db.user.name && !n.read).length;
}
function updateBellBadge(){
  const n = myUnreadNotifs();
  const badge = document.getElementById('bell-badge'); if(!badge) return;
  if(n>0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = 'grid'; }
  else { badge.style.display = 'none'; }
}

const currentParkedMs = k => (k.status==='available' && k.inSince) ? Math.max(0, Date.now() - k.inSince) : 0;
const totalParkedMs   = k => (k.totalParkedMs||0) + currentParkedMs(k);
function fmtDur(ms){
  if(!ms || ms<0) ms = 0;
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h ${m%60}m`;
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}

function lastOutMs(k){
  const last = db.history.find(h=>h.keyId===k.id && h.type==='out');
  return last ? Date.now() - last.ts : 0;
}

function isAdmin(){ const r = db.user?.role || 'user'; return r === 'admin' || r === 'superadmin'; }
function isSuperAdmin(){ return (db.user?.role || 'user') === 'superadmin'; }
function canEditKey(k){ return isAdmin() || (k.createdBy && k.createdBy === db.user.name); }

function ageDays(k){ const ms = currentParkedMs(k); return Math.floor(ms / DAY); }
function isOver180(k){ return ageDays(k) > 180; }

/* Car Wash — a car is "in car wash" if its current status is OUT and the last key-out purpose
   begins with "Car Wash" + a branch name. */
function carWashBranch(k){
  if(!k || k.status !== 'out') return null;
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  if(!last) return null;
  const p = String(last.purpose || '');
  if(!/^\s*car\s*wash/i.test(p)) return null;
  const m = p.match(/car\s*wash\s*[-–—:]?\s*(.+)/i);
  return m ? m[1].trim() : (k.branch || '?');
}
function carsInCarWash(branch){
  return db.keys.filter(k => {
    const b = carWashBranch(k);
    return b && (!branch || b.toLowerCase() === branch.toLowerCase());
  });
}

function openCarWashList(branch){

  `);
  // Wire each row: tap → straight into the bay picker (Key In flow)
  $$('[data-wash-id]').forEach(el=>el.addEventListener('click', ()=>{

    const k = db.keys.find(x => x.id === id); if(!k) return;
    closeSheet();

  }));
}
function overdueMinutes(k){
  if(!k || k.status !== 'out') return 0;
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  if(!last) return 0;
  const limit = (db.purposeLimits||{})[last.purpose] || 0;
  if(!limit) return 0;
  const mins = Math.floor((Date.now() - last.ts) / 60000);
  return mins > limit ? (mins - limit) : 0;
}
function overdueOwnerName(k){
  const last = db.history.find(h => h.keyId === k.id && h.type === 'out');
  return last?.user || null;
}

function checkOverdueAndNotify(){
  db.overdueNotified = db.overdueNotified || {};
  const newlyOverdue = [];
  db.keys.forEach(k=>{
    if(k.status !== 'out') return;
    const over = overdueMinutes(k);
    if(over <= 0) return;
    const last = db.history.find(h => h.keyId === k.id && h.type === 'out'); if(!last) return;
    const tagKey = `${k.id}|${last.ts}`;
    if(db.overdueNotified[tagKey]) return;
    db.overdueNotified[tagKey] = Date.now();
    newlyOverdue.push({k, last, over});
  });
  if(!newlyOverdue.length) return;
  newlyOverdue.forEach(({k, last, over})=>{
    const owner = last.user;
    const recipients = new Set();
    if(owner && owner !== db.user.name) recipients.add(owner);
    if(k.createdBy && k.createdBy !== db.user.name) recipients.add(k.createdBy);
    (db.users||[]).filter(u => u.role==='admin' && u.name !== db.user.name).forEach(u => recipients.add(u.name));
    const baseId = 'NO' + Date.now() + Math.random().toString(36).slice(2,5);
    recipients.forEach((forUser, i)=>{
      db.notifications.unshift({
        id: baseId + '-' + i, ts: Date.now(),
        forUser, actor: 'system',
        type: 'overdue', keyId: k.id, car: k.car, reg: k.reg,
        details: {purpose: last.purpose, over, owner},
        read: false,
      });
    });
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try { new Notification(`⏰ Overdue · ${k.reg}`, { body: `${k.car} · ${last.purpose} · ${over}m overdue · last user ${owner}`, tag: baseId }); } catch(_){}
    }
  });
  saveDB(); updateBellBadge();
}

function nextPairId(){
  let max = 0;
  db.keys.forEach(k=>{
    const m = /^P-(\d+)$/.exec(k.pairId||'');
    if(m){ const n = parseInt(m[1],10); if(n>max) max = n; }
  });
  return 'P-' + String(max+1).padStart(3,'0');
}


// Display helper: spare keys show "{Branch} BOX", main keys show the raw parking value.
function formatLocation(k){
  if(!k) return '';
  if(k.spare){
    // Default storage is BOX. Show as "{Branch} BOX" so we know which physical box.
    const isBox = !k.parking || k.parking.toUpperCase() === 'BOX';
    if(isBox){ return (k.branch || '?') + ' BOX'; }
    // If a spare is OUT and parking was last set to something else, keep that value
    return k.parking;
  }
  return k.parking || '—';
}

// Move a spare key to another branch's BOX — logs a transfer event
function moveSpareToBranch(spareKey, newBranch, note){
  if(!spareKey || !spareKey.spare){ toast('Not a spare key'); return; }
  if(!newBranch || newBranch === spareKey.branch){ toast('Pick a different branch'); return; }
  const oldBranch = spareKey.branch || '?';
  spareKey.branch = newBranch;
  spareKey.parking = 'BOX';
  db.history.unshift({
    ts: Date.now(),
    type: 'transfer',
    keyId: spareKey.id,
    user: db.user.name,
    from: oldBranch,
    to: newBranch,
    note: note || `spare key relocated · ${oldBranch} BOX → ${newBranch} BOX`
  });
  notifyMovement(spareKey, 'transfer', { from: oldBranch, to: newBranch, note: 'spare relocated' });
  saveDB(); render();
  toast(`Spare moved to ${newBranch} BOX`);
}

// Open a sheet to pick a destination branch for a spare key
function openMoveSpareSheet(spareKeyId){
  const k = db.keys.find(x => x.id === spareKeyId);
  if(!k || !k.spare){ toast('Not a spare key'); return; }
  const branches = (db.branches||[]).filter(b => b !== k.branch);
  if(!branches.length){ toast('No other branches available'); return; }
  openSheet(`
    <h3>🔁 Move spare to another BOX</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">
      Currently in <b>${formatLocation(k)}</b>. Pick a destination branch's box. This does NOT move the car — only the physical spare key.
    </div>
    ${branches.map(b => `
      <button class="btn-transfer btn block" data-move-spare-to="${b}" style="margin-bottom:6px;text-align:left;padding:14px">
        🏢 ${b} BOX
      </button>
    `).join('')}
    <button class="btn secondary block" id="move-spare-cancel" style="margin-top:10px">Cancel</button>
  `);
  document.querySelectorAll('[data-move-spare-to]').forEach(btn => {
    btn.addEventListener('click', () => {
      const newBranch = btn.dataset.moveSpareTo;
      if(!confirm(`Move spare key for ${k.reg} from ${k.branch} BOX to ${newBranch} BOX?\n\nThis records a transfer event for the spare key only. The car/main key is not affected.`)) return;
      closeSheet();
      setTimeout(() => moveSpareToBranch(k, newBranch), 60);
    });
  });
  document.getElementById('move-spare-cancel')?.addEventListener('click', closeSheet);
}

function bayConflictKey(bay, exceptId){
  const b = (bay||'').trim().toUpperCase();
  if(!b || b==='BOX') return null;
  // A bay is only "occupied" if a non-spare key is currently checked IN at that bay (status==='available').
  // Keys that were checked OUT still remember their last bay but they don't block a new assignment.
  return db.keys.find(k => !k.spare && k.id!==exceptId && k.status==='available' && (k.parking||'').trim().toUpperCase()===b) || null;
}
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
};
const qrPayload = k => `CARNET|${k.id}|${k.reg}|${k.dealer}`;

// Multiple QR provider URLs — try in order; whichever works on the user's network wins
function qrApiUrls(text, size=256){
  const e = encodeURIComponent(text);
  return [
    `https://api.qrserver.com/v1/create-qr-code/?data=${e}&size=${size}x${size}&margin=0&qzone=1`,
    `https://quickchart.io/qr?text=${e}&size=${size}&margin=1`,
    `https://chart.googleapis.com/chart?cht=qr&chs=${size}x${size}&chl=${e}&chld=M|0`,
  ];
}
function qrServerUrl(text, size=256){ return qrApiUrls(text, size)[0]; }

function nextSerial(){
  const max = db.keys.reduce((m,k)=>{
    const n = parseInt(k.serial||'0',10);
    return Math.max(m, isNaN(n)?0:n);
  }, 10000000);
  return String(max + 1);
}

function serialDisplay(k){
  const s = k.serial || '';
  return k.spare ? `SK_${s}` : s;
}

async function getQrDataUrl(text, size=1024){
  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try { return await QRCode.toDataURL(text, {margin:1, width:size, errorCorrectionLevel:'M'}); } catch(_){}
  }
  const resp = await fetch(qrServerUrl(text, size));
  const blob = await resp.blob();
  return await new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
function loadImg(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }

function compressImage(file, maxWidth=800, quality=0.7){
  return new Promise((res, rej)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function qrInto(el, text, size=64){
  if(!el) return;
  el.innerHTML = '';
  const renderSize = Math.max(size*4, 256);
  const img = document.createElement('img');
  img.alt = 'QR'; img.draggable = false;
  img.style.cssText = 'width:100%;height:100%;display:block;border-radius:4px;pointer-events:none;background:#fff';

  // Try multiple QR providers — whichever the user's network allows
  const providerUrls = qrApiUrls(text, renderSize);
  let providerIdx = 0;
  img.src = providerUrls[0];

  // Cycle through providers on error, then show a stylized placeholder if all fail
  img.addEventListener('error', () => {
    providerIdx++;
    if(providerIdx < providerUrls.length){
      img.src = providerUrls[providerIdx];
      return;
    }
    if(!img._fallback){
      img._fallback = true;
      img.style.display = 'none';
      // Build a CSS "QR-like" placeholder so users see something obviously distinct from the raw text
      const pad = document.createElement('div');
      pad.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#fff;border-radius:4px;padding:6px;text-align:center;font:700 9px ui-monospace,Menlo,monospace;line-height:1.3;gap:4px;overflow:hidden';
      pad.innerHTML = '<div style="font-size:11px;letter-spacing:.5px;color:#FF3D00;font-weight:900">⬛ NO QR</div><div style="opacity:.85;font-size:9px;word-break:break-all;font-weight:600;overflow:hidden;max-height:60%">' + (text||'').replace(/[<>]/g,'') + '</div><div style="font-size:8px;color:#94a3b8">network blocked — install library</div>';
      el.appendChild(pad);
    }
  });

  el.appendChild(img);

  // Try to upgrade to a locally-generated QR (better quality, works offline). Retry for 2s in case lib still loading.
  const tryLocal = () => {
    if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
      try {
        const p = QRCode.toDataURL(text, {margin:1, width:renderSize, errorCorrectionLevel:'M', color:{dark:'#000000',light:'#FFFFFF'}});
        Promise.resolve(p).then(url => {
          img.src = url;
          img.style.display = 'block';
          img._fallback = false;
          // Remove text placeholder if present
          el.querySelectorAll('div').forEach(d => d.remove());
        }).catch(()=>{});
        return true;
      } catch(_){}
    }
    return false;
  };
  if(!tryLocal()){
    let attempts = 0;
    const retry = setInterval(() => {
      attempts++;
      if(tryLocal() || attempts > 10){ clearInterval(retry); }
    }, 200);
  }
}

async function downloadQR(payload, filename){
  filename = (filename||'qr')+'.png';

  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try {
      const url = await QRCode.toDataURL(payload, {margin:2, width:1024, errorCorrectionLevel:'M'});
      return triggerDownload(url, filename);
    } catch(_){}
  }

  try {
    const resp = await fetch(qrServerUrl(payload, 1024));
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    triggerDownload(url, filename);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){

    window.open(qrServerUrl(payload, 1024), '_blank');
    toast('Opened QR in new tab — long-press to save');
  }
}
function triggerDownload(url, filename){
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Saved to downloads');
}

/* ---------- 15×30 cm printable sticker ---------- */

async function downloadSticker(k){
  if(!k) return;
  toast('Building sticker…');
  const DPI = 300;
  const CM  = DPI / 2.54;
  const W   = Math.round(15 * CM);
  const H   = Math.round(30 * CM);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, W-8, H-8);

  const halfH   = H / 2;
  const qrPadX  = W * 0.06;
  const qrPadTop= W * 0.06;
  const qrSize  = Math.min(W - qrPadX*2, halfH - qrPadTop*2);
  const qrX     = (W - qrSize) / 2;
  const qrY     = (halfH - qrSize) / 2;
  try {
    const dataUrl = await getQrDataUrl(qrPayload(k), 1400);
    const img     = await loadImg(dataUrl);
    ctx.drawImage(img, qrX, qrY, qrSize, qrSize);
  } catch(e){ toast('QR fetch failed — check internet'); return; }

  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W*0.08, halfH); ctx.lineTo(W*0.92, halfH); ctx.stroke();

  ctx.fillStyle = '#0f766e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `700 ${Math.round(W*0.06)}px system-ui, -apple-system, "Segoe UI", Arial`;
  ctx.fillText('CARNET Key OS', W/2, halfH + W*0.025);

  const rowsTop   = halfH + W*0.14;
  const rowsBot   = H    - W*0.07;
  const rowGap    = (rowsBot - rowsTop) / 3;
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#0f172a';

  function drawRow(idx, label, value, valueFont, mono=false){
    const y = rowsTop + rowGap*idx + rowGap/2;
    ctx.fillStyle = '#64748b';
    ctx.font = `500 ${Math.round(W*0.035)}px system-ui, Arial`;
    ctx.fillText(label, W/2, y - rowGap*0.32);
    ctx.fillStyle = '#0f172a';
    ctx.font = `${valueFont} ${mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, Arial'}`;
    ctx.fillText(value, W/2, y + rowGap*0.05);
  }

  drawRow(0, 'PLATE',  k.reg || '—',         `900 ${Math.round(W*0.16)}px`);
  drawRow(1, 'MODEL',  k.car || '—',         `700 ${Math.round(W*0.09)}px`);
  drawRow(2, 'SERIAL', serialDisplay(k)||'—',`700 ${Math.round(W*0.10)}px`, true);

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const fname = `sticker_${serialDisplay(k)}_${k.reg}.png`.replace(/[^\w.-]/g,'_');
    triggerDownload(url, fname);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

async function downloadAllStickers(){
  if(!db.keys.length){ toast('No keys'); return; }
  toast(`Building ${db.keys.length} stickers…`);
  for(const k of db.keys){
    await downloadSticker(k);
    await new Promise(r=>setTimeout(r, 350));
  }
  toast('All stickers downloaded');
}

/* ---------- views + nav stack ---------- */
let view = 'home';
let navStack = ['home'];
function go(v, push=true){
  if(v === 'bayedit'){ selectingBayFor = null; if(typeof bayEditor !== 'undefined') bayEditor.selected = null; }
  const sameView = (v === view);
  // Auto-exit bulk mode when leaving the Keys view so it can't surprise the next visit.
  if(view === 'keys' && v !== 'keys'){ bulkMode = false; bulkSel.clear(); }
  view = v;
  if(push && !sameView){
    navStack.push(v);
    history.pushState({nav:v}, '', '#'+v);
  }
  $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
  render();
  if(!sameView) window.scrollTo(0,0);
}
function goBack(){

  if($('#scrim').classList.contains('open')){ closeSheet(); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));
    $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
    render();
  }
}

window.addEventListener('popstate', (e)=>{

  if($('#scrim')?.classList.contains('open')){ closeSheet(); history.pushState({nav:view}, '', '#'+view); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));
    $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
    render();
  } else {

    history.pushState({nav:view}, '', '#'+view);
    toast('Use ☰ menu or bottom bar to navigate');
  }
});

function doLogin(){
  const userIn = (document.getElementById('login-user')?.value || '').trim().toLowerCase();
  const passIn = document.getElementById('login-pass')?.value || '';
  const err = document.getElementById('login-err');
  if(!userIn || !passIn){
    if(err){ err.textContent = 'Enter username and password.'; err.style.display = 'block'; }
    return;
  }
  const usersList = db.users || [];
  // Helpful debug: show what the app currently has
  console.log('[login] attempt user=', userIn, 'pw_len=', passIn.length, 'usersInDB=', usersList.length, 'usernames=', usersList.map(u=>u.username));
  const found = usersList.find(x => String(x.username||'').toLowerCase() === userIn && String(x.password||'') === passIn);
  if(!found){
    if(err){
      if(!usersList.length){
        err.innerHTML = 'No users in this device. Tap <b>Reset demo data</b> below.';
      } else {
        const known = usersList.find(x => String(x.username||'').toLowerCase() === userIn);
        if(!known){
          err.innerHTML = `Username "${userIn}" not found. Try: <code>${usersList.slice(0,5).map(u=>u.username).join(', ')}</code>`;
        } else {
          err.textContent = 'Password is wrong. (Demo password is demo123)';
        }
      }
      err.style.display = 'block';
    }
    return;
  }
  db.user = {
    name:    found.name,
    dealer:  found.dealer,
    branch:  found.branch || db.user?.branch || db.branches?.[0] || 'Cheras',
    userId:  found.id,
    role:    found.role || 'user'
  };
  if(!db.session) db.session = {};
  db.session.authed = true;
  saveDB();
  view = 'home';
  render();
  toast(`Welcome, ${found.name}`);
}

function doLogout(){
  if(!confirm('Sign out?')) return;
  if(!db.session) db.session = {};
  db.session.authed = false;
  saveDB();
  render();
}

function render(){
  const m = $('#main');
  // Gate everything behind the login screen
  if(!db.session?.authed){
    m.innerHTML = viewLogin();
    // Hide chrome (topbar nav buttons + bottom tabs) while logged out
    document.querySelector('header.topbar')?.style.setProperty('display','none');
    document.querySelector('nav.tabs')?.style.setProperty('display','none');
    setTimeout(()=>{
      const u = document.getElementById('login-user'); if(u) u.focus();
      const btn = document.getElementById('login-btn'); if(btn) btn.addEventListener('click', doLogin);
      const pw = document.getElementById('login-pass'); if(pw) pw.addEventListener('keydown', ev=>{ if(ev.key==='Enter') doLogin(); });
      const rst = document.getElementById('login-reset');
      if(rst) rst.addEventListener('click', ()=>{
        if(!confirm('This wipes ALL local data (keys, history, custom bays) and reseeds the demo. Continue?')) return;
        localStorage.removeItem(DB_KEY);
        location.reload();
      });
    }, 0);
    return;
  }
  // Logged in — restore chrome
  document.querySelector('header.topbar')?.style.removeProperty('display');
  document.querySelector('nav.tabs')?.style.removeProperty('display');
  if(view==='home'){ m.innerHTML = viewHome(); setTimeout(applyMapPlateHighlight, 30); }
  if(view==='keys')     m.innerHTML = viewKeys();
  if(view==='scan')   { m.innerHTML = viewScan(); startScanner(); }
  if(view==='history')  m.innerHTML = viewHistory();
  if(view==='more')     m.innerHTML = viewMore();
  if(view==='map')      m.innerHTML = viewParkingMap();
  if(view==='aging')    m.innerHTML = viewAging();
  if(view==='admin')    m.innerHTML = viewAdmin();
  if(view==='mycar')    m.innerHTML = viewMyCar();
  if(view==='bayedit'){
    m.innerHTML = viewBayEditor();
    bayEditorRenderSelectionPanel();
    // Belt + suspenders: attach a direct click handler to the SVG so bay taps ALWAYS
    // reach bayEditorSelectBay, regardless of any global-delegation issue.
    const svg = document.getElementById('be-svg');
    if(svg){
      svg.addEventListener('click', (ev) => {
        if(beDragMoved){ return; } // drag-end click is suppressed by the global handler too
        const bayG = ev.target.closest('g.bay') || ev.target.closest('g.be-built');
        if(!bayG) return;
        let currentId = bayG.dataset.emptyBay || bayG.dataset.disabledBay || bayG.dataset.builtId || bayG.dataset.builtOrig || '';
        if(!currentId && bayG.dataset.id){
          const kk = db.keys.find(k=>k.id===bayG.dataset.id);
          if(kk) currentId = kk.parking || '';
        }
        if(!currentId) return;
        ev.stopPropagation();
        if(bayEditor.deleteMode){ bayEditorDeleteAnyBay(currentId); return; }
        bayEditorSelectBay(currentId);
      });
    }
  }
  updateBellBadge();

  $$('.qrwrap[data-payload]').forEach(el=>{
    try {
      qrInto(el, el.dataset.payload, 64);
      el.style.cursor = 'pointer';
      el.title = 'Tap to download 15×30 cm sticker';
      // Bind the click handler ONCE per element — flag prevents accumulating duplicates on every render
      if(!el._qrClickBound){
        el._qrClickBound = true;
        el.addEventListener('click', ev=>{
          ev.stopPropagation();
          const payload = el.dataset.payload || '';
          const parts = payload.split('|');
          if(parts[0]==='CARNET'){
            const id = parts[1];
            const k  = db.keys.find(x=>x.id===id);
            if(k) downloadSticker(k); else downloadQR(payload, id);
          } else if(parts[0]==='USER'){
            downloadQR(payload, `user_${parts[1]||''}`);
          } else {
            downloadQR(payload, 'qr');
          }
        });
      }
    } catch(e){ console.error('QR paint failed', e); el.textContent = '⚠'; }
  });
}

function matchMvFilter(h, f, inBranchFn){
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const today = h.ts >= startOfToday.getTime();
  const purposeLc = String(h.purpose||'').toLowerCase();
  switch(f){
    case 'all':         break;
    case 'in':          if(h.type!=='in') return false; break;
    case 'out':         if(h.type!=='out') return false; break;
    case 'transfer':    if(h.type!=='transfer') return false; break;
    case 'deleted':     if(h.type!=='deleted') return false; break;
    case 'sold':        if(!(h.type==='deleted' && purposeLc.includes('sold'))) return false; break;
    case 'warmup':      if(!purposeLc.includes('warm')) return false; break;
    case 'inspection':  if(!purposeLc.includes('inspect')) return false; break;
    case '180d': {
      const k = db.keys.find(x=>x.id===h.keyId); if(!k || !isOver180(k)) return false; break;
    }
    case 'forced':      if(!h.forced) return false; break;
    case 'today':       if(!today) return false; break;
    case 'week':        if((Date.now()-h.ts) > 7*86400000) return false; break;
    case 'today-in':    if(h.type!=='in'       || !today) return false; break;
    case 'today-out':   if(h.type!=='out'      || !today) return false; break;
    case 'today-tr':    if(h.type!=='transfer' || !today) return false; break;
    case 'today-sold':  if(!(h.type==='deleted' && purposeLc.includes('sold') && today)) return false; break;
    default: break;
  }
  if(typeof inBranchFn === 'function'){
    const k = db.keys.find(x=>x.id===h.keyId);
    if(k && !inBranchFn(k)) return false;
  }
  return true;
}


// Force-replace flow: tap occupied bay → key profile → "Force replace at this bay" → search list → pick key → force replace
function openForceReplaceSheet(currentKeyId){
  const current = db.keys.find(k => k.id === currentKeyId); if(!current){ toast('Key not found'); return; }
  let q = '';
  function renderList(){
    const ql = q.toLowerCase().trim();
    const candidates = db.keys.filter(k =>
      k.id !== current.id && !k.spare &&
      (!ql || (k.car||'').toLowerCase().includes(ql) || (k.reg||'').toLowerCase().includes(ql) || (k.id||'').toLowerCase().includes(ql))
    ).slice(0, 30);
    return candidates.map(k => {
      const status = k.status==='available'
        ? `<span style="background:#dcfce7;color:#0a7d2b;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:800">IN @ ${k.parking||'—'}</span>`
        : `<span style="background:#fee2e2;color:#7f1d1d;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:800">OUT</span>`;
      return `<div data-force-pick="${k.id}" style="display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff">
        <div style="flex:1;min-width:0">
          <div style="font-weight:800">${k.car} <span style="font-family:ui-monospace,Menlo,monospace;color:#64748b">· ${k.reg}</span></div>
          <div class="muted" style="font-size:11px">${k.dealer||''} · ${k.branch||'—'}</div>
        </div>
        ${status}
      </div>`;
    }).join('') || '<div class="muted" style="text-align:center;padding:14px">No keys match</div>';
  }
  openSheet(`
    <h3>🔄 Force-replace ${current.reg} @ ${current.parking||'—'}</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">Pick which key should take this bay. The current key (${current.reg}) will be checked out and marked UNASSIGNED.</div>
    <input id="force-q" placeholder="Search car / plate / id…" autocomplete="off" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px">
    <div id="force-list">${renderList()}</div>
  `);
  document.getElementById('force-q')?.addEventListener('input', (e)=>{
    q = e.target.value;
    document.getElementById('force-list').innerHTML = renderList();
  });
  // Use event delegation for picks
  document.getElementById('force-list')?.addEventListener('click', (e)=>{
    const pick = e.target.closest('[data-force-pick]'); if(!pick) return;
    const newKey = db.keys.find(k => k.id === pick.dataset.forcePick); if(!newKey) return;
    const branch = current.branch;
    const bay = current.parking || '';
    if(!confirm(`Force-replace ${current.reg} with ${newKey.reg} at ${branch} bay ${bay}?\n\nCurrent (${current.reg}) → OUT + UNASSIGNED.\nNew (${newKey.reg}) → IN @ ${bay} (forced).`)) return;
    // Check out current
    if(current.inSince) current.totalParkedMs = (current.totalParkedMs||0) + (Date.now() - current.inSince);
    current.inSince = null; current.status = 'out'; current.unassigned = true;
    db.history.unshift({ts:Date.now(), type:'out', keyId:current.id, user:db.user.name, purpose:'force-replaced by '+newKey.reg+' — UNASSIGNED', forced:true});
    notifyMovement(current, 'out', {purpose:'force-replaced by '+newKey.reg+' — UNASSIGNED', forced:true});
    // Bring new in
    if(newKey.status === 'available' && newKey.inSince){ newKey.totalParkedMs = (newKey.totalParkedMs||0) + (Date.now() - newKey.inSince); }
    newKey.status = 'available'; newKey.inSince = Date.now(); newKey.branch = branch; newKey.parking = bay; newKey.unassigned = false;
    db.history.unshift({ts:Date.now(), type:'in', keyId:newKey.id, user:db.user.name, parking:bay, forced:true});
    notifyMovement(newKey, 'in', {parking:bay, forced:true});
    saveDB(); closeSheet(); render();
    toast(`${newKey.reg} now @ ${bay} · ${current.reg} unassigned`);
  });
}

    )
  ).slice(0, 8);
  dd.style.display = 'block';
  if(!matches.length){ dd.innerHTML = '<div class="muted" style="padding:12px;text-align:center;font-size:13px">No matches</div>'; return; }
  dd.innerHTML = matches.map(k => {
    const status = k.status==='available'
      ? `<span style="background:#dcfce7;color:#0a7d2b;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700">IN @ ${k.parking||'—'}</span>`
      : `<span style="background:#fee2e2;color:#7f1d1d;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700">OUT</span>`;
    return `<div data-hq-pick="${k.id}" style="padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:13px">${k.car} <span style="font-family:ui-monospace,Menlo,monospace;color:#64748b;font-weight:600">· ${k.reg}</span></div>
        <div class="muted" style="font-size:11px">${k.dealer||''} · ${k.branch||'—'}</div>
      </div>
      ${status}
    </div>`;
  }).join('');
}

// Update only the map-plate matches text + bay highlights without re-rendering
function updateMapPlateUI(){
  const q = mapPlateQuery.toLowerCase().trim();
  const card = document.getElementById('map-plate-q')?.closest('.card');
  if(card){
    // Find the matches row inside the card and update / create
    let row = card.querySelector('.map-plate-matches');
    const branch = document.querySelector('h2')?.textContent?.replace(' Map','').trim() || '';
    const matches = (!q || q.length < 3) ? [] : db.keys.filter(k => !k.spare && k.status === 'available' && (
      (k.reg||'').toLowerCase().includes(q) || (k.car||'').toLowerCase().includes(q)
    ));
    if(!q){
      if(row) row.remove();
    } else if(q.length < 3){
      const html = `<span class="muted" style="font-size:12px">Type at least 3 characters to search…</span>`;
      if(!row){
        row = document.createElement('div');
        row.className = 'map-plate-matches';
        row.style.cssText = 'margin-top:8px;font-size:12.5px';
        card.appendChild(row);
      }
      row.innerHTML = html;
    } else {
      const html = `<b style="color:#FF3D00">${matches.length}</b> match${matches.length===1?'':'es'}${matches.length ? ' — highlighted on map: ' + matches.map(k => `<span data-hq-pick="${k.id}" style="cursor:pointer;background:#fff7ed;color:#9a3412;padding:3px 8px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-weight:800;margin-right:4px;border:1.5px solid #FF3D00">${k.reg} @ ${k.parking||'—'}</span>`).join('') : ''}`;
      if(!row){
        row = document.createElement('div');
        row.className = 'map-plate-matches';
        row.style.cssText = 'margin-top:8px;font-size:12.5px';
        card.appendChild(row);
      }
      row.innerHTML = html;
    }
  }
  // Reset all bay highlights then re-apply
  document.querySelectorAll('g.bay').forEach(g => {
    g.style.animation = '';
    const rect = g.querySelector('rect');
    if(rect){
      // Restore the bay's original stroke from data-stroke if cached, or just remove our overrides
      rect.removeAttribute('stroke-dasharray');
    }
  });
  // Re-apply highlights for current query
  applyMapPlateHighlight();
}

function renderMapPlateSearch(branch){
  const q = mapPlateQuery.toLowerCase().trim();
  const MIN_CHARS = 3;
  let matches = [];
  const enoughChars = q.length >= MIN_CHARS;
  if(enoughChars){
    matches = db.keys.filter(k => !k.spare && k.branch === branch && k.status === 'available' && (
      (k.reg||'').toLowerCase().includes(q) ||
      (k.car||'').toLowerCase().includes(q)
    ));
  }
  return `
    <div class="card pad" style="background:#fff;border:2px solid #FF3D00;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">🔍</span>
        <input id="map-plate-q" placeholder="Search plate / car on ${branch} map (min 3 chars)…" value="${mapPlateQuery}" autocomplete="off" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-weight:600">
        ${mapPlateQuery ? '<button id="map-plate-clear" class="btn-out btn" style="padding:8px 10px;font-size:12px">Clear</button>' : ''}

// Highlight matching bays on the rendered map (called after each home render)
function applyMapPlateHighlight(){
  const q = (typeof mapPlateQuery !== 'undefined' ? mapPlateQuery : '').toLowerCase().trim();
  if(!q || q.length < 3) return;
  const matchedBayIds = new Set();
  db.keys.forEach(k => {
    if(k.spare || k.status !== 'available') return;
    if((k.reg||'').toLowerCase().includes(q) || (k.car||'').toLowerCase().includes(q)){
      matchedBayIds.add(String(k.parking||'').toUpperCase());
    }
  });
  document.querySelectorAll('g.bay').forEach(g => {
    let id = String(g.dataset.emptyBay || g.dataset.disabledBay || '').toUpperCase();
    const keyId = g.dataset.id;
    if(keyId){
      const kk = db.keys.find(k=>k.id===keyId);
      id = String(kk?.parking||'').toUpperCase();
    }
    const rect = g.querySelector('rect');
    if(rect && matchedBayIds.has(id) && id){
      rect.setAttribute('stroke', '#FF3D00');
      rect.setAttribute('stroke-width', '4');
      rect.setAttribute('stroke-dasharray', '6 3');
      g.style.animation = 'mapBayPulse 1s ease-in-out infinite';
    }
  });
}

function renderMv(h){
  const live = db.keys.find(k=>k.id===h.keyId);
  const k = live || (h.snapshot ? {...h.snapshot, car:(h.snapshot.car||'(deleted)')+' (deleted)'} : {car:'(deleted)',reg:'',id:''});
  const palette = {
    in:       {tag:'IN',       bg:'#dcfce7', fg:'#166534', bar:'#16a34a'},
    out:      {tag:'OUT',      bg:'#fee2e2', fg:'#991b1b', bar:'#dc2626'},
    transfer: {tag:'TRANSFER', bg:'#dbeafe', fg:'#1e40af', bar:'#0ea5e9'},
    deleted:  {tag:'DELETED',  bg:'#374151', fg:'#f3f4f6', bar:'#111827'},
    created:  {tag:'NEW KEY',  bg:'#fff7ed', fg:'#9a3412', bar:'#FF3D00'},
  }[h.type] || {tag:h.type, bg:'#f1f5f9', fg:'#334155', bar:'#94a3b8'};

  let line;
  if(h.type==='transfer')    line = `${h.from||'?'} → ${h.to||'?'}${h.note?' · '+h.note:''}`;
  else if(h.type==='out')    line = `Purpose: ${h.purpose||'—'}`;
  else if(h.type==='in')     line = `Returned to: ${h.parking||'—'}`;
  else if(h.type==='deleted')line = `Removed${h.purpose?' · '+h.purpose:''}`;
  else if(h.type==='created')line = `Created${h.spare?' (spare)':''} · ${h.parking||'(no bay)'}`;
  else line = '';

  // Always clickable — live keys open the regular profile, deleted ones open the snapshot profile
  const targetId = live ? live.id : (h.snapshot ? h.keyId : '');
  return `<div class="mv" data-key-id="${targetId}" style="cursor:${targetId?'pointer':'default'};background:var(--card);border:1px solid var(--border);border-left:6px solid ${palette.bar};border-radius:12px;padding:12px;margin-bottom:8px">
    <div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="background:${palette.bg};color:${palette.fg};padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.6px">${palette.tag}</span>
        ${h.forced?'<span style="background:#475569;color:#fff;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.6px">FORCED</span>':''}
        <div class="car" style="font-weight:700">${k.car}</div>
      </div>
      <div class="reg" style="font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:13px">${k.reg||''}</div>
    </div>
    <div class="row2" style="display:flex;gap:12px;color:var(--muted);font-size:12.5px;margin-top:6px;flex-wrap:wrap">
      <span>${line}</span>
      <span style="margin-left:auto">${h.user||''}</span>
      <span>${fmt(h.ts)}</span>
    </div>
  </div>`;
}

function doBulkOut(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }

  openSheet(`
    <h3>Bulk Key Out · ${ids.length} key${ids.length>1?'s':''}</h3>
    <div class="muted" style="margin-bottom:10px">Pick a purpose to apply to every selected key.</div>
    <div class="filters" style="flex-wrap:wrap">
      ${db.purposes.map(p=>`<button class="chip" data-bp="${encodeURIComponent(p)}" style="${p==='Sold/Delivered'?'background:#dc2626;color:#fff;border-color:#dc2626':''}">${p==='Sold/Delivered'?'⚠ ':''}${p}</button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="field"><label>Or custom</label><input id="bp-custom" placeholder="e.g., showroom"></div>
    <button class="btn block" id="bp-go">Apply custom</button>
  `);
  const apply = (purpose)=>{
    if(purpose==='Sold/Delivered' && !confirm(`Sold/Delivered will DELETE ${ids.length} keys + their spares. Continue?`)) return;
    let removed=0, outted=0;
    ids.forEach(id=>{
      const k = db.keys.find(x=>x.id===id); if(!k) return;
      if(purpose==='Sold/Delivered'){
        const pair = db.keys.filter(x=>x.pairId && x.pairId===k.pairId);
        pair.forEach(p=>{
          db.history.unshift({ts:Date.now(), type:'deleted', keyId:p.id, user:db.user.name, purpose:'Sold/Delivered', snapshot:{...p}});
          notifyMovement(p, 'deleted', {purpose:'Sold/Delivered'});
        });
        db.keys = db.keys.filter(x => !pair.find(p=>p.id===x.id));
        removed += pair.length;
      } else {
        const forced = (k.status==='out');
        if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
        k.inSince = null; k.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose, forced});
        notifyMovement(k, 'out', {purpose, forced});
        outted++;
      }
    });
    bulkSel.clear(); saveDB(); closeSheet(); render();
    toast(purpose==='Sold/Delivered' ? `Removed ${removed}` : `Checked out ${outted}`);
  };
  $$('[data-bp]').forEach(b=>b.addEventListener('click', ()=>apply(decodeURIComponent(b.dataset.bp))));
  $('#bp-go').onclick = ()=>{ const v = $('#bp-custom').value.trim(); if(!v){ toast('Type a purpose'); return; } apply(v); };
}

function doBulkIn(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }
  if(!confirm(`Check in ${ids.length} key${ids.length>1?'s':''}? Spares go to BOX; main keys return to their last bay.`)) return;
  let done=0;
  ids.forEach(id=>{
    const k = db.keys.find(x=>x.id===id); if(!k) return;
    if(k.status==='available') return;
    const parking = k.spare ? 'BOX' : (k.parking||'BOX');
    k.status = 'available'; k.inSince = Date.now(); k.parking = parking;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking});
    notifyMovement(k, 'in', {parking});
    done++;
  });
  bulkSel.clear(); saveDB(); render(); toast(`Checked in ${done}`);
}

function doBulkTransfer(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }
  const others = db.branches.slice();
  openSheet(`
    <h3>Bulk Transfer · ${ids.length} key${ids.length>1?'s':''}</h3>
    <div class="muted" style="margin-bottom:10px;font-size:13px">Move every selected car to the chosen destination branch. Current bay is kept unless you type a new one (it'll apply to every car).</div>
    <div class="field"><label>Move to branch</label>
      <select id="bt-to">${others.map(b=>`<option>${b}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Set parking bay (optional — applies to all)</label>
      <input id="bt-bay" placeholder="leave blank to keep each car's current bay">
    </div>
    <div class="field"><label>Note (optional)</label><input id="bt-note" placeholder="e.g., rebalance stock"></div>
    <button class="btn-transfer btn block" id="bt-go" style="padding:14px;font-size:15px">Confirm bulk transfer</button>
  `);
  $('#bt-go').onclick = ()=>{
    const to   = $('#bt-to').value;
    const bay  = ($('#bt-bay').value||'').trim();
    const note = $('#bt-note').value.trim();
    let done = 0, skipped = 0;
    ids.forEach(id=>{
      const k = db.keys.find(x=>x.id===id); if(!k){ skipped++; return; }
      const from = k.branch || '?';
      if(from === to && (!bay || bay === k.parking)){ skipped++; return; }
      db.history.unshift({ts:Date.now(), type:'transfer', keyId:k.id, user:db.user.name, from, to, note});
      notifyMovement(k, 'transfer', {from, to, note});
      k.branch = to;
      if(bay) k.parking = bay;
      k.unassigned = false;
      done++;
    });
    bulkSel.clear(); bulkMode = false; saveDB(); closeSheet(); render();
    toast(`Transferred ${done}${skipped?', skipped '+skipped:''}`);
  };
}

function doBulkDelete(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }
  if(!confirm(`Delete ${ids.length} key${ids.length>1?'s':''}? Each car will be archived in history with its snapshot — you can still see them in Movement History.`)) return;
  let removed = 0;
  ids.forEach(id=>{
    const k = db.keys.find(x=>x.id===id); if(!k) return;
    db.history.unshift({ts:Date.now(), type:'deleted', keyId:k.id, user:db.user.name, snapshot:{...k}});
    notifyMovement(k, 'deleted', {purpose:'bulk delete'});
    removed++;
  });
  db.keys = db.keys.filter(x => !ids.includes(x.id));
  bulkSel.clear(); bulkMode = false; saveDB(); render();
  toast(`Deleted ${removed} key${removed===1?'':'s'}`);
}

      const lines = String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      const head = lines.shift().toLowerCase().split(',').map(s=>s.trim());
      const ix = n=>head.indexOf(n);
      const rows = lines.map(l=>{ const p=l.split(','); return {reg:p[ix('plate')], car:p[ix('car')], branch:p[ix('branch')], dealer:p[ix('dealer')]||db.user.dealer, bay:p[ix('bay')]||'', mode:(p[ix('type')]||'pair').toLowerCase()};});

function runBulkAdd(rows){
  let created = 0, skipped = 0;
  rows.forEach(row=>{
    if(!row.reg || !row.car){ skipped++; return; }
    if(row.branch && !db.branches.includes(row.branch)) db.branches.push(row.branch);
    if(row.dealer && !db.dealers.includes(row.dealer)) db.dealers.push(row.dealer);
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1+created).padStart(3,'0');
    const common = { car:row.car, reg:row.reg.toUpperCase(), dealer:row.dealer, branch:row.branch||db.user.branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };
    const toAdd = [];
    if(row.mode==='main' || row.mode==='pair'){
      toAdd.push({...common, id:baseId, serial:nextSerial(), parking:row.bay||'', spare:false});
    }
    if(row.mode==='spare' || row.mode==='pair'){
      const tmp = [...db.keys, ...toAdd];
      const max = tmp.reduce((m,k)=>{ const n=parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      toAdd.push({...common, id:baseId+'S', serial:String(max+1), parking:'BOX', spare:true});
    }
    db.keys.unshift(...toAdd); created += toAdd.length;
  });
  saveDB(); render(); toast(`Added ${created}${skipped?', skipped '+skipped:''}`);
}

// Pull just the SVG inner content out of a render function (which normally wraps in <div><svg>...</svg><zoom></div>)
function extractMapInnerSvg(renderFn){
  const html = renderFn();
  const m = html.match(/<svg[^>]*>([\s\S]*?)<\/svg>/);
  return m ? m[1] : '';
}

// ---- Bay editor helpers: delete, add label, extend canvas ----
function bayEditorDeleteAnyBay(currentId){
  const mapKey = bayEditor.key;
  if(!confirm(`Delete bay "${currentId}" from this map?\nThis hides it for everyone. You can restore via Reset demo data, or by editing localStorage.`)) return;
  if(!db.deletedBays) db.deletedBays = {};
  if(!db.deletedBays[mapKey]) db.deletedBays[mapKey] = [];
  if(!db.deletedBays[mapKey].includes(currentId)) db.deletedBays[mapKey].push(currentId);
  // Also drop from customBays if it was custom
  if(db.customBays?.[mapKey]){
    db.customBays[mapKey] = db.customBays[mapKey].filter(b => String(b.id).toUpperCase() !== String(currentId).toUpperCase());
  }
  saveDB(); render(); toast(`Deleted bay ${currentId}`);
}

function bayEditorAddLabel(){
  bayEditor.labelFormOpen = !bayEditor.labelFormOpen;
  render();
}
function bayEditorAddLabelApply(txt, sz, color){
  const mapKey = bayEditor.key;
  if(!db.mapLabels) db.mapLabels = {};
  if(!db.mapLabels[mapKey]) db.mapLabels[mapKey] = [];
  const off = db.mapLabels[mapKey].length * 14;
  db.mapLabels[mapKey].push({ text: txt.trim(), x: 30 + off, y: 30 + off, size: sz || 16, weight: 800, color: color || '#0f172a' });
  saveDB(); render(); toast(`Label added — drag on the map to position`);
}

function bayEditorUpdateLabelText(idx){
  const mapKey = bayEditor.key;
  const list = db.mapLabels?.[mapKey] || []; const L = list[idx]; if(!L) return;
  const inp = document.querySelector(`[data-label-text-input="${idx}"]`);
  const nv = (inp?.value || '').trim(); if(!nv){ toast('Label cannot be empty'); return; }
  L.text = nv; saveDB(); render(); toast('Label updated');
}

function bayEditorDeleteLabel(idx){
  const mapKey = bayEditor.key;
  const list = db.mapLabels?.[mapKey] || [];
  list.splice(idx, 1); saveDB(); render(); toast('Label deleted');
}

function bayEditorExtendCanvas(dim, by){
  const mapKey = bayEditor.key;
  if(!db.mapSize) db.mapSize = {};
  const conf = BAY_EDITOR_MAPS.find(m => m.key === mapKey) || { viewBox:'0 0 800 1100' };
  const vb = conf.viewBox.split(/\s+/).map(Number);
  const cur = db.mapSize[mapKey] || { w: vb[2], h: vb[3] };
  if(dim === 'w') cur.w = (cur.w || vb[2]) + by;
  if(dim === 'h') cur.h = (cur.h || vb[3]) + by;
  db.mapSize[mapKey] = cur; saveDB(); render();
  toast(`Canvas extended to ${cur.w}×${cur.h}`);
}

function bayEditorResetCanvas(){
  const mapKey = bayEditor.key;
  if(db.mapSize) delete db.mapSize[mapKey];
  saveDB(); render(); toast('Canvas reset to default');
}

function bayEditorToggleDelete(){
  bayEditor.deleteMode = !bayEditor.deleteMode;
  render(); toast(bayEditor.deleteMode ? 'Delete mode ON — tap a bay to delete' : 'Delete mode OFF');
}

// Quick-start: drop a grid of placeholder bays so a freshly-imported map becomes interactive immediately.
// User can then rename / delete / drag each bay.
function bayEditorAddGrid(){
  // Toggle the inline form (no prompts, no sheets — just inline DOM)
  bayEditor.gridFormOpen = !bayEditor.gridFormOpen;
  render();
}
function bayEditorAddGridApply(rows, cols, prefix, startNum){
  const mapKey = bayEditor.key;
  const conf = BAY_EDITOR_MAPS.find(m => m.key === mapKey);
  const sz = (db.mapSize||{})[mapKey];
  const vb = (sz ? [0,0,sz.w,sz.h] : (conf?.viewBox||'0 0 800 1100').split(/\s+/).map(Number));
  const W = vb[2], H = vb[3];
  // Lay out evenly across the map with a 15% margin
  const marginX = W * 0.10, marginY = H * 0.10;
  const usableW = W - marginX*2, usableH = H - marginY*2;
  const cellW = usableW / cols, cellH = usableH / rows;
  const bayW = Math.min(cellW * 0.85, 90);
  const bayH = Math.min(cellH * 0.85, 56);
  if(!db.customBays) db.customBays = {};
  if(!db.customBays[mapKey]) db.customBays[mapKey] = [];
  const existing = db.customBays[mapKey];
  let n = startNum;
  let added = 0;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const id = prefix + String(n);
      // Skip if a bay with this id already exists on this map
      if(!existing.some(b => String(b.id).toUpperCase() === id.toUpperCase())){
        const cx = marginX + cellW * c + (cellW - bayW)/2;
        const cy = marginY + cellH * r + (cellH - bayH)/2;
        existing.push({ id, x: Math.round(cx), y: Math.round(cy), w: Math.round(bayW), h: Math.round(bayH) });
        added++;
      }
      n++;
    }
  }
  saveDB(); render();
  toast(`Added ${added} bays in a ${rows}×${cols} grid. Drag each to fine-tune.`);
}

// ---- Create + drag + save handlers ----
function bayEditorCreate(){
  const id = (document.getElementById('be-id')?.value || '').trim();
  if(!id){ toast('Type a bay ID first'); return; }
  const w = parseInt(document.getElementById('be-w')?.value,10) || 50;
  const h = parseInt(document.getElementById('be-h')?.value,10) || 56;
  // Default position: a small offset from the top-left + step by 8px per stacked draft so they don't overlap
  const off = (bayEditor.draft || []).length * 8;
  bayEditor.draft = bayEditor.draft || [];
  bayEditor.draft.push({ id, x: 20 + off, y: 20 + off, w, h });
  bayEditor.newId = '';
  // Clear the input directly so user keeps focus + can type next ID, no re-render needed
  const inp = document.getElementById('be-id'); if(inp){ inp.value = ''; inp.focus(); }
  render();
  toast(`Created ${id} — drag it on the map to position`);
}

// Rename ANY bay (built-in or custom) — used by tap-on-map in editor mode.
// Upload a JPEG/PNG to create a NEW branch with that image as its map background
function bayEditorImportBranchImage(file){
  if(!file){ toast('No file selected'); return; }
  if(!/^image\//.test(file.type) && !/\.(jpe?g|png)$/i.test(file.name)){
    toast('Pick a JPG or PNG image'); return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const img = new Image();
    img.onload = () => {
      // Are we currently on a "blank branch" map? If so, attach image to THAT branch instead of asking for a new name.
      const curConf = BAY_EDITOR_MAPS.find(m => m.key === bayEditor.key);
      let branch, label, mapKey;
      if(curConf && curConf.isBlank && curConf.branch){
        branch = curConf.branch;
        label  = branch + ' Map';
        mapKey = branch.trim().replace(/[^A-Za-z0-9_-]/g,'-');
        if(!confirm(`Set this image as the map for branch "${branch}"?`)) return;
      } else {
        const b = prompt('Branch name (e.g., Setapak):'); if(!b || !b.trim()){ toast('Cancelled'); return; }
        branch = b.trim();
        const labelInput = prompt('Map display name (e.g., "Setapak · Ground"):', branch + ' Map');
        label = (labelInput||branch).trim();
        mapKey = branch.replace(/[^A-Za-z0-9_-]/g,'-');
      }
      if(db.customMaps?.[mapKey]){
        if(!confirm(`Map for "${branch}" already exists. Replace background image?`)) return;
      }
      // Cap the long side to 1200 px to keep localStorage small
      const MAX = 1200;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > MAX || h > MAX){
        const s = MAX / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s);
      }
      // Re-encode at quality 0.78 to compress
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.78);
      // Persist
      if(!db.customMaps) db.customMaps = {};
      db.customMaps[mapKey] = { branch: branch.trim(), label, bg: compressed, viewBox: `0 0 ${w} ${h}` };
      if(!db.branches.includes(branch.trim())) db.branches.push(branch.trim());
      if(!db.customBays)  db.customBays = {}; db.customBays[mapKey]  = db.customBays[mapKey]  || [];
      if(!db.bayRenames)  db.bayRenames = {}; db.bayRenames[mapKey]  = db.bayRenames[mapKey]  || {};
      if(!db.bayMoves)    db.bayMoves   = {}; db.bayMoves[mapKey]    = db.bayMoves[mapKey]    || {};
      if(!db.deletedBays) db.deletedBays= {}; db.deletedBays[mapKey] = db.deletedBays[mapKey] || [];
      if(!db.mapLabels)   db.mapLabels  = {}; db.mapLabels[mapKey]   = db.mapLabels[mapKey]   || [];
      saveDB();
      bayEditor.key = mapKey;
      // Rebuild the editor map list (removes the "blank" entry for this branch if present, adds the proper one)
      rebuildBayEditorMaps();
      render();
      toast(`Map for "${branch}" set. Tap "🔢 Add bay grid" to place bays in one go.`);
      // Offer to drop a grid immediately so the new map is interactive
      setTimeout(()=>{
        if(confirm('Add a quick grid of bays on top of the new map?\n(Tap Cancel to add bays manually with + Create bay.)')){
          bayEditorAddGrid();
        }
      }, 600);
    };
    img.onerror = () => toast('Could not read that image');
    img.src = dataUrl;
  };
  reader.onerror = () => toast('Could not read file');
  reader.readAsDataURL(file);
}

// Render a custom-image-backed map for end-user views (Home / branch map)
function renderCustomMap(mapKey){
  const cm = db.customMaps?.[mapKey]; if(!cm) return '<div class="empty">Map missing</div>';
  const vb = cm.viewBox || '0 0 800 1100';
  const vbN = vb.split(/\s+/).map(Number);
  const labels = (db.mapLabels?.[mapKey]) || [];
  const labelSvg = labels.map(L => `<text x="${L.x}" y="${L.y}" font-family="Arial,system-ui" font-size="${L.size||16}" font-weight="${L.weight||800}" fill="${L.color||'#0f172a'}" pointer-events="none">${L.text}</text>`).join('');
  // Custom-map bays come from customBays[mapKey] (no built-ins). Render using same tile schema.
  const bays = applyBayRenames([...(db.customBays?.[mapKey]||[])], mapKey);
  const tiles = bays.map(b=>{
    const k = bayCurrentKey(b.id, cm.branch);
    const disabled = isBayDisabled(b.id, cm.branch);
    let fill = 'rgba(220,252,231,0.55)', stroke = '#16a34a', textColor = '#0a7d2b';
    if(k){ fill = 'rgba(219,234,254,0.85)'; stroke = '#1d4ed8'; textColor = '#1e3a8a'; }
    if(disabled){ fill = 'rgba(254,202,202,0.85)'; stroke = '#b91c1c'; textColor = '#7f1d1d'; }
    const onClick = disabled
      ? `data-disabled-bay="${b.id}" data-branch="${cm.branch}"`
      : (k ? `data-id="${k.id}"` : `data-empty-bay="${b.id}" data-branch="${cm.branch}"`);
    const cx = b.x + b.w/2;
    const idSize = Math.max(9, Math.min(b.h * (k ? 0.32 : 0.40), 13));
    const plateSize = Math.max(7, Math.min(b.h*0.30, 11));
    return `
      <g class="bay" ${onClick} style="cursor:pointer">
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
        <text x="${cx}" y="${b.y + ((k && !disabled) ? b.h*0.36 : b.h/2 + 4)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="${idSize}" font-weight="800" fill="${textColor}" pointer-events="none">${b.id}</text>
        ${(k && !disabled) ? `<text x="${cx}" y="${b.y + b.h*0.78}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="${plateSize}" font-weight="900" fill="${textColor}" pointer-events="none">${k.reg}</text>` : ''}
      </g>`;
  }).join('');
  return `
    <div class="map-zoom-wrap" style="position:relative;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:75vh">
      <svg viewBox="${vb}" width="${100*(typeof mapZoom!=='undefined'?mapZoom:1)}%" height="auto" style="display:block;background:#fff;border:1px solid var(--border);border-radius:10px">
        <image href="${cm.bg}" x="0" y="0" width="${vbN[2]}" height="${vbN[3]}" preserveAspectRatio="xMidYMid meet"/>
        ${labelSvg}
        ${tiles}
      </svg>
      <div class="map-zoom-ctrl" style="position:sticky;float:right;right:8px;bottom:8px;display:inline-flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.7);padding:4px;border-radius:10px;z-index:5">
        <button class="icon-btn" data-zoom="in"  style="width:34px;height:34px;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;font-weight:900;font-size:18px">＋</button>
        <button class="icon-btn" data-zoom="reset" style="width:34px;height:34px;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;font-size:14px">⟲</button>
        <button class="icon-btn" data-zoom="out" style="width:34px;height:34px;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;font-weight:900;font-size:20px">−</button>
      </div>
    </div>
  `;
}

// Rebuild BAY_EDITOR_MAPS to include any custom maps + all branches the user added
function rebuildBayEditorMaps(){
  // Hard-reset to the three built-ins, then re-add the dynamic entries below
  BAY_EDITOR_MAPS.length = 0;
  BAY_EDITOR_MAPS.push(
    { key:'Cheras',    label:'Cheras Map',         render: ()=>renderCherasMap(),    viewBox:'0 0 800 1100' },
    { key:'Kuchai-G',  label:'Kuchai · G Floor',   render: ()=>renderKuchaiGMap(),   viewBox:'0 0 720 700' },
    { key:'Kuchai-B2', label:'Kuchai · B2',        render: ()=>renderKuchaiB2Map(),  viewBox:'0 0 1500 560' }
  );
  const seenKeys = new Set(['Cheras','Kuchai-G','Kuchai-B2']);
  // 1) Custom maps (uploaded image background)
  for(const k in (db.customMaps||{})){
    const cm = db.customMaps[k]; if(!cm) continue;
    BAY_EDITOR_MAPS.push({
      key: k, label: cm.label || k, viewBox: cm.viewBox || '0 0 800 1100',
      render: ()=>renderCustomMap(k)
    });
    seenKeys.add(k);
  }
  // 2) Branches that exist but don't yet have a map — give them a blank canvas
  // Skip the two built-in branches (Cheras, Kuchai) since their maps are already covered.
  (db.branches||[]).forEach(b => {
    if(b === 'Cheras' || b === 'Kuchai') return;
    // Compose a stable map key from the branch name
    const k = 'br-' + b.replace(/[^A-Za-z0-9_-]/g,'-');
    if(seenKeys.has(k)) return;
    // Is there already a customMap entry covering this branch?
    const hasCm = Object.values(db.customMaps||{}).some(cm => cm.branch === b);
    if(hasCm) return;
    // Ensure store keys exist for this map
    if(!db.customBays)  db.customBays  = {}; db.customBays[k]  = db.customBays[k]  || [];
    if(!db.bayRenames)  db.bayRenames  = {}; db.bayRenames[k]  = db.bayRenames[k]  || {};
    if(!db.bayMoves)    db.bayMoves    = {}; db.bayMoves[k]    = db.bayMoves[k]    || {};
    if(!db.deletedBays) db.deletedBays = {}; db.deletedBays[k] = db.deletedBays[k] || [];
    if(!db.mapLabels)   db.mapLabels   = {}; db.mapLabels[k]   = db.mapLabels[k]   || [];
    BAY_EDITOR_MAPS.push({
      key: k, label: b + ' (blank — add bays / set image)', viewBox: '0 0 800 1100',
      render: ()=>renderBlankBranchMap(k, b),
      isBlank: true, branch: b
    });
    seenKeys.add(k);
  });
}

// Render a branch that has no uploaded image yet — blank grid + bays + labels.
function renderBlankBranchMap(mapKey, branch){
  const vb = ((db.mapSize||{})[mapKey]) ? `0 0 ${db.mapSize[mapKey].w} ${db.mapSize[mapKey].h}` : '0 0 800 1100';
  const vbN = vb.split(/\s+/).map(Number);
  const labels = (db.mapLabels?.[mapKey]) || [];
  const labelSvg = labels.map(L => `<text x="${L.x}" y="${L.y}" font-family="Arial,system-ui" font-size="${L.size||16}" font-weight="${L.weight||800}" fill="${L.color||'#0f172a'}" pointer-events="none">${L.text}</text>`).join('');
  const bays = applyBayRenames([...(db.customBays?.[mapKey]||[])], mapKey);
  const tiles = bays.map(b=>{
    const k = bayCurrentKey(b.id, branch);
    const disabled = isBayDisabled(b.id, branch);
    let fill = '#dcfce7', stroke = '#16a34a', textColor = '#0a7d2b';
    if(k){ fill = '#dbeafe'; stroke = '#1d4ed8'; textColor = '#1e3a8a'; }
    if(disabled){ fill = '#fecaca'; stroke = '#b91c1c'; textColor = '#7f1d1d'; }
    const onClick = disabled
      ? `data-disabled-bay="${b.id}" data-branch="${branch}"`
      : (k ? `data-id="${k.id}"` : `data-empty-bay="${b.id}" data-branch="${branch}"`);
    const cx = b.x + b.w/2;
    return `
      <g class="bay" ${onClick} style="cursor:pointer">
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
        <text x="${cx}" y="${b.y + b.h/2 + 4}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="800" fill="${textColor}" pointer-events="none">${b.id}</text>
        ${(k && !disabled) ? `<text x="${cx}" y="${b.y + b.h*0.78}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="900" fill="${textColor}" pointer-events="none">${k.reg}</text>` : ''}
      </g>`;
  }).join('');
  // Light grid for orientation
  const gridLines = [];
  const STEP = 100;
  for(let x=0; x<=vbN[2]; x+=STEP) gridLines.push(`<line x1="${x}" y1="0" x2="${x}" y2="${vbN[3]}" stroke="#e2e8f0" stroke-width="0.5"/>`);
  for(let y=0; y<=vbN[3]; y+=STEP) gridLines.push(`<line x1="0" y1="${y}" x2="${vbN[2]}" y2="${y}" stroke="#e2e8f0" stroke-width="0.5"/>`);
  // Placeholder watermark
  const wm = `<text x="${vbN[2]/2}" y="${vbN[3]/2}" text-anchor="middle" font-family="Arial,system-ui" font-size="20" fill="#cbd5e1" pointer-events="none">${branch} — tap Set Map Image to upload a floor plan</text>`;
  return `
    <div class="map-zoom-wrap" style="position:relative;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:75vh">
      <svg viewBox="${vb}" width="${100*(typeof mapZoom!=='undefined'?mapZoom:1)}%" height="auto" style="display:block;background:#fff;border:1px solid var(--border);border-radius:10px">
        ${gridLines.join('')}
        ${wm}
        ${labelSvg}
        ${tiles}
      </svg>
    </div>
  `;
}
