function bayEditorRenameAnyBay(currentId){
  const mapKey = bayEditor.key;
  const branch = (mapKey === 'Cheras') ? 'Cheras' : 'Kuchai';
  // Detect if this id is a custom bay
  const customList = db.customBays?.[mapKey] || [];
  const customIdx  = customList.findIndex(b => String(b.id).toUpperCase() === String(currentId).toUpperCase());
  // Or a renamed built-in (find the original key in bayRenames where current value === currentId)
  const renMap = db.bayRenames?.[mapKey] || {};
  const renOrigKey = Object.keys(renMap).find(orig => String(renMap[orig]).toUpperCase() === String(currentId).toUpperCase());
  // Or a never-renamed built-in (will become the original key for the rename entry)
  const newName = prompt(`Rename bay "${currentId}" to:`, currentId);
  if(newName === null) return;
  const trimmed = newName.trim();
  if(!trimmed){ toast('Name cannot be empty'); return; }
  if(trimmed.toUpperCase() === currentId.toUpperCase()){ return; }
  // Collision check against everything on this map
  const allBays = (mapKey==='Cheras'?CHERAS_BAYS():mapKey==='Kuchai-G'?KUCHAI_G_BAYS():KUCHAI_B2_BAYS());
  if(allBays.some(b => String(b.id).toUpperCase() === trimmed.toUpperCase())){
    toast(`A bay named "${trimmed}" already exists on this map`); return;
  }
  // Persist depending on what kind of bay it was
  if(customIdx >= 0){
    customList[customIdx].id = trimmed;
  } else if(renOrigKey){
    // Already renamed once — update the rename mapping
    db.bayRenames[mapKey][renOrigKey] = trimmed;
  } else {
    // Brand-new rename of a built-in — currentId IS the original layout id
    if(!db.bayRenames) db.bayRenames = {};
    if(!db.bayRenames[mapKey]) db.bayRenames[mapKey] = {};
    db.bayRenames[mapKey][currentId] = trimmed;
  }
  // Migrate cars currently parked at the old name → new name
  let migrated = 0;
  db.keys.forEach(k => {
    if(k.branch === branch && String(k.parking||'').toUpperCase() === String(currentId).toUpperCase()){
      k.parking = trimmed; migrated++;
    }
  });
  // Migrate the disabled list too
  if(db.disabledBays?.[branch]){
    const i2 = db.disabledBays[branch].findIndex(s => String(s).toUpperCase() === String(currentId).toUpperCase());
    if(i2 >= 0) db.disabledBays[branch][i2] = trimmed;
  }
  saveDB(); render();
  toast(`Renamed ${currentId} → ${trimmed}${migrated?` (moved ${migrated} car${migrated===1?'':'s'})`:''}`);
}



// ---- Row-based bay list editing (works without tap-on-map) ----
function bayEditorRowSave(origId){
  const mapKey = bayEditor.key;
  const branch = (mapKey === 'Cheras') ? 'Cheras'
              : (mapKey === 'Kuchai-G' || mapKey === 'Kuchai-B2') ? 'Kuchai'
              : (BAY_EDITOR_MAPS.find(m => m.key === mapKey)?.branch || (db.customMaps?.[mapKey]?.branch) || mapKey.replace(/^br-/,''));
  const getField = (field) => {
    const el = document.querySelector(`[data-row-id="${origId}"][data-row-field="${field}"]`);
    return el ? el.value : null;
  };
  const newId = (getField('id') || '').trim();
  const nx = parseInt(getField('x'), 10);
  const ny = parseInt(getField('y'), 10);
  const nw = parseInt(getField('w'), 10);
  const nh = parseInt(getField('h'), 10);
  if(!newId){ toast('Name cannot be empty'); return; }
  if(!isFinite(nx) || !isFinite(ny) || !isFinite(nw) || !isFinite(nh)){
    toast('Position/size must be numbers'); return;
  }
  const all = mapKey==='Cheras' ? CHERAS_BAYS()
            : mapKey==='Kuchai-G' ? KUCHAI_G_BAYS()
            : mapKey==='Kuchai-B2' ? KUCHAI_B2_BAYS()
            : applyBayRenames([...(db.customBays?.[mapKey]||[])], mapKey);
  const target = all.find(b => (b._origId||b.id) === origId);
  if(!target){ toast(`Bay ${origId} not found`); return; }
  const oldId = target.id;
  const customList = (db.customBays?.[mapKey] || []);
  const customBay = customList.find(b => String(b.id).toUpperCase() === String(oldId).toUpperCase());
  const isCustom = !!customBay;
  if(newId.toUpperCase() !== oldId.toUpperCase()){
    const conflict = all.find(b => b !== target && String(b.id).toUpperCase() === newId.toUpperCase());
    if(conflict){ toast(`A bay named "${newId}" already exists`); return; }
  }
  if(isCustom){
    customBay.id = newId;
    customBay.x = nx; customBay.y = ny; customBay.w = nw; customBay.h = nh;
  } else {
    if(newId !== oldId){
      if(!db.bayRenames) db.bayRenames = {};
      if(!db.bayRenames[mapKey]) db.bayRenames[mapKey] = {};
      db.bayRenames[mapKey][origId] = newId;
    }
    if(!db.bayMoves) db.bayMoves = {};
    if(!db.bayMoves[mapKey]) db.bayMoves[mapKey] = {};
    db.bayMoves[mapKey][origId] = { x: nx, y: ny, w: nw, h: nh };
  }
  let migrated = 0;
  if(newId !== oldId){
    db.keys.forEach(k => {
      if(k.branch === branch && String(k.parking||'').toUpperCase() === String(oldId).toUpperCase()){
        k.parking = newId; migrated++;
      }
    });
    if(db.disabledBays?.[branch]){
      const i2 = db.disabledBays[branch].findIndex(s => String(s).toUpperCase() === String(oldId).toUpperCase());
      if(i2 >= 0) db.disabledBays[branch][i2] = newId;
    }
  }
  saveDB(); render();
  toast(`Saved ${newId}${migrated ? ` (${migrated} car${migrated===1?'':'s'} moved)` : ''}`);
}

function bayEditorRowDelete(origId){
  const mapKey = bayEditor.key;
  const all = mapKey==='Cheras' ? CHERAS_BAYS()
            : mapKey==='Kuchai-G' ? KUCHAI_G_BAYS()
            : mapKey==='Kuchai-B2' ? KUCHAI_B2_BAYS()
            : applyBayRenames([...(db.customBays?.[mapKey]||[])], mapKey);
  const target = all.find(b => (b._origId||b.id) === origId);
  if(!target){ return; }
  if(!confirm(`Delete bay "${target.id}"?`)) return;
  if(!db.deletedBays) db.deletedBays = {};
  if(!db.deletedBays[mapKey]) db.deletedBays[mapKey] = [];
  if(!db.deletedBays[mapKey].includes(target.id)) db.deletedBays[mapKey].push(target.id);
  if(db.customBays?.[mapKey]){
    db.customBays[mapKey] = db.customBays[mapKey].filter(b => String(b.id).toUpperCase() !== String(target.id).toUpperCase());
  }
  saveDB(); render();
  toast(`Deleted ${target.id}`);
}

  }
  // Detect if this is a custom bay vs a built-in
  const customList = (db.customBays?.[mapKey] || []);
  const customIdx = customList.findIndex(b => String(b.id).toUpperCase() === String(sel.id).toUpperCase());
  const isCustom = customIdx >= 0;
  const branch = (mapKey === 'Cheras') ? 'Cheras' : (mapKey === 'Kuchai-G' || mapKey === 'Kuchai-B2') ? 'Kuchai' :
                  (BAY_EDITOR_MAPS.find(m => m.key === mapKey)?.branch
                   || (db.customMaps?.[mapKey]?.branch)
                   || mapKey.replace(/^br-/, ''));
  // Name collision check (against everything else on this map)
  if(newId.toUpperCase() !== sel.id.toUpperCase()){
    const conflict = (mapKey==='Cheras' ? CHERAS_BAYS()
                   : mapKey==='Kuchai-G' ? KUCHAI_G_BAYS()
                   : mapKey==='Kuchai-B2' ? KUCHAI_B2_BAYS()
                   : applyBayRenames([...(db.customBays?.[mapKey]||[])], mapKey)
                   ).find(b => String(b.id).toUpperCase() === newId.toUpperCase());
    if(conflict){ toast(`A bay named "${newId}" already exists on this map`); return; }
  }
  // Persist rename + move
  if(isCustom){
    customList[customIdx].id = newId;
    customList[customIdx].x  = nx;
    customList[customIdx].y  = ny;
    customList[customIdx].w  = nw;
    customList[customIdx].h  = nh;

    if(!db.bayMoves[mapKey]) db.bayMoves[mapKey] = {};
    db.bayMoves[mapKey][sel.origId] = { x: nx, y: ny, w: nw, h: nh };
  }

      if(k.branch === branch && String(k.parking||'').toUpperCase() === String(sel.id).toUpperCase()){

    if(db.disabledBays?.[branch]){

      if(i2 >= 0) db.disabledBays[branch][i2] = newId;
    }

}

function bayEditorRename(idx){
  const list = db.customBays?.[bayEditor.key]; if(!list || !list[idx]) return;
  const inp = document.querySelector(`[data-be-rename-input="${idx}"]`);
  const newName = (inp?.value || '').trim();
  if(!newName){ toast('Bay name cannot be empty'); return; }
  const oldName = list[idx].id;
  if(newName === oldName){ toast('Same name — no change'); return; }
  // Check uniqueness against other custom bays on this map
  if(list.some((b,i) => i!==idx && String(b.id).toUpperCase() === newName.toUpperCase())){
    toast(`A bay named "${newName}" already exists on this map`); return;
  }
  // Migrate any car currently parked at the old bay name → new name (so the car stays linked)
  const branch = (bayEditor.key === 'Cheras') ? 'Cheras' : 'Kuchai';
  let migrated = 0;
  db.keys.forEach(k => {
    if(k.branch === branch && String(k.parking||'').toUpperCase() === String(oldName).toUpperCase()){
      k.parking = newName; migrated++;
    }
  });
  // Migrate disabled state if the old name was on the disabled list
  if(db.disabledBays?.[branch]){
    const idx2 = db.disabledBays[branch].findIndex(s => String(s).toUpperCase() === String(oldName).toUpperCase());
    if(idx2 >= 0) db.disabledBays[branch][idx2] = newName;
  }
  list[idx].id = newName;
  saveDB(); render();
  toast(`Renamed ${oldName} → ${newName}${migrated?` (moved ${migrated} car${migrated===1?'':'s'})`:''}`);
}

// ---- Export A4 PDF — jsPDF direct download with iframe-print fallback ----
async function exportMapToPdf(mapKey){
  const conf = BAY_EDITOR_MAPS.find(m => m.key === mapKey);
  if(!conf){ toast('Unknown map'); return; }

  // Wait up to 2 seconds for jsPDF to load (the CDN might still be fetching it)
  let JP = null;
  for(let i=0; i<10; i++){
    const ns = window.jspdf || {};
    JP = ns.jsPDF || window.jsPDF;
    if(JP) break;
    await new Promise(r => setTimeout(r, 200));
  }

  if(!JP){
    // jsPDF isn't going to load — fall back to iframe-based print (no popup blocker, no external dependency)
    toast('PDF library unreachable — opening print dialog instead');
    return exportMapViaIframePrint(mapKey);
  }

  toast('Generating PDF…');
  const vb = (conf.viewBox||'0 0 800 1100').split(/\s+/).map(Number);
  const vbW = vb[2], vbH = vb[3];
  const isLandscape = vbW / vbH > 1.2;

  let inner = extractMapInnerSvg(conf.render);
  inner = inner.replace(/<text[^>]*font-family="ui-monospace,Menlo,monospace"[^>]*font-weight="900"[^>]*>[^<]*<\/text>/g, '');
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${conf.viewBox}" width="${vbW}" height="${vbH}">${inner}</svg>`;

  const SCALE = 3;
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(vbW * SCALE);
  canvas.height = Math.round(vbH * SCALE);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  try{
    await new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload  = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); resolve(); };
      img.onerror = () => reject(new Error('SVG rasterize failed'));
      img.src = url;
    });
  } catch(err){
    URL.revokeObjectURL(url);
    console.error(err);
    toast('jsPDF rasterize failed — falling back to print');
    return exportMapViaIframePrint(mapKey);
  }
  URL.revokeObjectURL(url);
  const pngDataUrl = canvas.toDataURL('image/png');

  const pdf = new JP({ orientation: isLandscape?'landscape':'portrait', unit:'mm', format:'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 10, headerH = 16, footerH = 8;
  const usableW = pageW - margin*2, usableH = pageH - margin*2 - headerH - footerH;
  const fit = Math.min(usableW / vbW, usableH / vbH);
  const mapW = vbW * fit, mapH = vbH * fit;
  const mapX = (pageW - mapW) / 2, mapY = margin + headerH;

  pdf.setFont('helvetica','bold'); pdf.setFontSize(15);
  pdf.text(`CARNET KeyOS — ${conf.label}`, margin, margin + 7);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(90);
  pdf.text(`Exported: ${new Date().toLocaleString()}  ·  by ${(db.user&&db.user.name)||'-'}`, margin, margin + 13);
  pdf.setTextColor(0);
  pdf.setDrawColor(220); pdf.setLineWidth(0.2);
  pdf.rect(mapX-1, mapY-1, mapW+2, mapH+2);
  pdf.addImage(pngDataUrl, 'PNG', mapX, mapY, mapW, mapH, undefined, 'FAST');
  pdf.setFontSize(8); pdf.setTextColor(120);
  pdf.text('CARNET Key Management', margin, pageH - margin/2);
  pdf.text(`Page 1 / 1`, pageW - margin - 16, pageH - margin/2);

// Drag handler for any movable thing in the editor: drafts, saved customs, built-in bays, labels
let beDrag = null;
let beDragMoved = false;  // set true on first pointermove so we can suppress the post-drag click
let beStartCX = 0, beStartCY = 0;  // pointerdown client coords — used to measure drag travel
let beLastTapAt = 0, beLastTapId = '';  // for detecting double-tap to rename
function beStartDrag(e){
  beDragMoved = false;
  const draftG  = e.target.closest('.be-draft');
  const savedG  = e.target.closest('.be-saved');
  const builtG  = e.target.closest('.be-built');
  const labelG  = e.target.closest('.be-label');
  const target = draftG || savedG || builtG || labelG; if(!target) return;
  const svg = document.getElementById('be-svg'); if(!svg) return;
  // Note: we don't preventDefault yet — a quick tap should still trigger the click
  // for tap-to-rename. We'll preventDefault once movement passes the threshold.
  // e.preventDefault();
  // Record start position so we can measure travel before treating as drag
  beStartCX = e.clientX; beStartCY = e.clientY;

  let kind, idx, bay, origId, w, h;
  if(draftG){
    kind = 'draft'; idx = +draftG.dataset.draftIdx;
    bay = bayEditor.draft[idx]; if(!bay) return;
    w = bay.w; h = bay.h;
  } else if(savedG){
    kind = 'saved'; idx = +savedG.dataset.savedIdx;
    bay = (db.customBays?.[bayEditor.key] || [])[idx]; if(!bay) return;
    w = bay.w; h = bay.h;
  } else if(builtG){
    origId = builtG.dataset.builtOrig;
    const mapKey = bayEditor.key;
    // First try the custom bays array (covers grid-generated bays on any branch, custom uploads, and saved customs)
    const customList = (db.customBays?.[mapKey] || []);
    const cb = customList.find(b => String(b.id).toUpperCase() === String(origId).toUpperCase());
    if(cb){
      kind = 'custom-built';
      bay = cb;
    } else {
      // Built-in (Cheras / Kuchai-G / Kuchai-B2) — position overrides go to bayMoves
      kind = 'built';
      const all = mapKey==='Cheras' ? CHERAS_BAYS()
                : mapKey==='Kuchai-G' ? KUCHAI_G_BAYS()
                : mapKey==='Kuchai-B2' ? KUCHAI_B2_BAYS() : [];
      bay = all.find(b => (b._origId||b.id) === origId);
      if(!bay) return;
    }
    w = bay.w; h = bay.h;
  } else if(labelG){
    kind = 'label'; idx = +labelG.dataset.labelIdx;
    const L = (db.mapLabels?.[bayEditor.key] || [])[idx]; if(!L) return;
    bay = { x: L.x, y: L.y, w: 0, h: 0 };
    w = 0; h = 0;
  }
  const ctm = svg.getScreenCTM();
  const toSvg = (cx, cy)=>{
    const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
    return pt.matrixTransform(ctm.inverse());
  };
  const start = toSvg(e.clientX, e.clientY);
  beDrag = { kind, idx, origId, dx: start.x - bay.x, dy: start.y - bay.y, w, h };
  try { target.setPointerCapture(e.pointerId); } catch(_){}
  target.style.cursor = 'grabbing';
}
function beMoveDrag(e){
  if(!beDrag) return;
  // Tap threshold — ignore tiny finger jitter so a clean tap still rename-prompts
  if(!beDragMoved){
    const ddx = e.clientX - beStartCX;
    const ddy = e.clientY - beStartCY;
    if(Math.sqrt(ddx*ddx + ddy*ddy) < 6) return;
    beDragMoved = true;
    e.preventDefault(); // now it's a real drag, suppress text selection / scroll
  }
  const svg = document.getElementById('be-svg'); if(!svg) return;
  const ctm = svg.getScreenCTM(); if(!ctm) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const local = pt.matrixTransform(ctm.inverse());
  const nx = Math.round(local.x - beDrag.dx);
  const ny = Math.round(local.y - beDrag.dy);
  if(beDrag.kind === 'draft'){
    const b = bayEditor.draft[beDrag.idx]; if(!b) return;
    b.x = nx; b.y = ny;
    const g = document.querySelector(`[data-draft-idx="${beDrag.idx}"]`);
    if(g){
      const rect = g.querySelector('rect'); if(rect){ rect.setAttribute('x', nx); rect.setAttribute('y', ny); }
      const text = g.querySelector('text'); if(text){ text.setAttribute('x', nx + beDrag.w/2); text.setAttribute('y', ny + beDrag.h/2 + 4); }
    }
  } else if(beDrag.kind === 'saved'){
    const b = (db.customBays?.[bayEditor.key] || [])[beDrag.idx]; if(!b) return;
    b.x = nx; b.y = ny;
    const g = document.querySelector(`[data-saved-idx="${beDrag.idx}"]`);
    if(g){ const rect = g.querySelector('rect'); if(rect){ rect.setAttribute('x', nx); rect.setAttribute('y', ny); } }
  } else if(beDrag.kind === 'built'){
    // Move a built-in bay → write to bayMoves keyed by original id
    if(!db.bayMoves) db.bayMoves = {};
    if(!db.bayMoves[bayEditor.key]) db.bayMoves[bayEditor.key] = {};
    db.bayMoves[bayEditor.key][beDrag.origId] = { x: nx, y: ny, w: beDrag.w, h: beDrag.h };
    const g = document.querySelector(`[data-built-orig="${beDrag.origId}"]`);
    if(g){ const rect = g.querySelector('rect'); if(rect){ rect.setAttribute('x', nx); rect.setAttribute('y', ny); } }
  } else if(beDrag.kind === 'custom-built'){
    // Move a custom bay (grid bays on a new branch) → mutate db.customBays directly
    const list = db.customBays?.[bayEditor.key] || [];
    const b = list.find(x => String(x.id).toUpperCase() === String(beDrag.origId).toUpperCase());
    if(!b) return;
    b.x = nx; b.y = ny;
    const g = document.querySelector(`[data-built-orig="${beDrag.origId}"]`);
    if(g){ const rect = g.querySelector('rect'); if(rect){ rect.setAttribute('x', nx); rect.setAttribute('y', ny); } }
  } else if(beDrag.kind === 'label'){
    const list = db.mapLabels?.[bayEditor.key] || [];
    const L = list[beDrag.idx]; if(!L) return;
    L.x = nx; L.y = ny;
    const g = document.querySelector(`[data-label-idx="${beDrag.idx}"]`);
    if(g){ const t = g.querySelector('text'); if(t){ t.setAttribute('x', nx); t.setAttribute('y', ny); } }
  }
}
function beEndDrag(e){
  if(!beDrag) return;
  const kind = beDrag.kind;
  beDrag = null;
  // Drafts persist via Save button. Everything else writes immediately.
  if(kind !== 'draft') saveDB();
  render();
}

// Place a new bay where the admin tapped the SVG
function bayEditorTap(e){
  const svg = document.getElementById('be-svg'); if(!svg) return;
  const id = (document.getElementById('be-id')?.value || '').trim();
  if(!id){ toast('Type a bay ID first (e.g. B2-157)'); return; }
  const w = parseInt(document.getElementById('be-w').value,10) || 50;
  const h = parseInt(document.getElementById('be-h').value,10) || 56;

  // Convert client click coords to SVG coords (handles zoom + scroll)
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM(); if(!ctm){ toast('Map not ready — try again'); return; }
  const local = pt.matrixTransform(ctm.inverse());

  // Push into draft buffer — Save commits to db. Don't auto-save.
  bayEditor.draft = bayEditor.draft || [];
  bayEditor.draft.push({ id, x: Math.round(local.x - w/2), y: Math.round(local.y - h/2), w, h });
  render();
  toast(`Drafted ${id} — tap Save to commit`);
}

function bayEditorSave(){
  const drafts = bayEditor.draft || [];
  if(!drafts.length){ toast('No drafts to save'); return; }
  if(!db.customBays) db.customBays = {};
  if(!db.customBays[bayEditor.key]) db.customBays[bayEditor.key] = [];
  // Warn about duplicate IDs (built-in or already-saved custom)
  const allBays = bayEditor.key==='Cheras' ? CHERAS_BAYS() : bayEditor.key==='Kuchai-G' ? KUCHAI_G_BAYS() : KUCHAI_B2_BAYS();
  const dupes = drafts.filter(b => allBays.some(x => x.id === b.id)).map(b => b.id);
  if(dupes.length){
    if(!confirm(`Bay ID${dupes.length>1?'s':''} ${dupes.join(', ')} already exist on this map. Save anyway?`)) return;
  }
  db.customBays[bayEditor.key].push(...drafts);
  bayEditor.draft = []; bayEditor.newId = '';
  saveDB(); render();
  toast(`Saved ${drafts.length} bay${drafts.length>1?'s':''} to ${bayEditor.key}`);
}

function bayEditorDiscard(){
  const n = (bayEditor.draft || []).length;
  if(!n) return;
  if(!confirm(`Discard ${n} unsaved bay${n>1?'s':''}?`)) return;
  bayEditor.draft = []; render(); toast('Drafts discarded');
}

function openManageBranches(){
  if(!isAdmin()){ toast('Admin only'); return; }
  openSheet(`
    <h3>Manage branches</h3>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Edits sync to the bay editor + Add Key form. Cars assigned to a deleted branch become unassigned (the cars themselves are not deleted).</div>
    ${db.branches.map((b,i)=>{
      const used = db.keys.filter(k=>k.branch===b).length;
      return `
      <div class="key-card" style="margin-bottom:6px;display:flex;align-items:center;gap:10px">
        <div style="flex:1">
          <div style="font-weight:800">🏢 ${b}</div>
          <div class="muted" style="font-size:11px">${used} key${used===1?'':'s'} assigned · key "${b.replace(/[^A-Za-z0-9_-]/g,'-')}" or "br-${b.replace(/[^A-Za-z0-9_-]/g,'-')}" in editor</div>
        </div>
        <button class="btn-out btn" data-del-b="${i}" style="padding:8px 12px;font-size:13px;font-weight:800">✕ Delete</button>
      </div>`;
    }).join('')}
    <div class="gap"></div>
    <h4 style="margin:14px 0 6px;font-size:13px">Add a new branch</h4>
    <div class="row"><input id="nb-name" placeholder="e.g., Penang" style="flex:1;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg)"><button class="btn-add btn" id="nb-add" style="padding:11px 18px">＋ Add</button></div>
  `);
  $$('[data-del-b]').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = +btn.dataset.delB; const b = db.branches[i];
    const used = db.keys.filter(k=>k.branch===b);
    let msg = `Delete branch "${b}"?`;
    if(used.length){
      msg += `\n\n${used.length} key${used.length===1?' is':'s are'} currently assigned to this branch. They will be unassigned (you can re-assign later). Continue?`;
    }
    if(!confirm(msg)) return;
    // Unassign keys in this branch instead of deleting them
    used.forEach(k => { k.branch = ''; k.unassigned = true; });
    db.branches.splice(i,1);
    // Also drop the matching map data
    const mk = 'br-' + b.replace(/[^A-Za-z0-9_-]/g,'-');
    ['customBays','bayRenames','bayMoves','deletedBays','mapLabels','mapSize'].forEach(prop => {
      if(db[prop] && db[prop][mk]) delete db[prop][mk];
    });
    if(db.customMaps){
      Object.keys(db.customMaps).forEach(k => { if(db.customMaps[k].branch === b) delete db.customMaps[k]; });
    }
    saveDB(); rebuildBayEditorMaps(); closeSheet(); render(); openManageBranches();
    toast(`Branch "${b}" deleted${used.length?` (${used.length} keys unassigned)`:''}`);
  }));
  $('#nb-add').onclick = ()=>{
    const v = $('#nb-name').value.trim(); if(!v) return;
    if(db.branches.includes(v)){ toast('Already exists'); return; }
    db.branches.push(v); saveDB(); rebuildBayEditorMaps();
    closeSheet(); render(); openManageBranches();
    toast(`Branch "${v}" added.`);
  };
}

function getCustomBays(key){ return (db.customBays && db.customBays[key]) || []; }
// Apply per-map overrides (renames, position moves, deletions) so all editor changes flow through one place.
function applyBayRenames(bays, mapKey){
  const ren = (db.bayRenames && db.bayRenames[mapKey]) || {};
  const mov = (db.bayMoves   && db.bayMoves[mapKey])   || {};
  const del = new Set(((db.deletedBays && db.deletedBays[mapKey]) || []).map(s => String(s).toUpperCase()));
  return bays
    .map(b => {
      const newId = ren[b.id] || b.id;
      // Position override keyed by the ORIGINAL id (b.id pre-rename) or the renamed id (custom bays)
      const ovr = mov[b.id] || mov[newId];
      return { ...b, id: newId, _origId: b._origId || b.id, ...(ovr ? { x: ovr.x, y: ovr.y, w: ovr.w, h: ovr.h } : {}) };
    })
    .filter(b => !del.has(String(b.id).toUpperCase()) && !del.has(String(b._origId).toUpperCase()));
}
// Return ALL bays for a given branch — built-in maps, custom maps, and blank branches.
// Used by Add Key / Bay picker so edits in the map editor propagate immediately.
function getBaysForBranch(branch){
  const out = [];
  if(!branch) return out;
  if(branch === 'Cheras') return CHERAS_BAYS();
  if(branch === 'Kuchai'){
    return [...KUCHAI_G_BAYS(), ...KUCHAI_B2_BAYS()];
  }
  // Custom uploads (branch attached to a customMaps entry)
  for(const k in (db.customMaps||{})){
    const cm = db.customMaps[k];
    if(cm && cm.branch === branch){
      out.push(...applyBayRenames([...(db.customBays?.[k]||[])], k));
    }
  }
  // Blank branches (manage-branches-added, no image yet) live under "br-<branch>"
  const mk = 'br-' + branch.replace(/[^A-Za-z0-9_-]/g,'-');
  if(db.customBays?.[mk]){
    out.push(...applyBayRenames([...(db.customBays[mk])], mk));
  }
  return out;
}

function bayKey(bayId, branch){
  return db.keys.find(k=>!k.spare && (k.branch===branch) && (k.parking||'').toUpperCase()===bayId.toUpperCase());
}

function bayCurrentKey(bayId, branch){
  return db.keys.find(k => !k.spare && k.branch===branch && k.status==='available' && (k.parking||'').toUpperCase()===bayId.toUpperCase());
}

function isBayDisabled(bayId, branch){
  const list = (db.disabledBays?.[branch] || []).map(s=>String(s).toUpperCase());
  return list.includes(String(bayId).toUpperCase());
}
function toggleBayDisabled(bayId, branch){
  if(!db.disabledBays) db.disabledBays = {};
  if(!db.disabledBays[branch]) db.disabledBays[branch] = [];
  const list = db.disabledBays[branch];
  const i = list.findIndex(x => String(x).toUpperCase() === String(bayId).toUpperCase());
  if(i >= 0) list.splice(i, 1); else list.push(bayId);
  saveDB();
}

function renderCherasMap(){
  const bays = CHERAS_BAYS();
  const tiles = bays.map(b=>{
    const k = bayCurrentKey(b.id, 'Cheras');
    const disabled = isBayDisabled(b.id, 'Cheras');
    let fill = '#dcfce7', stroke = '#16a34a', textColor = '#0a7d2b';
    if(k){
      fill = '#dbeafe'; stroke = '#1d4ed8'; textColor = '#1e3a8a';
      // (Over-180 cars stay blue — age is shown in the aging report, not on the map.)
    }
    if(disabled){ fill = '#fecaca'; stroke = '#b91c1c'; textColor = '#7f1d1d'; }
    const onClick = disabled
      ? `data-disabled-bay="${b.id}" data-branch="Cheras"`
      : (k ? `data-id="${k.id}"` : `data-empty-bay="${b.id}" data-branch="Cheras"`);
    const strokeAttrs = (k && k.unassigned)
      ? `stroke="#FF3D00" stroke-width="2.5" stroke-dasharray="4 2"`
      : disabled ? `stroke="#b91c1c" stroke-width="2"` : `stroke="${stroke}" stroke-width="1.5"`;
    const cx = b.x + b.w/2;
    const idSize = Math.max(9, Math.min(b.h * (k ? 0.30 : 0.40), 13));
    const plateSize = Math.max(7, Math.min(b.h*0.30, 11));
    return `
      <g class="bay" ${onClick} style="cursor:pointer">
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="${fill}" ${strokeAttrs}/>
        <text x="${cx}" y="${b.y + ((k && !disabled) ? b.h*0.36 : b.h/2 + 4)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="${idSize}" font-weight="700" fill="${textColor}" pointer-events="none">${b.id}</text>
        ${(k && !disabled) ? `<text x="${cx}" y="${b.y + b.h*0.75}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="${plateSize}" font-weight="900" fill="${textColor}" pointer-events="none">${k.reg}</text>` : ''}
        ${disabled ? `<line x1="${b.x+4}" y1="${b.y+4}" x2="${b.x+b.w-4}" y2="${b.y+b.h-4}" stroke="#b91c1c" stroke-width="1.5" pointer-events="none"/><line x1="${b.x+b.w-4}" y1="${b.y+4}" x2="${b.x+4}" y2="${b.y+b.h-4}" stroke="#b91c1c" stroke-width="1.5" pointer-events="none"/>`:''}

      ${selectBanner}
      <div class="filters">${branchChips}</div>
      ${floorTabs}
      ${renderMapHeader(title)}
      <div class="card pad" style="padding:6px">${mapSvg}</div>

  const byBranch = {};

  }).join('');
  return `
    ${selectBanner}
    <div class="filters">${branchChips}</div>
    ${renderMapHeader(showBranch+' Map')}
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${tiles || '<div class="empty">No parked cars in this branch yet</div>'}</div>
  `;
}

function openAssignEmptyBay(bayId, branch){

  const baseCandidates = db.keys.filter(k => !k.spare);
  let assignQuery = '';

  function renderRows(){
    const Q = assignQuery.trim().toLowerCase();
    const list = (Q
      ? baseCandidates.filter(k => [k.car, k.reg, k.dealer, k.id, k.serial, k.branch, k.parking].join(' ').toLowerCase().includes(Q))
      : baseCandidates.slice()
    ).sort((a,b)=>{

      const sa = a.status==='out' ? 0 : 1;
      const sb = b.status==='out' ? 0 : 1;
      if(sa !== sb) return sa - sb;
      return (a.reg||'').localeCompare(b.reg||'');
    });
    const out = $('#ab-list'); if(!out) return;
    out.innerHTML = list.length ? list.map(k=>{
      const isOut = k.status==='out';
      const verb  = isOut ? 'Check IN here' : `Move from ${k.branch} bay ${k.parking||'—'}`;
      const verbClass = isOut ? 'btn-in' : 'btn-transfer';
      return `
      <div class="key-card" data-ab-id="${k.id}" style="margin-bottom:6px">
        ${k.photo
          ? `<div class="qrwrap" data-payload="${qrPayload(k)}" style="background:#fff;padding:0;overflow:hidden"><img src="${k.photo}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`
          : `<div class="qrwrap" data-payload="${qrPayload(k)}"></div>`}
        <div>
          <div class="title">${k.car}</div>
          <div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span></div>
          <div class="meta"><span class="pill ${isOut?'out':'avail'}">${isOut?'OUT':'Parked @ '+k.parking}</span><span class="${verbClass}" style="padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.3px">${verb}</span></div>
        </div>
        <div class="muted">›</div>
      </div>`;
    }).join('') : `<div class="muted" style="font-size:13px;padding:8px 0">${Q?'No match':'No cars yet — tap "Add new key" above'}</div>`;
    $$('#ab-list .qrwrap[data-payload]').forEach(el=>qrInto(el, el.dataset.payload, 56));
    $$('#ab-list [data-ab-id]').forEach(el=>el.addEventListener('click', ()=>{
      const k = db.keys.find(x=>x.id===el.dataset.abId); if(!k) return;
      const wasParkedElsewhere = (k.status==='available') && (k.branch !== branch || (k.parking||'') !== bayId);

      if(wasParkedElsewhere){
        if(!confirm(`Move ${k.reg} from ${k.branch} bay ${k.parking||'—'} → ${branch} bay ${bayId}?`)) return;
      }
      const from = k.branch; const oldBay = k.parking;

      k.status='available'; k.inSince=Date.now(); k.branch=branch; k.parking=bayId; k.unassigned=false;
      if(wasParkedElsewhere && from !== branch){
        db.history.unshift({ts:Date.now(), type:'transfer', keyId:k.id, user:db.user.name, from, to:branch, note:`bay ${oldBay||'—'} → ${bayId}`});
        notifyMovement(k, 'transfer', {from, to:branch, note:`bay ${oldBay||'—'} → ${bayId}`});
      } else {
        db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bayId});
        notifyMovement(k, 'in', {parking:bayId});
      }
      saveDB(); closeSheet(); render(); toast(`${k.reg} → ${branch} bay ${bayId}`);
    }));
  }

  openSheet(`
    <h3>Bay ${bayId} · ${branch}</h3>
    <div class="muted" style="margin-bottom:10px">Search a car to assign here, or add a new one.</div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="ab-q" placeholder="Search plate / model…" autofocus>
    </div>
    <div class="gap"></div>
    <button class="btn-add btn block" id="ab-new" style="margin-bottom:10px">＋ Add new key into this bay</button>
    <h3 style="font-size:14px;margin:0 0 6px">All cars (tap to assign here)</h3>
    <div id="ab-list"></div>
  `);
  renderRows();
  $('#ab-q').addEventListener('input', e=>{ assignQuery = e.target.value; renderRows(); });
  $('#ab-new').onclick = ()=>{
    closeSheet();
    openAddKey();
    setTimeout(()=>{
      if($('#f-branch'))  $('#f-branch').value = branch;
      if($('#f-parking')) $('#f-parking').value = bayId;
    }, 80);
  };
}

function openEditBay(k){
  if(!isAdmin()){ toast('Admin only'); return; }
  openSheet(`
    <h3>Edit bay for ${k.car}</h3>
    <div class="muted" style="margin-bottom:10px">${k.reg} · current bay: <b>${k.parking||'—'}</b></div>
    <div class="field"><label>New bay number</label><input id="eb-bay" value="${k.parking||''}"></div>
    <div class="row">
      <button class="btn-in btn" id="eb-save">Save</button>
      <button class="btn-out btn" id="eb-clear">Clear (set OUT)</button>
    </div>
  `);
  $('#eb-save').onclick = ()=>{
    const v = $('#eb-bay').value.trim(); if(!v){ toast('Need bay'); return; }
    const conflict = bayConflictKey(v, k.id);
    if(conflict){
      if(!confirm(`Bay ${v} held by ${conflict.reg} — force replace? Old key marked UNASSIGNED.`)) return;
      if(conflict.inSince){ conflict.totalParkedMs=(conflict.totalParkedMs||0)+(Date.now()-conflict.inSince); }
      conflict.inSince=null; conflict.status='out'; conflict.unassigned=true;
      db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'admin moved bay — UNASSIGNED', forced:true});
      notifyMovement(conflict, 'out', {purpose:'admin moved bay — UNASSIGNED', forced:true});
    }
    k.parking = v;
    k.status = 'available';
    if(!k.inSince) k.inSince = Date.now();
    k.unassigned = false;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:v, forced:!!conflict});
    notifyMovement(k, 'in', {parking:v, forced:!!conflict});
    saveDB(); closeSheet(); render(); toast(`Bay updated → ${v}`);
  };
  $('#eb-clear').onclick = ()=>{
    if(k.inSince){ k.totalParkedMs=(k.totalParkedMs||0)+(Date.now()-k.inSince); }
    k.inSince=null; k.status='out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose:'admin cleared bay', forced:true});
    notifyMovement(k, 'out', {purpose:'admin cleared bay', forced:true});
    saveDB(); closeSheet(); render(); toast('Bay cleared');
  };
}

let dealersQuery = '';
function openManageDealers(){
  if(!isAdmin()){ toast('Admin only'); return; }
  function renderList(){
    const Q = dealersQuery.trim().toLowerCase();
    const list = (db.dealers||[]).filter(d => !Q || d.toLowerCase().includes(Q));
    const out = $('#md-list'); if(!out) return;
    out.innerHTML = list.length ? list.map((d)=>{
      const userCount = (db.users||[]).filter(u => u.dealer===d).length;
      const keyCount  = db.keys.filter(k => k.dealer===d).length;
      const i = db.dealers.indexOf(d);
      return `
        <div class="key-card" data-md-name="${encodeURIComponent(d)}" style="margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer">
          <div style="width:42px;height:42px;border-radius:10px;background:var(--hover);display:grid;place-items:center;font-weight:800;color:var(--brand)">${d[0]||'?'}</div>
          <div style="flex:1">
            <div style="font-weight:700">🏢 ${d}</div>

          </div>
          <button class="btn-out btn" data-del-d="${i}" style="padding:6px 10px;font-size:12px">Remove</button>
          <div class="muted">›</div>
        </div>`;
    }).join('') : '<div class="muted" style="font-size:13px;padding:8px">No dealers match</div>';

    $$('[data-md-name]').forEach(el=>el.addEventListener('click', ev=>{
      // Don't open if the user tapped the Remove button
      if(ev.target.closest('[data-del-d]')) return;
      const name = decodeURIComponent(el.dataset.mdName);
      closeSheet();
      usersQuery = '';
      openManageUsers(name);
    }));
    $$('[data-del-d]').forEach(btn=>btn.addEventListener('click', ev=>{
      ev.stopPropagation();
      const i = +btn.dataset.delD, d = db.dealers[i];
      if(db.keys.some(k=>k.dealer===d)){ toast('Dealer in use by a key'); return; }
      if(db.users.some(u=>u.dealer===d)){ toast('Dealer in use by a user'); return; }
      if(!confirm(`Remove dealer "${d}"?`)) return;
      db.dealers.splice(i,1); saveDB(); renderList();
    }));
  }
  openSheet(`
    <h3>Manage dealers</h3>
    <div class="muted" style="font-size:13px;margin-bottom:8px">Tap a dealer to see its users. Removing requires no keys/users attached.</div>

  `);
  renderList();
  $('#md-q').addEventListener('input', e=>{ dealersQuery = e.target.value; renderList(); });
  $('#nd-add').onclick = ()=>{
    const v = $('#nd-name').value.trim(); if(!v) return;
    if(db.dealers.includes(v)){ toast('Already exists'); return; }
    db.dealers.push(v); saveDB(); $('#nd-name').value=''; renderList(); toast('Dealer added');
  };
}

let agingFilter = { branch:'all', dealer:'all' };
function viewAging(){
  const allItems = db.keys.filter(k=>!k.spare && isOver180(k));
  // Apply filters
  let items = allItems.slice();
  if(agingFilter.branch !== 'all') items = items.filter(k=>k.branch===agingFilter.branch);
  if(agingFilter.dealer !== 'all') items = items.filter(k=>(k.dealer||'')===agingFilter.dealer);
  items.sort((a,b)=>currentParkedMs(b)-currentParkedMs(a));

  const branchChips = [['all','All branches'], ...db.branches.map(b=>[b,b])];
  const dealers     = [...new Set(allItems.map(k=>k.dealer||'').filter(Boolean))].sort();
  const dealerChips = [['all','All dealers'], ...dealers.map(d=>[d,d])];

  const byDealer = {};
  items.forEach(k=>{ const d=k.dealer||'(no dealer)'; (byDealer[d]=byDealer[d]||[]).push(k); });
  const dealerRows = Object.entries(byDealer).sort((a,b)=>b[1].length-a[1].length);

      <h3 style="margin:0 0 4px">⚠ Cars parked &gt; 180 days</h3>

      ${isAdmin() ? `
        <div class="row" style="margin-top:10px">
          <button class="btn-add btn" id="export-aging-csv">⤓ CSV</button>
          <button class="btn-add btn" id="export-aging-pdf">⤓ PDF</button>

    <div class="card pad" style="padding:10px">
      <div class="row">
        <div class="field" style="margin:0"><label>Filter by branch</label>
          <select id="ag-branch">
            ${branchChips.map(([v,l])=>`<option value="${v}" ${agingFilter.branch===v?'selected':''}>🏢 ${l}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin:0"><label>Filter by dealer</label>
          <select id="ag-dealer">
            ${dealerChips.map(([v,l])=>`<option value="${v}" ${agingFilter.dealer===v?'selected':''}>👤 ${l}</option>`).join('')}

function agingFilteredItems(){
  let items = db.keys.filter(k=>!k.spare && isOver180(k));
  if(agingFilter && agingFilter.branch && agingFilter.branch !== 'all') items = items.filter(k=>k.branch===agingFilter.branch);
  if(agingFilter && agingFilter.dealer && agingFilter.dealer !== 'all') items = items.filter(k=>(k.dealer||'')===agingFilter.dealer);
  return items.sort((a,b)=>currentParkedMs(b)-currentParkedMs(a));
}

function exportAgingCSV(){
  if(!isAdmin()){ toast('Admin only'); return; }
  const items = agingFilteredItems();
  const rows = [['serial','plate','car','dealer','branch','parking','days_parked','total_parked_human']];
  items.forEach(k=>rows.push([serialDisplay(k), k.reg, k.car, k.dealer||'', k.branch||'', k.parking||'', ageDays(k), fmtDur(currentParkedMs(k))]));
  download('carnet-aging-180.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'), 'text/csv');
  toast(`Exported ${items.length} aging cars`);
}

function pdfAgingFiltered(){

/* ---------- bindings via event delegation (wired ONCE at script init) ---------- */
function bindDynamic(){ /* no-op kept for backward compat */ }

function installDelegatedHandlers(){
  const main = $('#main');

  main.addEventListener('click', (e)=>{
    const t = e.target;

    const hit = (sel) => t.closest(sel);

    // BAY EDITOR ABSOLUTE PRIORITY — only intercepts BAY taps, not button clicks.
    if(view==='bayedit'){
      const bayG = e.target.closest('g.bay') || e.target.closest('g.be-built');
      if(bayG){
        // Drag suppression only applies to bay clicks.
        if(beDragMoved){ beDragMoved = false; return; }
        let currentId = bayG.dataset.emptyBay || bayG.dataset.disabledBay || bayG.dataset.builtId || bayG.dataset.builtOrig || '';
        if(!currentId && bayG.dataset.id){
          const kk = db.keys.find(k=>k.id===bayG.dataset.id);
          if(kk) currentId = kk.parking || '';
        }
        if(currentId){
          if(bayEditor.deleteMode){ bayEditorDeleteAnyBay(currentId); return; }
          bayEditorSelectBay(currentId);
          return;
        }
      }
      // For non-bay clicks (buttons, inputs), reset the drag flag and fall through to other handlers
      if(beDragMoved) beDragMoved = false;
    }


    const stat = hit('[data-stat]');
    if(stat){
      const s = stat.dataset.stat;
      if(s==='avail')  { keysFilter={q:'',status:'available',spare:'main', branch:homeBranch};  go('keys'); }
      if(s==='spare')  { keysFilter={q:'',status:'available',spare:'spare',branch:homeBranch};  go('keys'); }
      if(s==='outnow') { keysFilter={q:'',status:'out',      spare:'all',  branch:homeBranch};  go('keys'); }
      if(s==='out30')  { mvFilter='out'; go('history'); }
      if(s==='aging')  { go('aging'); }
      if(s==='overdue'){ keysFilter={q:'overdue',status:'out',spare:'all',branch:homeBranch}; go('keys'); }
      if(s==='carwash'){ openCarWashList(homeBranch==='all'?'':homeBranch); }

      if(s==='today-in')   { mvFilter='today-in';   go('history'); }
      if(s==='today-out')  { mvFilter='today-out';  go('history'); }
      if(s==='today-tr')   { mvFilter='today-tr';   go('history'); }
      if(s==='today-sold') { mvFilter='today-sold'; go('history'); }
      return;
    }

    const chipBr = hit('.chip[data-fbr]'); if(chipBr){ homeBranch = chipBr.dataset.fbr; render(); return; }

    const mcf = hit('[data-mcf]'); if(mcf){ myCarFilter = mcf.dataset.mcf; render(); return; }
    if(hit('#qa-out')){ openHomeKeyAction('out'); return; }
    if(hit('#qa-in')) { openHomeKeyAction('in');  return; }
    if(hit('#qa-transfer')){ openHomeKeyAction('transfer'); return; }
    if(hit('#carwash-btn')){ openCarWashList(homeBranch); return; }
    if(hit('#go-history')){ go('history'); return; }

    if(hit('#add-key')){ openAddKey(); return; }
    if(hit('#export-all')){ exportKeysCSV(); return; }
    if(hit('#bulk-toggle')){ if(!isAdmin()){ toast('Admin only'); return; } bulkMode = !bulkMode; bulkSel.clear(); render(); return; }
    if(hit('#bulk-out')){ if(!isAdmin()){ toast('Admin only'); return; } doBulkOut(); return; }
    if(hit('#bulk-in')){  if(!isAdmin()){ toast('Admin only'); return; } doBulkIn();  return; }
    if(hit('#bulk-tr')){  if(!isAdmin()){ toast('Admin only'); return; } doBulkTransfer(); return; }
    if(hit('#bulk-del')){ if(!isAdmin()){ toast('Admin only'); return; } doBulkDelete(); return; }
    if(hit('#bulk-exit')){ bulkMode = false; bulkSel.clear(); render(); return; }
    const chipFs = hit('[data-fs]'); if(chipFs){ keysFilter.status = chipFs.dataset.fs; if(view!=='keys') go('keys'); else render(); return; }
    const chipFp = hit('.chip[data-fp]'); if(chipFp){ keysFilter.spare  = chipFp.dataset.fp; render(); return; }
    const chipFbk= hit('.chip[data-fbk]');if(chipFbk){ keysFilter.branch = chipFbk.dataset.fbk; render(); return; }

    const chipMv = hit('.chip[data-fmv]'); if(chipMv){ mvFilter = chipMv.dataset.fmv; render(); return; }

    const mv = hit('.mv[data-key-id]');
    if(mv){
      const id = mv.dataset.keyId;
      if(id) openKey(id);
      return;
    }

    const card = hit('.key-card[data-id]');
    if(card){
      const id = card.dataset.id;
      if(bulkMode && card.dataset.bulk){
        if(bulkSel.has(id)) bulkSel.delete(id); else bulkSel.add(id);
        render();
      } else {
        openKey(id);
      }
      return;
    }

    if(hit('#scan-manual-go')){ runManualLookup(); return; }
    const zm = hit('[data-zm]');
    if(zm){
      window.__scanZoom = (window.__scanZoom||1.8) + (zm.dataset.zm==='in'?0.3:-0.3);
      window.__scanZoom = Math.max(1, Math.min(5, window.__scanZoom));
      applyCameraZoom(window.__scanZoom);
      return;
    }

    if(hit('#export-history')){ exportHistoryCSV(); return; }

    if(hit('#show-myqr')){ showMyQR(); return; }
    if(hit('#login-as')){ openLoginSheet(); return; }
    if(hit('#logout')){
      if(!confirm('Logout?')) return;

      db.user = { name:'Guest', dealer:'—', branch:'Cheras', userId:'00000000', role:'user' };
      saveDB(); render(); openLoginSheet();
      return;
    }
    if(hit('#branch-hub')){ openBranchHub(); return; }
    if(hit('#export-keys-csv')){ exportKeysCSV(); return; }
    if(hit('#export-keys-json')){ exportJSON(); return; }
    if(hit('#export-history-csv')){ exportHistoryCSV(); return; }
    if(hit('#export-aging-csv')){ exportAgingCSV(); return; }
    if(hit('#export-aging-pdf')){ pdfAgingFiltered(); return; }
    if(hit('#ag-reset')){ agingFilter = {branch:'all', dealer:'all'}; render(); return; }
    if(hit('#dl-all-stickers')){ if(!isAdmin()){ toast('Admin only'); return; } downloadAllStickers(); return; }
    if(hit('#pdf-keys')){    pdfMyKeys();    return; }
    if(hit('#pdf-history')){ pdfMyHistory(); return; }
    if(hit('#pdf-aging')){   pdfAgingReport(); return; }
    if(hit('#pdf-my-keys')){ pdfMyKeys(); return; }
    if(hit('#pdf-my-history')){ pdfMyHistory(); return; }

    const zoomBtn = hit('[data-zoom]');
    if(zoomBtn){
      ev_stop(e);
      const z = zoomBtn.dataset.zoom;
      if(z==='in')    mapZoom = Math.min(3, +(mapZoom + 0.25).toFixed(2));
      if(z==='out')   mapZoom = Math.max(0.6, +(mapZoom - 0.25).toFixed(2));
      if(z==='reset') mapZoom = 1;
      render();
      return;
    }

    const pdfBtn = hit('[data-pdf-export]');
    if(pdfBtn){
      ev_stop(e);
      let key = pdfBtn.dataset.pdfExport;
      if(key === 'auto'){
        // Resolve currently visible map from the branch filter + Kuchai floor toggle
        if(homeBranch === 'Kuchai') key = (kuchaiFloor === 'G') ? 'Kuchai-G' : 'Kuchai-B2';
        else key = 'Cheras';
      }
      exportMapToPdf(key);
      return;
    }

    const kfBtn = hit('.chip[data-kf]'); if(kfBtn){ kuchaiFloor = kfBtn.dataset.kf; render(); return; }

    if(hit('#map-edit-toggle')){ mapEditMode = !mapEditMode; render(); return; }
    const editBay = hit('[data-edit-bay]');
    if(editBay){
      ev_stop(e);
      const k = db.keys.find(x=>x.id===editBay.dataset.editBay); if(k) openEditBay(k);
      return;
    }

    if(hit('#cancel-bay-select')){ selectingBayFor = null; render(); toast('Cancelled'); return; }

    if(selectingBayFor){
      const svgBaySel = hit('g.bay[data-id]');
      const emptyBaySel = hit('[data-empty-bay]');
      const gridTileSel = hit('[data-bay-tile]');
      let bayId = null, occupiedBy = null;
      if(svgBaySel){
        const occ = db.keys.find(x=>x.id===svgBaySel.dataset.id);
        bayId = occ?.parking || null;
        occupiedBy = occ;
      } else if(emptyBaySel){ bayId = emptyBaySel.dataset.emptyBay; }
      else if(gridTileSel){
        bayId = decodeURIComponent(gridTileSel.dataset.bayTile||'');
        occupiedBy = db.keys.find(x=>x.id===gridTileSel.dataset.id);
      }
      if(bayId){
        const ctx = selectingBayFor;

        if(isBayDisabled(bayId, ctx.branch || 'Cheras')){ toast(`Bay ${bayId} is not available`); return; }

        if(ctx.action === 'bulk-add'){
          if(occupiedBy){
            if(!confirm(`Bay ${bayId} held by ${occupiedBy.reg}. Use anyway? You'll be asked to force-replace when saving.`)) return;
          }
          if(bulkRows[ctx.rowIndex]) bulkRows[ctx.rowIndex].bay = bayId;
          selectingBayFor = null;
          go('home', false); openBulkAdd();
          toast(`Bay ${bayId} set on row ${ctx.rowIndex+1}`);
          return;
        }

        if(ctx.action === 'add-key'){
          if(occupiedBy){
            if(!confirm(`Bay ${bayId} held by ${occupiedBy.reg}. Use anyway? You'll be asked to force-replace when saving.`)) return;
          }

          const draft = pendingAddKeyForm || {};
          draft.parking = bayId;
          pendingAddKeyForm = null;
          selectingBayFor = null;

          if(draft.existing){
            const found = db.keys.find(x=>x.id===draft.existingId);
            if(found) openAddKey(found); else openAddKey();
          } else {
            openAddKey();
          }

          requestAnimationFrame(()=>{
            const set = (id, v) => { const el = document.getElementById(id); if(el && v != null && v !== '') el.value = v; };
            set('f-car',        draft.car);
            set('f-reg',        draft.reg);
            set('f-dealer',     draft.dealer);
            set('f-branch',     draft.branch);
            set('f-create',     draft.mode);
            set('f-spare',      draft.spareEdit);
            set('f-prev-days',  draft.prevDays);
            set('f-prev-hours', draft.prevHours);
            set('f-parking',    draft.parking);

            const br = document.getElementById('f-branch');
            if(br && draft.branch) br.dispatchEvent(new Event('change'));
          });
          toast(`Bay ${bayId} selected → ${bayId}`);
          return;
        }
        const verbing = ctx.action==='transfer' ? 'Transfer' : 'Check in';
        const verbed  = ctx.action==='transfer' ? 'transferred' : 'checked in';
        const occMsg = occupiedBy
          ? `\n\n⚠ Bay ${bayId} currently held by ${occupiedBy.reg} (${lastInDays(occupiedBy)}d).\nOK = force-replace (old key auto-checked-out + marked UNASSIGNED, both actions logged as FORCED).`
          : `\n\n✓ Bay ${bayId} is empty.`;
        if(!confirm(`${verbing} ${ctx.k.reg} (${ctx.k.car}) to bay ${bayId}${ctx.action==='transfer'?` in ${ctx.branch}`:''}?${occMsg}`)) return;
        selectingBayFor = null;

        if(occupiedBy){
          if(occupiedBy.inSince){ occupiedBy.totalParkedMs = (occupiedBy.totalParkedMs||0) + (Date.now() - occupiedBy.inSince); }
          occupiedBy.inSince = null; occupiedBy.status = 'out'; occupiedBy.unassigned = true;
          const tag = ctx.action==='transfer' ? '(transferred-in)' : '(bay reclaimed)';
          db.history.unshift({ts:Date.now(), type:'out', keyId:occupiedBy.id, user:db.user.name, purpose:`auto-closed ${tag} — UNASSIGNED`, forced:true});
          notifyMovement(occupiedBy, 'out', {purpose:`auto-closed ${tag} — UNASSIGNED`, forced:true});
        }
        if(ctx.action === 'transfer'){
          const from = ctx.k.branch || '?';
          db.history.unshift({ts:Date.now(), type:'transfer', keyId:ctx.k.id, user:db.user.name, from, to:ctx.branch, note:ctx.note||''});
          notifyMovement(ctx.k, 'transfer', {from, to:ctx.branch, note:ctx.note||'', forced:!!occupiedBy});
          ctx.k.branch  = ctx.branch;
          ctx.k.parking = bayId;
          ctx.k.unassigned = false;
          saveDB(); render(); toast(`${ctx.k.reg} → ${ctx.branch} bay ${bayId}${occupiedBy?' (forced)':''}`);
        } else {
          ctx.k.status='available'; ctx.k.inSince=Date.now(); ctx.k.branch=ctx.branch; ctx.k.parking=bayId; ctx.k.unassigned=false;
          db.history.unshift({ts:Date.now(), type:'in', keyId:ctx.k.id, user:db.user.name, parking:bayId, forced:!!occupiedBy});
          notifyMovement(ctx.k, 'in', {parking:bayId, forced:!!occupiedBy});
          saveDB(); render(); toast(`${ctx.k.reg} checked in @ ${bayId}${occupiedBy?' (forced)':''}`);
        }
        return;
      }
    }

    // BAY EDITOR PRIORITY: intercept BAY taps, not button taps
    if(view==='bayedit'){
      const bayG = e.target.closest('g.bay') || e.target.closest('g.be-built');
      if(bayG){
        if(beDragMoved){ beDragMoved = false; return; }
        let currentId = bayG.dataset.emptyBay || bayG.dataset.disabledBay || bayG.dataset.builtId || bayG.dataset.builtOrig || '';
        if(!currentId && bayG.dataset.id){
          const kk = db.keys.find(k=>k.id===bayG.dataset.id);
          if(kk) currentId = kk.parking || '';
        }
        if(currentId){
          if(bayEditor.deleteMode){ bayEditorDeleteAnyBay(currentId); return; }
          bayEditorSelectBay(currentId);
          return;
        }
      }
      if(beDragMoved) beDragMoved = false;
    }

    const disBay = hit('[data-disabled-bay]');
    if(disBay){
      const bayId  = disBay.dataset.disabledBay;
      const branch = disBay.dataset.branch || 'Cheras';
      if(isAdmin() && mapEditMode){
        if(confirm(`Bay ${bayId} (${branch}) is NOT AVAILABLE. Mark it AVAILABLE again?`)){
          toggleBayDisabled(bayId, branch); render(); toast(`${branch} ${bayId} → Available`);
        }
      } else {
        toast(`Bay ${bayId} is not available`);
      }
      return;
    }

    const emptyBay = hit('[data-empty-bay]');
    if(emptyBay){
      const bayId  = emptyBay.dataset.emptyBay;
      const branch = emptyBay.dataset.branch || 'Cheras';
      if(isAdmin() && mapEditMode){
        if(confirm(`Mark ${branch} bay ${bayId} as NOT AVAILABLE?\n(Red on the map; no one can assign cars to it until you mark it Available again.)`)){
          toggleBayDisabled(bayId, branch); render(); toast(`${branch} ${bayId} → Not Available`);
        }
        return;
      }
      openAssignEmptyBay(bayId, branch);
      return;
    }

    const moveSpare = hit('[data-move-spare]');
    if(moveSpare){ openMoveSpareSheet(moveSpare.dataset.moveSpare); return; }
    const forceRep = hit('[data-force-replace]');
    if(forceRep){ openForceReplaceSheet(forceRep.dataset.forceReplace); return; }
    const hqPick2 = hit('[data-hq-pick]');
    if(hqPick2){ homeQuery=''; openKey(hqPick2.dataset.hqPick); return; }
    if(hit('#map-plate-clear')){ mapPlateQuery=''; render(); return; }
    const svgBay = hit('g.bay[data-id]');
    if(svgBay){ openKey(svgBay.dataset.id); return; }

    if(hit('#admin-users')){ openManageUsers(); return; }
    if(hit('#admin-purposes')){ openManagePurposes(); return; }
    if(hit('#admin-branches')){ openManageBranches(); return; }
    if(hit('#admin-dealers')){ openManageDealers(); return; }
    if(hit('#admin-bayedit')){ if(!isSuperAdmin()){ toast('Super-admin only'); return; } go('bayedit'); return; }

    // Bay editor — handle EVERYTHING on this view first so default bay handlers can't steal taps
    if(view==='bayedit'){
      if(hit('#be-create'))     { bayEditorCreate();             return; }
      if(hit('#be-export-pdf')) { exportMapToPdf(bayEditor.key); return; }
      if(hit('#be-save'))       { bayEditorSave();               return; }
      if(hit('#be-discard'))    { bayEditorDiscard();            return; }
      const ddel = hit('[data-be-draft-del]');
      if(ddel){ bayEditor.draft.splice(+ddel.dataset.beDraftDel, 1); render(); return; }
      const sdel = hit('[data-be-del]');
      if(sdel){
        if(!confirm('Remove this saved custom bay?')) return;
        db.customBays[bayEditor.key].splice(+sdel.dataset.beDel, 1); saveDB(); render(); return;
      }
      const ren = hit('[data-be-rename]');
      if(ren){ bayEditorRename(+ren.dataset.beRename); return; }
      const en  = hit('[data-be-enable]');
      if(en){
        const branch = (bayEditor.key === 'Cheras') ? 'Cheras' : 'Kuchai';
        toggleBayDisabled(en.dataset.beEnable, branch);
        toast(`${en.dataset.beEnable} → Available`);
        render(); return;
      }
      if(hit('#be-enable-all')){
        const branch = (bayEditor.key === 'Cheras') ? 'Cheras' : 'Kuchai';
        const n = (db.disabledBays?.[branch] || []).length;
        if(!n) return;
        if(!confirm(`Enable all ${n} disabled bays in ${branch}?`)) return;
        db.disabledBays[branch] = []; saveDB();
        toast(`Enabled ${n} bays in ${branch}`); render(); return;
      }
      if(hit('#label-go')){
        const txt = (document.getElementById('label-text')?.value || '').trim();
        const sz = parseInt(document.getElementById('label-size')?.value, 10) || 16;
        const color = document.getElementById('label-color')?.value || '#0f172a';
        if(!txt){ toast('Type label text first'); return; }
        bayEditor.labelFormOpen = false;
        bayEditorAddLabelApply(txt, sz, color);
        return;
      }
      if(hit('#label-cancel')){ bayEditor.labelFormOpen = false; render(); return; }
      if(hit('#grid-go')){
        const rows = parseInt(document.getElementById('grid-rows')?.value, 10);
        const cols = parseInt(document.getElementById('grid-cols')?.value, 10);
        const prefix = document.getElementById('grid-prefix')?.value || '';
        const startNum = parseInt(document.getElementById('grid-start')?.value, 10) || 1;
        if(!rows || rows < 1 || !cols || cols < 1){ toast('Rows and Columns must be at least 1'); return; }
        bayEditor.gridFormOpen = false;
        bayEditorAddGridApply(rows, cols, prefix, startNum);
        return;
      }
      if(hit('#grid-cancel')){ bayEditor.gridFormOpen = false; render(); return; }
      const hqPick = hit('[data-hq-pick]');
      if(hqPick){ openKey(hqPick.dataset.hqPick); return; }
      const rowSave = hit('[data-row-save]');
      if(rowSave){ bayEditorRowSave(rowSave.dataset.rowSave); return; }
      const rowDel = hit('[data-row-del]');
      if(rowDel){ bayEditorRowDelete(rowDel.dataset.rowDel); return; }
      if(hit('#be-sel-save'))    { bayEditorSelectedSave();             return; }
      if(hit('#be-sel-cancel'))  { bayEditor.selected = null; bayEditorRenderSelectionPanel(); return; }
      if(hit('#be-sel-delete'))  { bayEditorSelectedDelete();           return; }
      if(hit('#be-toggle-del'))  { bayEditorToggleDelete();              return; }
      if(hit('#be-add-label'))   { bayEditorAddLabel();                  return; }
      if(hit('#be-add-grid'))    { bayEditorAddGrid();                   return; }
      if(hit('#be-extend-w'))    { bayEditorExtendCanvas('w', 200);      return; }
      if(hit('#be-extend-h'))    { bayEditorExtendCanvas('h', 200);      return; }
      if(hit('#be-reset-size'))  { bayEditorResetCanvas();               return; }

      const labUp = hit('[data-label-update]');
      if(labUp){ bayEditorUpdateLabelText(+labUp.dataset.labelUpdate); return; }
      const labDel = hit('[data-label-del]');
      if(labDel){ bayEditorDeleteLabel(+labDel.dataset.labelDel); return; }
      // Tap any bay on the SVG → rename prompt (works for built-in AND custom).
      const tapped = e.target.closest('g.bay');
      if(tapped){
        const tappedId = tapped.dataset.id ? null /* occupied = handled below */ : (tapped.dataset.emptyBay || tapped.dataset.disabledBay);
        // Always prefer the bay id from data-attributes (it's the current/displayed name)
        const currentId = tapped.dataset.emptyBay || tapped.dataset.disabledBay
                       || (tapped.dataset.id ? (db.keys.find(k=>k.id===tapped.dataset.id)?.parking || '') : '');
        if(currentId){ bayEditorRenameAnyBay(currentId); return; }
      }
      // Map taps no longer create bays — drag handles everything (drafts) or rename (existing bays)
    }
    if(hit('#bulk-add')){ if(!isAdmin()){ toast('Admin only'); return; } openBulkAdd(); return; }
    if(hit('#bulk-mode')){ bulkMode = !bulkMode; bulkSel.clear(); go('keys'); return; }
    const goBtn = hit('[data-go]'); if(goBtn){ go(goBtn.dataset.go); return; }
    if(hit('#wipe')){
      if(confirm('Reset all data back to the demo set?')){ db = structuredClone(DEFAULT_DB); saveDB(); render(); toast('Reset done'); }
      return;
    }
  });

  main.addEventListener('input', (e)=>{
    if(e.target.id === 'kq'){
      keysFilter.q = e.target.value;
      const v = e.target.value; render();
      const box = $('#kq');
      if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
    if(e.target.id === 'hq'){
      homeQuery = e.target.value;
    }
    if(e.target.id === 'mcq'){
      myCarQuery = e.target.value;
      const v = e.target.value; render();
      const box = $('#mcq'); if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
    if(e.target.id === 'be-id'){ bayEditor.newId = e.target.value; }
    if(e.target.id === 'be-list-search' && view==='bayedit'){
      bayEditor.listSearch = e.target.value;
      // Don't full re-render (lose focus); just toggle visibility manually
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('[data-row-save]').forEach(btn => {
        const id = btn.dataset.rowSave.toLowerCase();
        const row = btn.closest('.key-card');
        if(row) row.style.display = (!q || id.includes(q)) ? '' : 'none';
      });
    }
    // Home search: update dropdown only (don't re-render the whole view — keeps focus)
    if(e.target.id === 'hq'){
      homeQuery = e.target.value;
      updateHomeSearchDropdown();
      return;
    }
    // Map plate search: update matches list + bay highlights without losing input focus
    if(e.target.id === 'map-plate-q'){
      mapPlateQuery = e.target.value;
      updateMapPlateUI();
      return;
    }
    if(e.target.id === 'be-w' && view==='bayedit'){ bayEditor.w = parseInt(e.target.value,10) || 50; }
    if(e.target.id === 'be-h' && view==='bayedit'){ bayEditor.h = parseInt(e.target.value,10) || 56; }
    if(e.target.id === 'hsq'){
      historyQuery = e.target.value;
      const v = e.target.value; render();
      const box = $('#hsq'); if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
  });

  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'hq' && e.key === 'Enter'){
      e.preventDefault();
      keysFilter = { q:homeQuery, status:'all', spare:'all', branch:homeBranch };
      go('keys');
    }
  });

  main.addEventListener('change', (e)=>{
    if(e.target.id === 'scan-file' || e.target.id === 'scan-cam') return scanFromFile(e);
    if(e.target.id === 'import-file') return importFile(e);
    if(e.target.id === 'ag-branch'){ agingFilter.branch = e.target.value; render(); }
    if(e.target.id === 'ag-dealer'){ agingFilter.dealer = e.target.value; render(); }
    if(e.target.id === 'be-map'){ bayEditor.key = e.target.value; bayEditor.selected = null; render(); }
    if(e.target.id === 'be-w')  { bayEditor.w = parseInt(e.target.value,10) || 50; }
    if(e.target.id === 'be-h')  { bayEditor.h = parseInt(e.target.value,10) || 56; }
  });

  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'scan-manual' && e.key === 'Enter'){
      e.preventDefault(); runManualLookup();
    }
  });
}

/* ---------- key actions ---------- */
// Read-only profile for a deleted/archived car (rebuilt from the history snapshot).
function openDeletedKey(delEntry){
  const k = delEntry.snapshot || {};
  const allMoves = db.history.filter(h => h.keyId === delEntry.keyId).sort((a,b)=>b.ts-a.ts);
  openSheet(`
    <h3 style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k.car || '(deleted car)'}</span>
      ${k.photo ? `<button class="icon-btn" id="sh-photo-action" style="background:#000;color:#fff;border-radius:10px;width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:18px">📸</button>` : ''}
    </h3>
    <div class="muted" style="margin-bottom:8px">${k.reg || ''} · ${k.branch || k.dealer || ''} · 📍 ${k.parking || '—'}</div>

    <div class="card pad" style="background:#374151;color:#fff;border:0">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:24px">🗄️</div>
        <div style="flex:1">
          <div style="font-weight:800;letter-spacing:.5px">DELETED${delEntry.purpose ? ' · '+delEntry.purpose : ''}</div>
          <div style="font-size:12.5px;color:#cbd5e1">Removed by ${delEntry.user || '?'} on ${fmt(delEntry.ts)}. Read-only snapshot — actions disabled.</div>
        </div>
      </div>
    </div>
    <div class="gap"></div>

    <div class="card pad" style="padding:10px">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">Last known details</div>
      <div style="display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:13px">
        <div class="muted">Plate</div><div style="font-family:ui-monospace,Menlo,monospace;font-weight:700">${k.reg||'—'}</div>
        <div class="muted">Car</div><div>${k.car||'—'}</div>
        <div class="muted">Serial</div><div style="font-family:ui-monospace,Menlo,monospace">${k.serial||'—'}${k.spare?' (spare)':''}</div>
        <div class="muted">Dealer</div><div>${k.dealer||'—'}</div>
        <div class="muted">Branch</div><div>${k.branch||'—'}</div>
        <div class="muted">Last bay</div><div>${k.parking||'—'}</div>
        <div class="muted">Created by</div><div>${k.createdBy||'—'}</div>
        <div class="muted">Total parked</div><div>${fmtDur(k.totalParkedMs||0)}</div>
      </div>
    </div>

    <h3 style="font-size:14px;margin:10px 0 6px">Movement history (${allMoves.length})</h3>
    ${allMoves.length ? allMoves.map(renderMv).join('') : '<div class="muted">No history</div>'}
    <div class="gap"></div>

    ${isAdmin() ? `<button class="btn-out btn block" id="del-purge" style="margin-top:6px">Purge history entries for this car (admin)</button>` : ''}
  `);
  // Reuse the title-row photo viewer behavior so anyone can see the car photo if it was kept
  if(k.photo) $('#sh-photo-action')?.addEventListener('click', ()=>{
    openSheet(`
      <h3>📸 ${k.car || '(deleted)'} — Key Photo</h3>
      <div class="muted" style="margin-bottom:10px">${k.reg||''} · Serial ${serialDisplay(k)}</div>
      <img src="${k.photo}" alt="" style="width:100%;border-radius:12px;display:block;background:#000">
      <div class="gap"></div>
      <button class="btn block secondary" id="back-to-del">‹ Back</button>
    `);
    $('#back-to-del').onclick = ()=>openDeletedKey(delEntry);
  });
  $('#del-purge')?.addEventListener('click', ()=>{
    if(!confirm('Purge ALL history entries for this car? This is permanent.')) return;
    db.history = db.history.filter(h => h.keyId !== delEntry.keyId);
    saveDB(); closeSheet(); render(); toast('History purged');
  });
}

function openKey(id){

  // Deleted car? Rebuild a read-only profile from the snapshot.
  if(!k){
    const delEntry = db.history.find(h => h.keyId === id && h.snapshot);
    if(delEntry){ openDeletedKey(delEntry); return; }
    return;
  }
  const moves = db.history.filter(h=>h.keyId===id).sort((a,b)=>b.ts-a.ts);
  const parkedNow = currentParkedMs(k);
  const canAct = canEditKey(k);
  openSheet(`
    <h3 style="display:flex;align-items:center;justify-content:space-between;gap:8px">

    </h3>
    <div class="muted" style="margin-bottom:8px">${k.reg} · ${k.branch||k.dealer} · 📍 ${formatLocation(k)}</div>
    ${k.spare ? `
      <button class="btn-transfer btn block" data-move-spare="${k.id}" style="margin-bottom:10px;background:#0ea5e9;font-weight:800">🔁 Move spare to another branch BOX</button>
    ` : ''}
    ${k.unassigned ? `

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">

          </div>
        </div>
        ${canAct ? `
          <div class="row" style="margin-bottom:6px">

      </div>` : ''}
    <div class="qr-big">
      <div class="qrwrap" data-payload="${qrPayload(k)}" style="width:240px;height:240px;border:0"></div>
    </div>
    <div class="qr-caption">Serial: <b>${serialDisplay(k)}</b></div>
    <button class="btn ghost block" id="sh-dlsticker" style="margin-top:8px">⤓ Download Sticker 15×30 cm</button>
    <div class="gap"></div>

    <div class="stats">
      <div class="stat brand"><div class="v">${fmtDur(totalParkedMs(k))}</div><div class="l">Total parking time</div></div>
      <div class="stat ${k.status==='available'?'info':'bad'}">
        <div class="v">${k.status==='available' ? fmtDur(parkedNow) : fmtDur(lastOutMs(k))}</div>
        <div class="l">${k.status==='available' ? 'Currently parked' : 'Currently out'}</div>
      </div>
    </div>
    <div class="gap"></div>

    <div class="row">
      <button class="btn ${k.status==='available'?'btn-out':'btn-force'}" id="sh-out">Key Out</button>
      <button class="btn ${k.status==='out'?'btn-in':'btn-force'}" id="sh-in">Key In</button>
    </div>
    <div class="gap"></div>
    <div class="row">
      ${canEditKey(k) ? `<button class="btn ghost" id="sh-edit">Edit details</button>` : ''}
      <button class="btn ghost" id="sh-transfer">Transfer branch</button>
    </div>
    ${k.status==='available' && !k.spare ? `<button class="btn block" id="sh-wash" style="margin-top:6px;background:#0ea5e9;color:#fff">🚿 Send to ${k.branch||'?'} Car Wash</button>` : ''}
    ${k.status==='available' ? `<button class="btn ghost block" id="sh-replace" style="margin-top:6px;border-color:#dc2626;color:#dc2626">↺ Replace at bay ${k.parking||'—'}</button>` : ''}
    <div class="muted" style="font-size:12px;margin-top:4px">Created by ${k.createdBy||'—'}${!canEditKey(k)?' · only the creator or admin may edit':''}</div>
    <div class="gap"></div>

    <h3 style="font-size:14px;margin:8px 0">Movement history <span class="muted" style="font-weight:400">(${moves.length})</span></h3>

  $('#sh-in').onclick        = ()=>{

  if($('#sh-transfer'))  $('#sh-transfer').onclick = ()=>openTransfer(k);
  if($('#sh-replace'))   $('#sh-replace').onclick  = ()=>openAssignEmptyBay(k.parking, k.branch);
  if($('#sh-wash')) $('#sh-wash').onclick = ()=>{
    const purpose = `Car Wash - ${k.branch||'?'}`;
    if(!confirm(`Send ${k.reg} to ${k.branch} Car Wash?\nThis logs a Key Out with purpose "${purpose}".`)) return;

    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose});

        <div class="gap"></div>

        </div>

      <div class="gap"></div>
