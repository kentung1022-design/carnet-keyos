// Manual lookup from the scan view
function runManualLookup(){
  const q = ($('#scan-manual')?.value || '').trim();
  if(!q){ toast('Type a plate, serial, or key ID'); return; }
  // Try exact matches first
  const exact = db.keys.find(k=>k.serial===q)
             || db.keys.find(k=>k.id===q)
             || db.keys.find(k=>(k.reg||'').toUpperCase()===q.toUpperCase())
             || db.keys.find(k=>`SK_${k.serial}`===q);
  if(exact){ openKey(exact.id); return; }
  // Otherwise show partial matches
  const Q = q.toLowerCase();
  const matches = db.keys.filter(k=>[k.id,k.serial,k.reg,k.car,k.branch].join(' ').toLowerCase().includes(Q)).slice(0,6);
  const out = $('#scan-manual-results');
  if(!out) return;
  if(!matches.length){ out.innerHTML = `<div class="muted">No matches.</div>`; return; }
  out.innerHTML = matches.map(k=>`
    <div class="key-card" data-id="${k.id}" style="margin-bottom:6px">
      <div class="qrwrap" data-payload="${qrPayload(k)}"></div>
      <div><div class="title">${k.car}</div><div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span></div></div>
      <div class="muted">›</div>
    </div>
  `).join('');
  // Paint QRs in the results
  $$('#scan-manual-results .qrwrap[data-payload]').forEach(el=>qrInto(el, el.dataset.payload, 56));
}
function onScan(text){
  if(scanner){ scanner.stop().catch(()=>{}); scanner=null; }
  const raw  = (text||'').trim();
  const parts = raw.split('|');

  // CARNET-format payload
  if(parts[0]==='CARNET'){
    const k = db.keys.find(x => x.id === parts[1])
           || db.keys.find(x => x.serial === parts[1])
           || db.keys.find(x => (x.reg||'').toUpperCase() === (parts[2]||'').toUpperCase());
    if(k){ openKey(k.id); return; }
  }
  // USER payload — Key-Assign QR
  if(parts[0]==='USER'){
    toast('User QR scanned: '+(parts[1]||''));
    return;
  }
  // Plain text QR — match by serial, id, or plate
  const k = db.keys.find(x => x.serial === raw)
         || db.keys.find(x => x.id === raw)
         || db.keys.find(x => (x.reg||'').toUpperCase() === raw.toUpperCase())
         || db.keys.find(x => `SK_${x.serial}` === raw); // spare-key label form
  if(k){ openKey(k.id); return; }

  toast('No matching key: '+raw.slice(0,40));
}

/* ---------- export / import ---------- */
function download(name, content, type='text/plain'){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function csvEsc(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replaceAll('"','""')+'"' : v; }

function exportKeysCSV(){
  if(!isAdmin()){ toast('Export is admin-only'); return; }
  const rows = [['id','serial','serial_display','car','reg','dealer','branch','parking','spare','status','total_parked_ms','total_parked_human','in_since_iso','qr_payload']];
  db.keys.forEach(k=>{
    const total = totalParkedMs(k);
    rows.push([k.id, k.serial||'', serialDisplay(k), k.car, k.reg, k.dealer, k.branch||'', k.parking, k.spare, k.status, total, fmtDur(total), k.inSince?new Date(k.inSince).toISOString():'', qrPayload(k)]);
  });
  download('carnet-keys.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'), 'text/csv');
  toast('Exported '+db.keys.length+' keys');
}
function exportHistoryCSV(){
  if(!isAdmin()){ toast('Export is admin-only'); return; }
  const rows = [['timestamp','type','keyId','reg','car','user','purpose','parking','from_branch','to_branch','note']];
  db.history.forEach(h=>{
    const k = db.keys.find(k=>k.id===h.keyId) || {};
    rows.push([new Date(h.ts).toISOString(), h.type, h.keyId, k.reg||'', k.car||'', h.user||'', h.purpose||'', h.parking||'', h.from||'', h.to||'', h.note||'']);
  });
  download('carnet-history.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'), 'text/csv');
  toast('Exported '+db.history.length+' moves');
}
function exportJSON(){
  if(!isAdmin()){ toast('Export is admin-only'); return; }
  download('carnet-keyos-backup.json', JSON.stringify(db, null, 2), 'application/json');
  toast('Backup saved');
}

function importFile(e){
  const f = e.target.files?.[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const txt = rd.result;
    try {
      if(f.name.endsWith('.json')){
        const obj = JSON.parse(txt);
        if(obj.keys) db = obj; else throw 0;
      } else {
        // CSV: id,car,reg,dealer,parking,spare,status
        const lines = txt.trim().split(/\r?\n/);
        const head = lines.shift().toLowerCase().split(',');
        const idx = name => head.indexOf(name);
        const got = lines.map(l=>{
          const cols = parseCsvLine(l);
          return {
            id: cols[idx('id')] || ('K-'+Math.random().toString(36).slice(2,6).toUpperCase()),
            car: cols[idx('car')] || '',
            reg: (cols[idx('reg')]||'').toUpperCase(),
            dealer: cols[idx('dealer')] || '',
            parking: cols[idx('parking')] || '',
            spare: /true|1|yes/i.test(cols[idx('spare')]||''),
            status: cols[idx('status')] || 'available',
          };
        }).filter(k=>k.car && k.reg);
        // Merge by id
        const map = new Map(db.keys.map(k=>[k.id,k]));
        got.forEach(k=>map.set(k.id,k));
        db.keys = [...map.values()];
      }
      saveDB(); render(); toast('Imported');
    } catch(err){ toast('Import failed'); }
  };
  rd.readAsText(f);
}
function parseCsvLine(l){
  const out=[]; let cur='', q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(q){ if(c==='"' && l[i+1]==='"'){cur+='"'; i++;} else if(c==='"'){q=false;} else cur+=c; }
    else { if(c===','){ out.push(cur); cur=''; } else if(c==='"'){ q=true; } else cur+=c; }
  }
  out.push(cur); return out;
}

    {label:'Branch Transfer',      icon:'🔁', do:()=>{ closeSheet(); openBranchHub(); }},
    {label:'Movement History',     icon:'⏱', do:()=>go('history')},
    {label:'Scan QR',              icon:'📷', do:()=>go('scan')},

  ];
  openSheet(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">

      <div>

        <div class="muted" style="font-size:13px">${db.user.name} · ${db.user.dealer}</div>
        <div class="muted" style="font-size:12px">Branch: ${db.user.branch}</div>

      <button class="btn secondary" data-i="${i}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;justify-content:flex-start;background:transparent;padding:14px 10px;border-bottom:1px solid var(--border);border-radius:0;font-weight:600">
        <span style="font-size:18px">${it.icon}</span><span>${it.label}</span>
      </button>
    `).join('')}
    <div class="muted" style="text-align:center;font-size:12px;margin-top:14px">v0.2 · web prototype</div>
  `);
  // paint the user QR + wire taps
  const big = $('.sheet .qrwrap[data-payload]'); if(big) qrInto(big, big.dataset.payload, 64);
  $$('.sheet button[data-i]').forEach(b=>b.addEventListener('click', ()=>{
    const it = items[+b.dataset.i]; closeSheet(); setTimeout(it.do, 50);
  }));
}

$('#btn-myqr').onclick = showMyQR;
$$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.view)));

// Seed history so phone Back doesn't immediately exit the app
history.replaceState({nav:'home'}, '', '#home');

// Install the persistent delegated handler ONCE — no re-binding on render.
installDelegatedHandlers();

/* ---------- aggressive cleanup of any stale service worker / caches ---------- */
// (Earlier builds may have registered a cache that's now serving stale broken JS.)
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if(self.caches){
  caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
}

render();

// Tick parking durations every minute so the numbers grow without reload.
setInterval(()=>{ if(view==='keys' || view==='home') render(); }, 60000);

// If qrcode library finishes loading AFTER first render, re-paint to fill in placeholders.
(function waitForQR(){
  let tries = 0;
  const t = setInterval(()=>{
    tries++;
    if(typeof QRCode !== 'undefined' && QRCode.toDataURL){ clearInterval(t); render(); }
    else if(tries > 20){ clearInterval(t); }
  }, 250);
})();

// Global error trap so a thrown error doesn't leave the UI frozen.
window.addEventListener('error', e=>{ console.error('Global error:', e.message); });
