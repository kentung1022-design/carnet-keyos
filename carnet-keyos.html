<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>CARNET Key OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Arial Black,system-ui' font-size='30' font-weight='900' text-anchor='middle' fill='%23fff'%3EC%3C/text%3E%3Cpath d='M22 12 L32 50 L42 12' stroke='%23FF3D00' stroke-width='4' fill='none' opacity='.0'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';"></script>
<style>
  :root{
    /* CARNET theme — white bg, black text, orange brand accent */
    --bg:#ffffff; --card:#ffffff; --text:#000000; --muted:#6b7280;
    --brand:#FF3D00;         /* CARNET orange-red (the 'V' in the logo) */
    --brand-2:#FF6E40;
    --accent:#FF3D00;
    --good:#e6f7ec; --good-fg:#0a7d2b;
    --bad:#fde7e7;  --bad-fg:#b71c1c;
    --warn:#fff4d6; --warn-fg:#7a4a00;
    --border:#e5e7eb; --hover:#f3f4f6;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
    --radius:14px;
    --topbar-bg:#000000;     /* CARNET logo background = black */
    --topbar-fg:#ffffff;
    /* Action colors (consistent app-wide) */
    --action-in:#16a34a;       /* Key In   = green   */
    --action-out:#dc2626;      /* Key Out  = red     */
    --action-transfer:#0ea5e9; /* Transfer = blue    */
    --action-add:#FF3D00;      /* Add      = CARNET orange */
    --action-force:#475569;    /* Forced   = dark gray     */
  }
  .btn-in       { background:var(--action-in)      ; color:#fff }
  .btn-out      { background:var(--action-out)     ; color:#fff }
  .btn-transfer { background:var(--action-transfer); color:#fff }
  .btn-add      { background:var(--action-add)     ; color:#fff }
  .btn-force    { background:var(--action-force)   ; color:#fff }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand)}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid #000;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .logo{font:900 22px/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:1px;display:flex;align-items:center;flex:1;font-style:italic;transform:skewX(-6deg);user-select:none}
  .topbar .logo .v{color:var(--brand);display:inline-block}
  .topbar .small-tag{color:#9ca3af;font:600 11px/1 system-ui;margin-left:8px;text-transform:uppercase;letter-spacing:1.2px;font-style:normal;transform:skewX(6deg);display:inline-block}
  .icon-btn{background:transparent;border:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--topbar-fg)}
  .icon-btn:hover{background:rgba(255,255,255,.1)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:14px}

  /* Dashboard */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.brand{background:linear-gradient(160deg,#ccfbf1,#a7f3d0);border-color:#5eead4;color:#064e3b}
  .stat.info{background:linear-gradient(160deg,#dbeafe,#bae6fd);border-color:#7dd3fc;color:#0c4a6e}
  .stat.warn{background:linear-gradient(160deg,#fef3c7,#fde68a);border-color:#fcd34d;color:#78350f}
  .stat.bad {background:linear-gradient(160deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#7f1d1d}

  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .quick button{padding:14px 10px;border-radius:14px;border:0;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;line-height:1.1}
  .qa-out{background:var(--action-out)}
  .qa-in {background:var(--action-in)}
  .qa-tr {background:var(--action-transfer)}
  .quick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

  /* Tabs / nav */
  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:70}
  main{padding-bottom:80px}
  .tab{background:transparent;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer;border-radius:10px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
  .tab.active{color:var(--brand)}
  .tab:hover{background:var(--hover)}

  /* List items */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 8px}
  .listhead h2{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .key-card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
  .key-card:hover{background:var(--hover)}
  .key-card .qrwrap{width:64px;height:64px;background:#fff;border-radius:10px;padding:4px;display:grid;place-items:center;border:1px solid var(--border)}
  .key-card .qrwrap canvas, .key-card .qrwrap img{width:100%;height:100%}
  .key-card .title{font-weight:700;font-size:15px}
  .key-card .meta{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px}
  .key-card .meta span{display:inline-flex;align-items:center;gap:4px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
  .pill.avail{background:var(--good);color:var(--good-fg)}
  .pill.out{background:var(--bad);color:var(--bad-fg)}
  .pill.spare{background:#e0e7ff;color:#3730a3}

  /* Forms */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input, .field select, .field textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .btn{padding:12px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn.secondary{background:var(--hover);color:var(--text)}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .btn.danger{background:#dc2626;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.block{display:block;width:100%}

  /* Search bar */
  .search{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
  .search input{flex:1;border:0;background:transparent;outline:none;font-size:15px}
  .filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* Modal / sheet */
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .scrim.open{display:flex;animation:fadein .15s ease}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:16px 16px 0 0;padding:16px;max-height:78vh;overflow:auto;animation:slideup .22s ease;margin-bottom:72px}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .grab{width:42px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 12px}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}

  /* QR full screen */
  .qr-big{display:grid;place-items:center;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--border)}
  .qr-big canvas, .qr-big img{width:240px;height:240px}
  .qr-caption{text-align:center;color:var(--muted);margin-top:8px;font-size:13px}

  /* Movement history */
  .mv{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;border-left:4px solid var(--good-fg)}
  .mv.out{border-left-color:#dc2626}
  .mv .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mv .car{font-weight:700}
  .mv .reg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:13px}
  .mv .row2{display:flex;gap:12px;color:var(--muted);font-size:12.5px;margin-top:4px;flex-wrap:wrap}

  /* Scanner */
  #scan-region{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:300px}
  #scan-region video{width:100%!important;height:auto!important}
  .scan-hint{color:var(--muted);text-align:center;margin-top:8px;font-size:13px}

  /* Toast — must never block taps */
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.show{opacity:1}

  /* Empty / loading */
  .empty{padding:32px 14px;text-align:center;color:var(--muted)}
  .skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--hover),var(--border),var(--hover));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* Misc */
  .hide{display:none!important}
  .muted{color:var(--muted)}
  .right{margin-left:auto}
  .gap{height:8px}
  details summary{cursor:pointer;padding:8px 0;color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Back" style="display:none">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo">CAR<span class="v">V</span>ET<span class="small-tag">Key OS</span></div>
    <button class="icon-btn" id="btn-search-top" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-myqr" aria-label="My QR">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <!-- Bottom nav -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
    <button class="tab" data-view="keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.65-8.65 2.5 2.5-2.5 2.5-2-2-2 2 2 2"/></svg><span>Keys</span></button>
    <button class="tab" data-view="scan"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 12h10"/></svg><span>Scan</span></button>
    <button class="tab" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button class="tab" data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span></button>
  </nav>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ==========================================================
   CARNET Key OS — improved cross-platform PWA prototype
   Single-file. Works on iOS + Android + desktop.
   Storage: localStorage (drop-in replaceable with Supabase/Firebase)
   ========================================================== */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const DB_KEY = 'carnet_keyos_v1';

const HOUR = 3600000, DAY = 86400000;
const NOW  = Date.now();
const DEFAULT_DB = {
  user:{ name:'Ken Tung', dealer:'EXECAR', branch:'Cheras', userId:'10000899', role:'admin' },
  branches:['Cheras','Kuchai'],
  dealers:['EXECAR','SKT','DDH','King','Fatcar','Tony'],
  // Admins can add/remove. 'Sold/Delivered' is special: triggers deletion of main + paired spare keys.
  purposes:['Demo','Inspection','Paint','Petrol','Warm Up','180 Days Check','Sold/Delivered'],
  users:[
    {id:'U1', name:'Ken Tung',       role:'admin'},
    {id:'U2', name:'hisham hashim',  role:'user'},
    {id:'U3', name:'KC Hero',        role:'user'},
    {id:'U4', name:'Tony',           role:'user'},
    {id:'U5', name:'Muhammad Hafizzul', role:'user'},
  ],
  keys:[
    // pairId links a main key with its spare. createdBy tracks who added it (controls who may edit).
    // status='available' => key IS in (car parked). inSince=last check-in. totalParkedMs=prior accrued time.
    {id:'K-001', serial:'10000001', pairId:'P-001', car:'VW Beetle',           reg:'VKY1010', dealer:'SKT',   branch:'Cheras', parking:'5',        spare:false, status:'available', inSince:NOW-3*DAY,    totalParkedMs:25*DAY+19*HOUR, createdBy:'Ken Tung'},
    {id:'K-001S',serial:'10000051', pairId:'P-001', car:'VW Beetle',           reg:'VKY1010', dealer:'SKT',   branch:'Cheras', parking:'BOX',      spare:true,  status:'available', inSince:NOW-3*DAY,    totalParkedMs:25*DAY+19*HOUR, createdBy:'Ken Tung'},
    {id:'K-002', serial:'10000002', pairId:'P-002', car:'Porsche Cayenne',     reg:'VNU8192', dealer:'DDH',   branch:'Cheras', parking:'A',        spare:false, status:'available', inSince:NOW-12*HOUR,  totalParkedMs:14*DAY,         createdBy:'Ken Tung'},
    {id:'K-003', serial:'10000003', pairId:'P-003', car:'Honda Civic',         reg:'VPW9154', dealer:'DDH',   branch:'Kuchai', parking:'3-59',     spare:false, status:'available', inSince:NOW-2*DAY,    totalParkedMs:9*DAY,          createdBy:'hisham hashim'},
    {id:'K-004', serial:'10000004', pairId:'P-004', car:'BMW 320i',            reg:'WXE5757', dealer:'DDH',   branch:'Kuchai', parking:'MRT-1',    spare:false, status:'available', inSince:NOW-200*DAY,  totalParkedMs:200*DAY,        createdBy:'KC Hero'},
    {id:'K-005', serial:'10000005', pairId:'P-005', car:'Land Rover Velar HSE',reg:'UC132',   dealer:'King',  branch:'Cheras', parking:'25',       spare:false, status:'available', inSince:NOW-1*DAY,    totalParkedMs:18*DAY,         createdBy:'Ken Tung'},
    {id:'K-006', serial:'10000006', pairId:'P-006', car:'Mini Countryman',     reg:'RT234',   dealer:'Fatcar',branch:'Cheras', parking:'33A',      spare:false, status:'available', inSince:NOW-8*HOUR,   totalParkedMs:7*DAY,          createdBy:'Tony'},
    {id:'K-007', serial:'10000007', pairId:'P-007', car:'Subaru Forester',     reg:'BQG2230', dealer:'Tony',  branch:'Cheras', parking:'72',       spare:false, status:'out',       inSince:null,         totalParkedMs:11*DAY+3*HOUR,  createdBy:'Tony'},
    {id:'K-008', serial:'10000008', pairId:'P-008', car:'Volvo XC40',          reg:'VGE6161', dealer:'EXECAR',branch:'Cheras', parking:'95',       spare:false, status:'out',       inSince:null,         totalParkedMs:6*DAY,          createdBy:'KC Hero'},
    {id:'K-009', serial:'10000009', pairId:'P-009', car:'Mercedes GLC300',     reg:'VMF3445', dealer:'EXECAR',branch:'Cheras', parking:'54-A',     spare:false, status:'out',       inSince:null,         totalParkedMs:33*DAY,         createdBy:'Ken Tung'},
    {id:'K-010', serial:'10000010', pairId:'P-010', car:'Mercedes SLC300',     reg:'UT208',   dealer:'EXECAR',branch:'Kuchai', parking:'B2-15',    spare:false, status:'out',       inSince:null,         totalParkedMs:5*DAY+2*HOUR,   createdBy:'Ken Tung'},
    // Extras to give the map some color
    {id:'K-011', serial:'10000011', pairId:'P-011', car:'Toyota Camry',        reg:'WJB1188', dealer:'EXECAR',branch:'Cheras', parking:'C',        spare:false, status:'available', inSince:NOW-220*DAY,  totalParkedMs:220*DAY,        createdBy:'Ken Tung'},
    {id:'K-012', serial:'10000012', pairId:'P-012', car:'Audi A4',             reg:'VBA9099', dealer:'King',  branch:'Cheras', parking:'15',       spare:false, status:'available', inSince:NOW-14*DAY,   totalParkedMs:14*DAY,         createdBy:'Tony'},
    {id:'K-013', serial:'10000013', pairId:'P-013', car:'Lexus IS300',         reg:'PHJ4441', dealer:'Tony',  branch:'Cheras', parking:'89',       spare:false, status:'available', inSince:NOW-6*HOUR,   totalParkedMs:0,              createdBy:'KC Hero'},
    {id:'K-014', serial:'10000014', pairId:'P-014', car:'Nissan GTR',          reg:'WB888',   dealer:'EXECAR',branch:'Cheras', parking:'52',       spare:false, status:'available', inSince:NOW-30*DAY,   totalParkedMs:30*DAY,         createdBy:'Ken Tung'},
    {id:'K-015', serial:'10000015', pairId:'P-015', car:'Tesla Model 3',       reg:'EV777',   dealer:'EXECAR',branch:'Cheras', parking:'33C',      spare:false, status:'available', inSince:NOW-1*HOUR,   totalParkedMs:0,              createdBy:'Ken Tung'},
  ],
  history:[
    {ts:NOW-8*HOUR,   type:'out',      keyId:'K-009', user:'hisham hashim',       purpose:'Demo'},
    {ts:NOW-10*HOUR,  type:'in',       keyId:'K-005', user:'KC Hero',             parking:'3-51'},
    {ts:NOW-30*HOUR,  type:'out',      keyId:'K-007', user:'Tony',                purpose:'Inspection'},
    {ts:NOW-52*HOUR,  type:'in',       keyId:'K-002', user:'Muhammad Hafizzul',   parking:'KC B2-136'},
    {ts:NOW-3*DAY,    type:'transfer', keyId:'K-003', user:'Ken Tung', from:'Cheras', to:'Kuchai', note:'rebalance stock'},
  ],
};

function loadDB(){
  try { return JSON.parse(localStorage.getItem(DB_KEY)) ?? structuredClone(DEFAULT_DB); }
  catch { return structuredClone(DEFAULT_DB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

/* ---------- helpers ---------- */
const fmt = d => new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

// Parking duration ONLY counts while key is "in" (status==='available' && inSince set).
const currentParkedMs = k => (k.status==='available' && k.inSince) ? Math.max(0, Date.now() - k.inSince) : 0;
const totalParkedMs   = k => (k.totalParkedMs||0) + currentParkedMs(k);
function fmtDur(ms){
  if(!ms || ms<0) ms = 0;
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h ${m%60}m`;
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}
// Find last time key went OUT (for "Out for X" badge).
function lastOutMs(k){
  const last = db.history.find(h=>h.keyId===k.id && h.type==='out');
  return last ? Date.now() - last.ts : 0;
}

// Role + permission helpers
function isAdmin(){ return (db.user?.role || 'user') === 'admin'; }
function canEditKey(k){ return isAdmin() || (k.createdBy && k.createdBy === db.user.name); }

// 180-day aging — currently parked for over 180 days
function ageDays(k){ const ms = currentParkedMs(k); return Math.floor(ms / DAY); }
function isOver180(k){ return ageDays(k) > 180; }

// pairId generator (for new main+spare creation)
function nextPairId(){
  let max = 0;
  db.keys.forEach(k=>{
    const m = /^P-(\d+)$/.exec(k.pairId||'');
    if(m){ const n = parseInt(m[1],10); if(n>max) max = n; }
  });
  return 'P-' + String(max+1).padStart(3,'0');
}

// Main-key bay conflict check: a non-BOX bay can only hold one main key.
function bayConflictKey(bay, exceptId){
  const b = (bay||'').trim().toUpperCase();
  if(!b || b==='BOX') return null;
  return db.keys.find(k => !k.spare && k.id!==exceptId && (k.parking||'').trim().toUpperCase()===b) || null;
}
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
};
const qrPayload = k => `CARNET|${k.id}|${k.reg}|${k.dealer}`;

// Server-side QR fallback — works without any JS lib loaded. PNG image, any size.
function qrServerUrl(text, size=256){
  return `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(text)}&size=${size}x${size}&margin=0&qzone=1`;
}

// Auto-generate next serial (8 digits starting with 1: 10000001, 10000002…)
function nextSerial(){
  const max = db.keys.reduce((m,k)=>{
    const n = parseInt(k.serial||'0',10);
    return Math.max(m, isNaN(n)?0:n);
  }, 10000000);
  return String(max + 1);
}

// Display label for the serial: SK_ prefix for spare keys
function serialDisplay(k){
  const s = k.serial || '';
  return k.spare ? `SK_${s}` : s;
}

// Get a QR PNG as a data URL using whichever path works.
async function getQrDataUrl(text, size=1024){
  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try { return await QRCode.toDataURL(text, {margin:1, width:size, errorCorrectionLevel:'M'}); } catch(_){}
  }
  const resp = await fetch(qrServerUrl(text, size));
  const blob = await resp.blob();
  return await new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
function loadImg(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }

// Robust QR painter — tries the JS lib first, falls back to server-side image.
function qrInto(el, text, size=64){
  if(!el) return;
  el.innerHTML = '';
  const renderSize = Math.max(size*4, 256);

  // Always create the <img> first so something paints immediately via the API fallback.
  const img = document.createElement('img');
  img.alt = 'QR'; img.draggable = false;
  img.style.cssText = 'width:100%;height:100%;display:block;border-radius:4px;pointer-events:none;background:#fff';
  img.src = qrServerUrl(text, renderSize);              // immediate fallback render
  el.appendChild(img);

  // If the JS library is available, upgrade to a fully-local data-URL render.
  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try {
      const p = QRCode.toDataURL(text, {margin:1, width:renderSize, errorCorrectionLevel:'M', color:{dark:'#000000',light:'#FFFFFF'}});
      Promise.resolve(p).then(url=>{ img.src = url; }).catch(()=>{});
    } catch(_){}
  }
}

// Download a QR PNG — JS lib path, with server-fetch fallback.
async function downloadQR(payload, filename){
  filename = (filename||'qr')+'.png';
  // Try local generation first
  if(typeof QRCode !== 'undefined' && QRCode.toDataURL){
    try {
      const url = await QRCode.toDataURL(payload, {margin:2, width:1024, errorCorrectionLevel:'M'});
      return triggerDownload(url, filename);
    } catch(_){}
  }
  // Fallback: fetch the server-rendered PNG as a blob and save it
  try {
    const resp = await fetch(qrServerUrl(payload, 1024));
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    triggerDownload(url, filename);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){
    // Last-ditch: open the API URL in a new tab so the user can save manually
    window.open(qrServerUrl(payload, 1024), '_blank');
    toast('Opened QR in new tab — long-press to save');
  }
}
function triggerDownload(url, filename){
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Saved to downloads');
}

/* ---------- 15×30 cm printable sticker ---------- */
// Top half: QR. Bottom half: Plate · Model · Serial — three rows.
// 300 DPI: 15cm → 1772px, 30cm → 3543px.
async function downloadSticker(k){
  if(!k) return;
  toast('Building sticker…');
  const DPI = 300;
  const CM  = DPI / 2.54;
  const W   = Math.round(15 * CM);   // 1772
  const H   = Math.round(30 * CM);   // 3543

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // White background + thin outer border (cut guide)
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, W-8, H-8);

  // ---- TOP 50%: QR ----
  const halfH   = H / 2;
  const qrPadX  = W * 0.06;
  const qrPadTop= W * 0.06;
  const qrSize  = Math.min(W - qrPadX*2, halfH - qrPadTop*2);
  const qrX     = (W - qrSize) / 2;
  const qrY     = (halfH - qrSize) / 2;
  try {
    const dataUrl = await getQrDataUrl(qrPayload(k), 1400);
    const img     = await loadImg(dataUrl);
    ctx.drawImage(img, qrX, qrY, qrSize, qrSize);
  } catch(e){ toast('QR fetch failed — check internet'); return; }

  // Divider line at the half mark
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W*0.08, halfH); ctx.lineTo(W*0.92, halfH); ctx.stroke();

  // Brand strip below the divider
  ctx.fillStyle = '#0f766e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `700 ${Math.round(W*0.06)}px system-ui, -apple-system, "Segoe UI", Arial`;
  ctx.fillText('CARNET Key OS', W/2, halfH + W*0.025);

  // ---- BOTTOM 50%: three rows ----
  // Row layout: Plate (largest), Model, Serial. Evenly spaced in the lower half.
  const rowsTop   = halfH + W*0.14;            // start of text rows
  const rowsBot   = H    - W*0.07;             // padding before bottom edge
  const rowGap    = (rowsBot - rowsTop) / 3;   // 3 rows
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#0f172a';

  // Helper: draw a row with a small label + big value
  function drawRow(idx, label, value, valueFont, mono=false){
    const y = rowsTop + rowGap*idx + rowGap/2;
    ctx.fillStyle = '#64748b';
    ctx.font = `500 ${Math.round(W*0.035)}px system-ui, Arial`;
    ctx.fillText(label, W/2, y - rowGap*0.32);
    ctx.fillStyle = '#0f172a';
    ctx.font = `${valueFont} ${mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, Arial'}`;
    ctx.fillText(value, W/2, y + rowGap*0.05);
  }

  drawRow(0, 'PLATE',  k.reg || '—',         `900 ${Math.round(W*0.16)}px`);
  drawRow(1, 'MODEL',  k.car || '—',         `700 ${Math.round(W*0.09)}px`);
  drawRow(2, 'SERIAL', serialDisplay(k)||'—',`700 ${Math.round(W*0.10)}px`, true);

  // Save
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const fname = `sticker_${serialDisplay(k)}_${k.reg}.png`.replace(/[^\w.-]/g,'_');
    triggerDownload(url, fname);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

// Bulk sticker download — all keys, zipped if JSZip is present, otherwise one-by-one.
async function downloadAllStickers(){
  if(!db.keys.length){ toast('No keys'); return; }
  toast(`Building ${db.keys.length} stickers…`);
  for(const k of db.keys){
    await downloadSticker(k);
    await new Promise(r=>setTimeout(r, 350)); // small gap so browser doesn't drop downloads
  }
  toast('All stickers downloaded');
}

/* ---------- views + nav stack ---------- */
let view = 'home';
let navStack = ['home'];          // history of views, deepest last
function go(v, push=true){
  if(v === view && push) return;  // no-op
  view = v;
  if(push){
    navStack.push(v);
    history.pushState({nav:v}, '', '#'+v);
  }
  $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  // Back button visible only when we have somewhere to go back to
  $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
  render();
  window.scrollTo(0,0);
}
function goBack(){
  // If a sheet is open, close it instead
  if($('#scrim').classList.contains('open')){ closeSheet(); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));
    $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
    render();
  }
}

// Phone Back button → goBack (don't exit the app)
window.addEventListener('popstate', (e)=>{
  // If a sheet is open, just close it
  if($('#scrim')?.classList.contains('open')){ closeSheet(); history.pushState({nav:view}, '', '#'+view); return; }
  if(navStack.length > 1){
    navStack.pop();
    const prev = navStack[navStack.length-1];
    view = prev;
    $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.view===prev));
    $('#btn-back').style.display = navStack.length > 1 ? 'grid' : 'none';
    render();
  } else {
    // At root → push a new state so the next Back doesn't actually exit
    history.pushState({nav:view}, '', '#'+view);
    toast('Use ☰ menu or bottom bar to navigate');
  }
});

function render(){
  const m = $('#main');
  if(view==='home')     m.innerHTML = viewHome();
  if(view==='keys')     m.innerHTML = viewKeys();
  if(view==='scan')   { m.innerHTML = viewScan(); startScanner(); }
  if(view==='history')  m.innerHTML = viewHistory();
  if(view==='more')     m.innerHTML = viewMore();
  if(view==='map')      m.innerHTML = viewParkingMap();
  if(view==='aging')    m.innerHTML = viewAging();
  if(view==='admin')    m.innerHTML = viewAdmin();
  // Click handlers are delegated globally — no rebinding needed on render.
  // Paint QR codes for visible cards + wire QR-tap → 15×30cm sticker download.
  $$('.qrwrap[data-payload]').forEach(el=>{
    try {
      qrInto(el, el.dataset.payload, 64);
      el.style.cursor = 'pointer';
      el.title = 'Tap to download 15×30 cm sticker';
      el.addEventListener('click', ev=>{
        ev.stopPropagation();
        const payload = el.dataset.payload || '';
        const parts = payload.split('|');
        if(parts[0]==='CARNET'){
          // Find the key and download the full sticker
          const id = parts[1];
          const k  = db.keys.find(x=>x.id===id);
          if(k) downloadSticker(k); else downloadQR(payload, id);
        } else if(parts[0]==='USER'){
          // For user QR, plain PNG is more useful than a sticker
          downloadQR(payload, `user_${parts[1]||''}`);
        } else {
          downloadQR(payload, 'qr');
        }
      });
    } catch(e){ console.error('QR paint failed', e); el.textContent = '⚠'; }
  });
}

function viewHistory(){
  const items = db.history.slice().filter(h=>{
    if(mvFilter==='out'        && h.type!=='out') return false;
    if(mvFilter==='in'         && h.type!=='in')  return false;
    if(mvFilter==='transfer'   && h.type!=='transfer') return false;
    if(mvFilter==='deleted'    && h.type!=='deleted') return false;
    if(mvFilter==='sold'       && !(h.type==='deleted' && (h.purpose||'').toLowerCase().includes('sold'))) return false;
    if(mvFilter==='warmup'     && !((h.purpose||'').toLowerCase().includes('warm'))) return false;
    if(mvFilter==='inspection' && !((h.purpose||'').toLowerCase().includes('inspect'))) return false;
    if(mvFilter==='180d'){
      const k = db.keys.find(x=>x.id===h.keyId); if(!k || !isOver180(k)) return false;
    }
    if(mvFilter==='forced'   && !h.forced) return false;
    if(mvFilter==='today'    && (Date.now()-h.ts) > 86400000) return false;
    if(mvFilter==='week'     && (Date.now()-h.ts) > 7*86400000) return false;
    return true;
  }).sort((a,b)=>b.ts-a.ts);
  const chips = [
    ['all','All'], ['in','Key In'], ['out','Key Out'], ['transfer','Transfer'],
    ['sold','Sold'], ['warmup','Warm Up'], ['inspection','Inspection'], ['180d','>180d'],
    ['forced','Forced'], ['deleted','Deleted'], ['today','Today'], ['week','7 days'],
  ];
  return `
    <div class="filters">
      ${chips.map(([v,l])=>`<button class="chip ${mvFilter===v?'active':''}" data-fmv="${v}">${l}</button>`).join('')}
    </div>
    <div class="card pad">
      <div class="row">
        <div class="field"><label>From</label><input id="hf" type="date"></div>
        <div class="field"><label>To</label><input id="ht" type="date"></div>
      </div>
      <button class="btn block" id="export-history">Export CSV (${items.length})</button>
    </div>
    ${items.map(renderMv).join('') || '<div class="empty">No history matches this filter</div>'}
  `;
}

function doBulkOut(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }
  // Single purpose picker, applied to all
  openSheet(`
    <h3>Bulk Key Out · ${ids.length} key${ids.length>1?'s':''}</h3>
    <div class="muted" style="margin-bottom:10px">Pick a purpose to apply to every selected key.</div>
    <div class="filters" style="flex-wrap:wrap">
      ${db.purposes.map(p=>`<button class="chip" data-bp="${encodeURIComponent(p)}" style="${p==='Sold/Delivered'?'background:#dc2626;color:#fff;border-color:#dc2626':''}">${p==='Sold/Delivered'?'⚠ ':''}${p}</button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="field"><label>Or custom</label><input id="bp-custom" placeholder="e.g., showroom"></div>
    <button class="btn block" id="bp-go">Apply custom</button>
  `);
  const apply = (purpose)=>{
    if(purpose==='Sold/Delivered' && !confirm(`Sold/Delivered will DELETE ${ids.length} keys + their spares. Continue?`)) return;
    let removed=0, outted=0;
    ids.forEach(id=>{
      const k = db.keys.find(x=>x.id===id); if(!k) return;
      if(purpose==='Sold/Delivered'){
        const pair = db.keys.filter(x=>x.pairId && x.pairId===k.pairId);
        pair.forEach(p=>{
          db.history.unshift({ts:Date.now(), type:'deleted', keyId:p.id, user:db.user.name, purpose:'Sold/Delivered', snapshot:{...p}});
        });
        db.keys = db.keys.filter(x => !pair.find(p=>p.id===x.id));
        removed += pair.length;
      } else {
        if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
        k.inSince = null; k.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose});
        outted++;
      }
    });
    bulkSel.clear(); saveDB(); closeSheet(); render();
    toast(purpose==='Sold/Delivered' ? `Removed ${removed}` : `Checked out ${outted}`);
  };
  $$('[data-bp]').forEach(b=>b.addEventListener('click', ()=>apply(decodeURIComponent(b.dataset.bp))));
  $('#bp-go').onclick = ()=>{ const v = $('#bp-custom').value.trim(); if(!v){ toast('Type a purpose'); return; } apply(v); };
}

function doBulkIn(){
  const ids = [...bulkSel];
  if(!ids.length){ toast('Select keys first'); return; }
  if(!confirm(`Check in ${ids.length} key${ids.length>1?'s':''}? Spares go to BOX; main keys return to their last bay.`)) return;
  let done=0;
  ids.forEach(id=>{
    const k = db.keys.find(x=>x.id===id); if(!k) return;
    if(k.status==='available') return;
    const parking = k.spare ? 'BOX' : (k.parking||'BOX');
    k.status = 'available'; k.inSince = Date.now(); k.parking = parking;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking});
    done++;
  });
  bulkSel.clear(); saveDB(); render(); toast(`Checked in ${done}`);
}

      const lines = String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      const head = lines.shift().toLowerCase().split(',').map(s=>s.trim());
      const ix = n=>head.indexOf(n);
      const rows = lines.map(l=>{ const p=l.split(','); return {reg:p[ix('plate')], car:p[ix('car')], branch:p[ix('branch')], dealer:p[ix('dealer')]||db.user.dealer, bay:p[ix('bay')]||'', mode:(p[ix('type')]||'pair').toLowerCase()};});
      runBulkAdd(rows);
      closeSheet();
    };
    r.readAsText(f);
  });
}

function runBulkAdd(rows){
  let created = 0, skipped = 0;
  rows.forEach(row=>{
    if(!row.reg || !row.car){ skipped++; return; }
    if(row.branch && !db.branches.includes(row.branch)) db.branches.push(row.branch);
    if(row.dealer && !db.dealers.includes(row.dealer)) db.dealers.push(row.dealer);
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1+created).padStart(3,'0');
    const common = { car:row.car, reg:row.reg.toUpperCase(), dealer:row.dealer, branch:row.branch||db.user.branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };
    const toAdd = [];
    if(row.mode==='main' || row.mode==='pair'){
      toAdd.push({...common, id:baseId, serial:nextSerial(), parking:row.bay||'', spare:false});
    }
    if(row.mode==='spare' || row.mode==='pair'){
      const tmp = [...db.keys, ...toAdd];
      const max = tmp.reduce((m,k)=>{ const n=parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      toAdd.push({...common, id:baseId+'S', serial:String(max+1), parking:'BOX', spare:true});
    }
    db.keys.unshift(...toAdd); created += toAdd.length;
  });
  saveDB(); render(); toast(`Added ${created}${skipped?', skipped '+skipped:''}`);
}

// ====== Cheras spatial layout (matches the showroom map PDF) ======
// Each entry: id, x, y, w, h, optional rotation/note
function CHERAS_BAYS(){
  const bays = [];
  // Left column 1-18 (bottom to top in PDF; small narrow boxes)
  // We render top→bottom in SVG, so y increases downward. 18 at top of group, 1 at bottom.
  const L = 24, BW = 70, BH = 26;
  // 1..18 (rendered y=900 down to y=460 roughly) — actually the LEFT column 1-18 is at the BOTTOM half of the PDF
  // Re-reading PDF: left edge has 32 at top, going down to 1 at bottom. 17-19 are Photo/Demo (blue).
  for(let i=32; i>=1; i--){
    const idx = 32 - i;                  // 0..31, top to bottom
    bays.push({id:String(i), x:L, y:60+idx*(BH+1), w:BW, h:BH, photo:(i>=17 && i<=19)});
  }
  // Top center: 33 single (top-left of CARNET booth area)
  bays.push({id:'33', x:215, y:18, w:60, h:38});
  // Top center: 34 single
  bays.push({id:'34', x:300, y:18, w:120, h:38});
  // Top right: 37, 38 (pair)
  bays.push({id:'37', x:560, y:18, w:50, h:80});
  bays.push({id:'38', x:615, y:18, w:50, h:80});
  // 33 A-F (center vertical column, left of CARNET booth)
  ['33A','33B','33C','33D','33E','33F'].forEach((id,i)=>{
    bays.push({id, x:215, y:75+i*55, w:50, h:50});
  });
  // 70-79 column (left of EXIT)
  for(let i=0;i<10;i++){
    const id = String(79-i);
    bays.push({id, x:295, y:430+i*36, w:65, h:32});
  }
  // 88-97 column (right of EXIT)
  for(let i=0;i<10;i++){
    const id = String(97-i);
    bays.push({id, x:385, y:430+i*36, w:65, h:32});
  }
  // Right top A-O grid (5 cols × 3 rows, with gap between columns 2 and 3)
  const COLS = ['A','B','C','D','E'];
  // Row 1: A B C D E ; Row 2: F G H I J ; Row 3: K L M N O
  const RG = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
  for(let r=0;r<3;r++){
    for(let c=0;c<5;c++){
      // gap after col 2
      const xGap = c>=2 ? 18 : 0;
      bays.push({id: RG[r*5+c], x:540 + c*40 + xGap, y:160 + r*60, w:36, h:50});
    }
  }
  // 106 A-C (right middle, stacked)
  ['106-A','106-B','106-C'].forEach((id,i)=>{
    bays.push({id, x:540, y:360+i*30, w:70, h:28});
  });
  // Customer 51-53 (right, red-highlighted)
  ['51','52','53'].forEach((id,i)=>{
    bays.push({id, x:690, y:460+i*32, w:60, h:30, customer:true});
  });
  // 54-59 A/B pairs
  for(let r=0;r<6;r++){
    const n = 54+r;
    bays.push({id:`${n}-A`, x:625, y:560+r*36, w:60, h:32});
    bays.push({id:`${n}-B`, x:690, y:560+r*36, w:60, h:32});
  }
  return bays;
}

// Look up the key parked in a given bay (if any) for the current branch view.

  return db.keys.find(k=>!k.spare && (k.branch===branch) && (k.parking||'').toUpperCase()===bayId.toUpperCase());

        <span style="display:inline-block;width:10px;height:10px;background:#fff4d6;border:1px solid #f59e0b;vertical-align:middle"></span> &gt;180d &nbsp;
        <span style="display:inline-block;width:10px;height:10px;background:#fee2e2;border:1px solid #dc2626;vertical-align:middle"></span> key out &nbsp;
        <span style="display:inline-block;width:10px;height:10px;background:#e5e7eb;border:1px solid #9ca3af;vertical-align:middle"></span> empty
      </div>
    `;
  }

  // Fallback grid for Kuchai / other branches
  const byBranch = {};
  db.keys.filter(k=>!k.spare).forEach(k=>{
    const b = k.branch || '—';
    (byBranch[b] = byBranch[b] || []).push(k);
  });
  const keysHere = (byBranch[showBranch]||[]).slice().sort((a,b)=>(a.parking||'').localeCompare(b.parking||''));

  // Render a tile per bay
  const tiles = keysHere.map(k=>{
    const occupied = k.status==='available';
    const over180  = isOver180(k);
    const bg = occupied ? (over180?'#fef3c7':'#dcfce7') : '#fee2e2';
    const fg = occupied ? (over180?'#78350f':'#166534') : '#7f1d1d';
    return `<div class="key-card" data-id="${k.id}" data-bay-tile="${encodeURIComponent(k.parking||'')}" style="grid-column:span 1;flex-direction:column;display:flex;align-items:flex-start;background:${bg};border-color:${fg}55;padding:10px;position:relative">

      <div style="font-family:ui-monospace,Menlo,monospace;font-weight:800;color:${fg};font-size:13px">📍 ${k.parking||'—'}</div>
      <div style="font-weight:700;font-size:13px;margin-top:4px">${k.car}</div>
      <div class="muted" style="font-size:11px">${k.reg} · ${occupied? '⏱ '+fmtDur(currentParkedMs(k)) : '↑ OUT'}</div>
      ${over180?'<div style="font-size:10.5px;color:#78350f;margin-top:4px;font-weight:700">⚠ &gt;180d</div>':''}
    </div>`;
  }).join('');

  const editToolbar = isAdmin() ? `
    <div class="card pad" style="display:flex;gap:8px;align-items:center;background:${mapEditMode?'#fef3c7':'var(--card)'}">
      <div style="flex:1;font-weight:700">${mapEditMode?'Edit mode ON — tap ✎ on a tile to rename / move':'Map view'}</div>
      <button class="btn ${mapEditMode?'btn-out':'secondary'}" id="map-edit-toggle">${mapEditMode?'Exit edit':'✎ Edit bays'}</button>
    </div>` : '';

  return `
    <div class="filters">${branchChips}</div>
    ${editToolbar}
    <div class="muted" style="font-size:12px;padding:0 4px 8px">Green = parked · Yellow = parked &gt;180d · Red = key out. Tap a bay to open its key.</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${tiles}</div>
  `;
}

function openEditBay(k){
  if(!isAdmin()){ toast('Admin only'); return; }
  openSheet(`
    <h3>Edit bay for ${k.car}</h3>
    <div class="muted" style="margin-bottom:10px">${k.reg} · current bay: <b>${k.parking||'—'}</b></div>
    <div class="field"><label>New bay number</label><input id="eb-bay" value="${k.parking||''}"></div>
    <div class="row">
      <button class="btn-in btn" id="eb-save">Save</button>
      <button class="btn-out btn" id="eb-clear">Clear (set OUT)</button>
    </div>
  `);
  $('#eb-save').onclick = ()=>{
    const v = $('#eb-bay').value.trim(); if(!v){ toast('Need bay'); return; }
    const conflict = bayConflictKey(v, k.id);
    if(conflict){
      if(!confirm(`Bay ${v} held by ${conflict.reg} — force replace?`)) return;
      if(conflict.inSince){ conflict.totalParkedMs=(conflict.totalParkedMs||0)+(Date.now()-conflict.inSince); }
      conflict.inSince=null; conflict.status='out';
      db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'admin moved bay', forced:true});
    }
    k.parking = v;
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:v, forced:!!conflict});
    saveDB(); closeSheet(); render(); toast('Bay updated');
  };
  $('#eb-clear').onclick = ()=>{
    if(k.inSince){ k.totalParkedMs=(k.totalParkedMs||0)+(Date.now()-k.inSince); }
    k.inSince=null; k.status='out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose:'admin cleared bay', forced:true});
    saveDB(); closeSheet(); render(); toast('Bay cleared');
  };
}

/* ---------- bindings via event delegation (wired ONCE at script init) ---------- */
function bindDynamic(){ /* no-op kept for backward compat */ }

function installDelegatedHandlers(){
  const main = $('#main');

  // --- clicks ---
  main.addEventListener('click', (e)=>{
    const t = e.target;
    // helper
    const hit = (sel) => t.closest(sel);

    // Dashboard (Home) — stat tile shortcuts
    const stat = hit('[data-stat]');
    if(stat){
      const s = stat.dataset.stat;
      if(s==='avail')  { keysFilter={q:'',status:'available',spare:'main', branch:homeBranch};  go('keys'); }
      if(s==='spare')  { keysFilter={q:'',status:'available',spare:'spare',branch:homeBranch};  go('keys'); }
      if(s==='outnow') { keysFilter={q:'',status:'out',      spare:'all',  branch:homeBranch};  go('keys'); }
      if(s==='out30')  { mvFilter='out'; go('history'); }
      if(s==='aging')  { go('aging'); }
      return;
    }
    // Home branch filter chips
    const chipBr = hit('.chip[data-fbr]'); if(chipBr){ homeBranch = chipBr.dataset.fbr; render(); return; }
    if(hit('#qa-out')){ openHomeKeyAction('out'); return; }
    if(hit('#qa-in')) { openHomeKeyAction('in');  return; }
    if(hit('#qa-transfer')){ openQuickTransfer(); return; }
    if(hit('#go-history')){ go('history'); return; }

    // Keys list
    if(hit('#add-key')){ openAddKey(); return; }
    if(hit('#export-all')){ exportKeysCSV(); return; }
    if(hit('#bulk-toggle')){ bulkMode = !bulkMode; bulkSel.clear(); render(); return; }
    if(hit('#bulk-out')){ doBulkOut(); return; }
    if(hit('#bulk-in')){  doBulkIn();  return; }
    const chipFs = hit('.chip[data-fs]'); if(chipFs){ keysFilter.status = chipFs.dataset.fs; render(); return; }
    const chipFp = hit('.chip[data-fp]'); if(chipFp){ keysFilter.spare  = chipFp.dataset.fp; render(); return; }
    const chipFbk= hit('.chip[data-fbk]');if(chipFbk){ keysFilter.branch = chipFbk.dataset.fbk; render(); return; }

    // Recent-activity filter chips (Home)
    const chipMv = hit('.chip[data-fmv]'); if(chipMv){ mvFilter = chipMv.dataset.fmv; render(); return; }

    // Movement row → open the key profile
    const mv = hit('.mv[data-key-id]');
    if(mv){
      const id = mv.dataset.keyId;
      if(id) openKey(id);
      return;
    }

    // Key card → key profile (or toggle in bulk mode)
    const card = hit('.key-card[data-id]');
    if(card){
      const id = card.dataset.id;
      if(bulkMode && card.dataset.bulk){
        if(bulkSel.has(id)) bulkSel.delete(id); else bulkSel.add(id);
        render();
      } else {
        openKey(id);
      }
      return;
    }

    // Scan view — manual lookup
    if(hit('#scan-manual-go')){ runManualLookup(); return; }

    // History view buttons
    if(hit('#export-history')){ exportHistoryCSV(); return; }

    // More view buttons
    if(hit('#show-myqr')){ showMyQR(); return; }
    if(hit('#branch-hub')){ openBranchHub(); return; }
    if(hit('#export-keys-csv')){ exportKeysCSV(); return; }
    if(hit('#export-keys-json')){ exportJSON(); return; }
    if(hit('#export-history-csv')){ exportHistoryCSV(); return; }
    if(hit('#export-aging-csv')){ exportAgingCSV(); return; }
    if(hit('#dl-all-stickers')){ downloadAllStickers(); return; }

    // Map editing
    if(hit('#map-edit-toggle')){ mapEditMode = !mapEditMode; render(); return; }
    const editBay = hit('[data-edit-bay]');
    if(editBay){
      ev_stop(e);
      const k = db.keys.find(x=>x.id===editBay.dataset.editBay); if(k) openEditBay(k);
      return;
    }
    // Empty bay tile on Cheras SVG map — admin can assign a key here
    const emptyBay = hit('[data-empty-bay]');
    if(emptyBay){ openAssignEmptyBay(emptyBay.dataset.emptyBay, 'Cheras'); return; }
    // SVG bay group with key
    const svgBay = hit('g.bay[data-id]');
    if(svgBay){ openKey(svgBay.dataset.id); return; }
    // Admin dashboard buttons
    if(hit('#admin-users')){ openManageUsers(); return; }
    if(hit('#admin-purposes')){ openManagePurposes(); return; }
    if(hit('#admin-branches')){ openManageBranches(); return; }
    if(hit('#admin-dealers')){ openManageDealers(); return; }
    if(hit('#bulk-add')){ openBulkAdd(); return; }
    if(hit('#bulk-mode')){ bulkMode = !bulkMode; bulkSel.clear(); go('keys'); return; }
    const goBtn = hit('[data-go]'); if(goBtn){ go(goBtn.dataset.go); return; }
    if(hit('#wipe')){
      if(confirm('Reset all data back to the demo set?')){ db = structuredClone(DEFAULT_DB); saveDB(); render(); toast('Reset done'); }
      return;
    }
  });

  // --- input (search boxes) ---
  main.addEventListener('input', (e)=>{
    if(e.target.id === 'kq'){
      keysFilter.q = e.target.value;
      const v = e.target.value; render();
      const box = $('#kq');
      if(box){ box.focus(); box.value = v; box.setSelectionRange(v.length, v.length); }
    }
    if(e.target.id === 'hq'){
      homeQuery = e.target.value;
    }
  });
  // Home search: Enter → jump to Keys with query pre-filled
  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'hq' && e.key === 'Enter'){
      e.preventDefault();
      keysFilter = { q:homeQuery, status:'all', spare:'all', branch:homeBranch };
      go('keys');
    }
  });

  // --- file pickers (delegated change) ---
  main.addEventListener('change', (e)=>{
    if(e.target.id === 'scan-file' || e.target.id === 'scan-cam') return scanFromFile(e);
    if(e.target.id === 'import-file') return importFile(e);
  });

  // --- Enter key in the manual scan box ---
  main.addEventListener('keydown', (e)=>{
    if(e.target.id === 'scan-manual' && e.key === 'Enter'){
      e.preventDefault(); runManualLookup();
    }
  });
}

/* ---------- key actions ---------- */
function openKey(id){
  const k = db.keys.find(k=>k.id===id); if(!k) return;
  const moves = db.history.filter(h=>h.keyId===id).sort((a,b)=>b.ts-a.ts);
  const parkedNow = currentParkedMs(k);
  openSheet(`
    <h3>${k.car}</h3>
    <div class="muted" style="margin-bottom:8px">${k.reg} · ${k.branch||k.dealer} · 📍 ${k.parking}</div>
    <div class="qr-big"><div class="qrwrap" data-payload="${qrPayload(k)}" style="width:240px;height:240px;border:0"></div></div>
    <div class="qr-caption">Serial: <b>${serialDisplay(k)}</b></div>
    <button class="btn ghost block" id="sh-dlsticker" style="margin-top:8px">⤓ Download Sticker 15×30 cm</button>
    <div class="gap"></div>

    <div class="stats">
      <div class="stat brand"><div class="v">${fmtDur(totalParkedMs(k))}</div><div class="l">Total parking time</div></div>
      <div class="stat ${k.status==='available'?'info':'bad'}">
        <div class="v">${k.status==='available' ? fmtDur(parkedNow) : fmtDur(lastOutMs(k))}</div>
        <div class="l">${k.status==='available' ? 'Currently parked' : 'Currently out'}</div>
      </div>
    </div>
    <div class="gap"></div>

    <div class="row">
      <button class="btn ${k.status==='available'?'btn-out':'btn-force'}" id="sh-out">Key Out</button>
      <button class="btn ${k.status==='out'?'btn-in':'btn-force'}" id="sh-in">Key In</button>
    </div>
    <div class="gap"></div>
    <div class="row">
      ${canEditKey(k) ? `<button class="btn ghost" id="sh-edit">Edit details</button>` : ''}
      ${isAdmin() ? `<button class="btn ghost" id="sh-transfer">Transfer branch</button>` : ''}
    </div>
    <div class="muted" style="font-size:12px;margin-top:4px">Created by ${k.createdBy||'—'}${!canEditKey(k)?' · only the creator or admin may edit':''}</div>
    <div class="gap"></div>

    <h3 style="font-size:14px;margin:8px 0">Movement history <span class="muted" style="font-weight:400">(${moves.length})</span></h3>
    ${moves.length ? moves.map(renderMv).join('') : '<div class="muted">No moves yet</div>'}
    <div class="gap"></div>
    ${isAdmin() ? `<button class="btn danger block" id="sh-del">Delete key</button>` : ''}
  `);
  // Re-paint the big QR
  const big = $('.qr-big .qrwrap'); if(big){ qrInto(big, qrPayload(k), 240); big.style.cssText='width:240px;height:240px;border:0'; }
  $('#sh-out').onclick       = ()=>{
    if(k.status === 'out'){
      if(!confirm(`Force replace?\n${k.reg} is already OUT — last user may have forgotten to Key In.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markOut(k);
  };
  $('#sh-in').onclick        = ()=>{
    if(k.status === 'available'){
      if(!confirm(`Force replace?\n${k.reg} is already parked at ${k.parking||'—'} — last user may have forgotten to Key Out.\nThis action will be recorded as FORCED in history.`)) return;
    }
    markIn(k);  closeSheet();
  };
  if($('#sh-edit'))      $('#sh-edit').onclick     = ()=>openAddKey(k);
  if($('#sh-transfer'))  $('#sh-transfer').onclick = ()=>openTransfer(k);
  $('#sh-dlsticker').onclick = ()=>downloadSticker(k);
  if($('#sh-del')) $('#sh-del').onclick = ()=>{
    if(!confirm(`Delete ${k.reg}? This will be logged in history.`)) return;
    db.history.unshift({ts:Date.now(), type:'deleted', keyId:k.id, user:db.user.name, snapshot:{...k}});
    db.keys = db.keys.filter(x=>x.id!==k.id);
    saveDB(); closeSheet(); render(); toast('Deleted');
  };
}

function markOut(k){
  openPurposeSheet(k, purpose=>{
    if(!purpose) return;
    if(purpose === 'Sold/Delivered'){
      // Remove main + paired spare(s)
      const ids = db.keys.filter(x => x.pairId && x.pairId===k.pairId).map(x=>x.id);
      const targets = ids.length ? ids : [k.id];
      targets.forEach(id=>{
        const t = db.keys.find(x=>x.id===id);
        db.history.unshift({ts:Date.now(), type:'deleted', keyId:id, user:db.user.name, purpose:'Sold/Delivered', snapshot:t ? {...t} : null});
      });
      db.keys = db.keys.filter(x => !targets.includes(x.id));
      saveDB(); render(); closeSheet(); toast(`${k.reg} sold — ${targets.length} key${targets.length>1?'s':''} removed`);
      return;
    }
    // Normal key-out path (mark FORCED if key was already out — last user forgot to check in)
    const forced = (k.status==='out');
    if(k.inSince){ k.totalParkedMs = (k.totalParkedMs||0) + (Date.now() - k.inSince); }
    k.inSince = null;
    k.status  = 'out';
    db.history.unshift({ts:Date.now(), type:'out', keyId:k.id, user:db.user.name, purpose, forced});
    saveDB(); render(); closeSheet(); toast(`${k.reg} checked out${forced?' (FORCED)':''}`);
  });
}

// Purpose picker — predefined list with "+ Custom" entry (open to all)
// Admin can manage the predefined list in Admin Dashboard.
function openPurposeSheet(k, cb){
  const list = db.purposes || [];
  openSheet(`
    <h3>Key Out — ${k.car}</h3>

      ${list.map(p=>`<button class="chip" data-purp="${encodeURIComponent(p)}" style="${p==='Sold/Delivered'?'background:#dc2626;color:#fff;border-color:#dc2626':''}">${p==='Sold/Delivered'?'⚠ ':''}${p}</button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="field"><label>Or type a custom purpose</label>
      <input id="p-custom" placeholder="e.g., showroom display">
    </div>
    <button class="btn block" id="p-go">Use custom purpose</button>
  `);
  $$('[data-purp]').forEach(b=>b.addEventListener('click', ()=>{
    const purpose = decodeURIComponent(b.dataset.purp);
    if(purpose === 'Sold/Delivered'){
      if(!confirm(`This will DELETE the main key and any paired spare for ${k.reg}. Continue?`)) return;

}
function markIn(k){
  // Spare keys always return to BOX
  if(k.spare){
    k.status='available'; k.inSince=Date.now(); k.parking='BOX';
    db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:'BOX'});
    saveDB(); render(); toast(`${k.reg} (spare) returned to BOX`);
    return;
  }
  openKeyInSheet(k);
}

// Branch → bay picker with force-replace warning + type-search + previous bay reconfirm
function openKeyInSheet(k){
  const initBranch = k.branch || db.user.branch;
  // Default to the last bay this key was at — the user can reconfirm with one tap.
  let chosen = { branch: initBranch, bay: k.parking || '' };
  let bayQuery = '';

  function renderSheet(){
    const allBays = [...new Set(db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.parking && x.parking.toUpperCase()!=='BOX').map(x=>x.parking))].sort();
    const occupiedBy = {};
    db.keys.filter(x=>!x.spare && x.branch===chosen.branch && x.id!==k.id && x.status==='available').forEach(x=>{
      occupiedBy[x.parking] = x;
    });
    // Filter by type-search query
    const Q = bayQuery.trim().toLowerCase();
    const bays = Q ? allBays.filter(b => b.toLowerCase().includes(Q)) : allBays;

    const lastBay = k.parking || '';
    const lastBayConflict = lastBay ? occupiedBy[lastBay] : null;

    openSheet(`
      <h3 style="display:flex;align-items:center;gap:8px"><span class="btn-in" style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.6px">KEY IN</span> ${k.car}</h3>
      <div class="muted" style="margin-bottom:10px">${k.reg} · last branch: ${k.branch||'—'}</div>

      ${lastBay ? `
        <div class="card pad" style="background:#fff4d6;border-color:#fde68a;margin-bottom:10px">
          <div style="font-size:12px;color:#7a4a00;font-weight:700;letter-spacing:.4px">LAST CHECKED OUT FROM</div>
          <div style="font-size:22px;font-weight:900;font-family:ui-monospace,Menlo,monospace;margin:4px 0">📍 ${lastBay}</div>
          <button class="btn-in btn block" id="ki-reuse">Re-confirm bay ${lastBay}${lastBayConflict?` (⚠ now held by ${lastBayConflict.reg})`:''}</button>
        </div>
      `:''}

      <div class="field"><label>Branch</label>
        <select id="ki-branch">${db.branches.map(b=>`<option ${b===chosen.branch?'selected':''}>${b}</option>`).join('')}</select>
      </div>

      <div class="field"><label>Or pick a different bay</label>
        <div class="search" style="margin-bottom:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="ki-search" placeholder="Search bay number…" value="${bayQuery}">
        </div>
        <div class="filters" style="flex-wrap:wrap;padding-bottom:0;max-height:200px;overflow:auto">
          ${bays.length ? bays.map(b=>{
            const occ = occupiedBy[b];
            const since = occ ? lastInDays(occ) : 0;
            return `<button class="chip" data-ki-bay="${encodeURIComponent(b)}" style="${chosen.bay===b?'background:var(--brand);color:#fff;border-color:var(--brand);':occ?'background:#fee2e2;color:#991b1b;border-color:#fca5a5':'background:#dcfce7;color:#0a7d2b;border-color:#86efac'}">${b}${occ?` · <span style="font-size:10px">⚠ ${occ.reg} (${since}d)</span>`:' · ✓'}</button>`;
          }).join('') : '<div class="muted" style="font-size:12px;padding:4px">No matching bays</div>'}
        </div>
        <div class="muted" style="font-size:11px;margin-top:6px">Green = free · Red = occupied (will need force-replace)</div>
      </div>

      <div class="field"><label>Or type a brand-new bay</label>
        <input id="ki-bay-text" placeholder="e.g. 3-22" value="${chosen.bay}">
      </div>

      <button class="btn-in btn block" id="ki-go" style="padding:14px;font-size:15px">Check in to <span id="ki-go-label">${chosen.bay||'—'}</span></button>
    `);

    $('#ki-reuse')?.addEventListener('click', ()=>{
      chosen.bay = lastBay;
      $('#ki-go').click();
    });
    $('#ki-branch').addEventListener('change', e=>{ chosen.branch = e.target.value; chosen.bay=''; renderSheet(); });
    $('#ki-search').addEventListener('input', e=>{ bayQuery = e.target.value; renderSheet(); setTimeout(()=>{$('#ki-search')?.focus(); $('#ki-search').setSelectionRange(bayQuery.length, bayQuery.length);}, 0); });
    $$('[data-ki-bay]').forEach(b=>b.addEventListener('click', ()=>{
      chosen.bay = decodeURIComponent(b.dataset.kiBay);
      $('#ki-bay-text').value = chosen.bay;
      $('#ki-go-label').textContent = chosen.bay;
    }));
    $('#ki-bay-text').addEventListener('input', e=>{
      chosen.bay = e.target.value.trim();
      $('#ki-go-label').textContent = chosen.bay || '—';
    });
    $('#ki-go').onclick = ()=>{
      const bay = ($('#ki-bay-text').value||'').trim() || chosen.bay;
      if(!bay){ toast('Pick or type a bay'); return; }
      const conflict = bayConflictKey(bay, k.id);
      if(conflict){
        const days = lastInDays(conflict);
        if(!confirm(`Bay ${bay} is held by ${conflict.reg} (checked in ${days}d ago).\n\nForce replace?\n• ${conflict.reg} will be auto-checked-out\n• Both actions recorded as FORCED in history`)) return;
        // Force checkout the previous holder
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay claimed)', forced:true});
      }
      k.status = 'available'; k.inSince = Date.now(); k.branch = chosen.branch; k.parking = bay;
      db.history.unshift({ts:Date.now(), type:'in', keyId:k.id, user:db.user.name, parking:bay, forced:!!conflict});
      saveDB(); closeSheet(); render(); toast(`${k.reg} checked in @ ${bay}${conflict?' (forced)':''}`);
    };
  }
  renderSheet();
}

// How many days since this key's last check-in
function lastInDays(k){
  if(k.inSince) return Math.floor((Date.now() - k.inSince)/DAY);
  const last = db.history.find(h=>h.keyId===k.id && h.type==='in');
  return last ? Math.floor((Date.now() - last.ts)/DAY) : 0;
}

      <input id="f-parking" value="${k.parking}" placeholder="or type a new bay" ${isAdmin()?'':'disabled style="background:var(--hover)"'} style="margin-top:6px">
      <div id="f-bay-warn" class="muted" style="font-size:11px;margin-top:4px">1 bay = 1 main key. Spares always go to BOX.</div>
    </div>
    ${existing ? `
      <div class="field"><label>Key type</label>
        <select id="f-spare"><option value="false" ${!k.spare?'selected':''}>Main key</option><option value="true" ${k.spare?'selected':''}>Spare key (SK_)</option></select>
      </div>
    ` : `
      <div class="field"><label>What to create</label>
        <select id="f-create">
          <option value="main">Main key only</option>
          <option value="pair" selected>Main + Spare (auto-paired)</option>
          <option value="spare">Spare key only</option>
        </select>
      </div>
    `}
    <input id="f-id" type="hidden" value="${k.id}">
    <div class="muted" style="font-size:12px;margin-bottom:8px">Sticker label preview: <b id="f-preview">${k.spare?'SK_':''}${k.serial||''}</b></div>
    <button class="btn block" id="f-save">${existing?'Save changes':'Create'}</button>
  `);

  // Live-preview when toggling spare in edit mode
  $('#f-spare')?.addEventListener('change', e=>{
    const isSpare = e.target.value==='true';
    $('#f-preview').textContent = (isSpare?'SK_':'') + ($('#f-serial').value || '');
  });
  $('#f-create')?.addEventListener('change', e=>{
    const v = e.target.value;
    $('#f-preview').textContent = (v==='spare'?'SK_':'') + ($('#f-serial').value || '') + (v==='pair'?' + SK_':'');
    $('#f-parking').disabled = (v==='spare') || !isAdmin();
    $('#f-parking-sel').disabled = (v==='spare') || !isAdmin();
  });

  // Populate bay select based on chosen branch (occupied bays styled red, free bays green)
  function refreshBays(){
    const branch = $('#f-branch').value;
    const sel = $('#f-parking-sel');
    const bays = [...new Set(db.keys.filter(x=>!x.spare && x.branch===branch && x.parking && x.parking.toUpperCase()!=='BOX').map(x=>x.parking))].sort();
    sel.innerHTML = '<option value="">— Pick or type new —</option>' + bays.map(b=>{
      const occ = bayConflictKey(b, k.id);
      const days = occ ? lastInDays(occ) : 0;
      const label = occ ? `${b} ⚠ occupied by ${occ.reg} (${days}d)` : `${b} ✓ free`;
      return `<option value="${b}">${label}</option>`;
    }).join('');
  }
  refreshBays();
  $('#f-branch').addEventListener('change', refreshBays);
  $('#f-parking-sel').addEventListener('change', e=>{
    if(e.target.value){
      $('#f-parking').value = e.target.value;
      const occ = bayConflictKey(e.target.value, k.id);
      $('#f-bay-warn').innerHTML = occ
        ? `<span style="color:#991b1b;font-weight:700">⚠ Bay occupied by ${occ.reg}. You can still save — the new entry will be marked <b>FORCED</b> and the old key auto-checked-out.</span>`
        : '1 bay = 1 main key. Spares always go to BOX.';
    }
  });
  $('#f-newdealer')?.addEventListener('click', e=>{
    e.preventDefault();
    const v = prompt('New dealer name:');
    if(v && v.trim()){
      db.dealers.push(v.trim()); saveDB();
      const opt = document.createElement('option'); opt.textContent=v.trim(); opt.selected=true;
      $('#f-dealer').appendChild(opt);
    }
  });

  $('#f-save').onclick = ()=>{
    const car = $('#f-car').value.trim();
    const reg = $('#f-reg').value.trim().toUpperCase();
    const dealer  = $('#f-dealer').value.trim();
    const branch  = $('#f-branch').value;
    const parking = $('#f-parking').value.trim();
    if(!car || !reg){ toast('Need car + registration'); return; }

    if(existing){
      const spare = $('#f-spare').value === 'true';
      if(!spare){
        const conflict = bayConflictKey(parking, existing.id);
        if(conflict){
          if(!confirm(`Bay ${parking} held by ${conflict.reg} — force replace? Old key will auto-check-out.`)) return;
          if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
          conflict.inSince = null; conflict.status = 'out';
          db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed)', forced:true});
        }
      }
      Object.assign(existing, { car, reg, dealer, branch, parking: spare ? (parking||'BOX') : parking, spare });
      saveDB(); closeSheet(); render(); toast('Saved');
      return;
    }

    // New key path
    const mode = $('#f-create').value; // main | pair | spare
    const pairId = nextPairId();
    const baseId = 'K-'+String(db.keys.length+1).padStart(3,'0');
    const common = { car, reg, dealer, branch, status:'available', inSince:Date.now(), totalParkedMs:0, pairId, createdBy: db.user.name };

    // bay conflict on main key — allow forced
    let forcedConflict = null;
    if(mode!=='spare'){
      const conflict = bayConflictKey(parking);
      if(conflict){
        if(!confirm(`Bay ${parking} held by ${conflict.reg}. Force-add anyway? Old key auto-checked-out.`)) return;
        if(conflict.inSince){ conflict.totalParkedMs = (conflict.totalParkedMs||0) + (Date.now() - conflict.inSince); }
        conflict.inSince = null; conflict.status = 'out';
        db.history.unshift({ts:Date.now(), type:'out', keyId:conflict.id, user:db.user.name, purpose:'auto-closed (bay reclaimed)', forced:true});
        forcedConflict = conflict;
      }
    }
    const created = [];
    if(mode==='main' || mode==='pair'){
      created.push({ ...common, id: baseId,        serial: nextSerial(), parking: parking || '', spare:false });
    }
    if(mode==='spare' || mode==='pair'){
      // Compute next serial AFTER the main has been added so they aren't identical
      const tmpDb = [...db.keys, ...created];
      const max = tmpDb.reduce((m,k)=>{ const n = parseInt(k.serial||'0',10); return Math.max(m, isNaN(n)?0:n); }, 10000000);
      created.push({ ...common, id: baseId+'S',     serial: String(max+1), parking: 'BOX', spare:true });
    }
    if(!created.length){ toast('Pick what to create'); return; }
    db.keys.unshift(...created);
    saveDB(); closeSheet(); render(); toast(`Created ${created.length} key${created.length>1?'s':''}`);
  };
}

// Home Key In / Key Out chooser: scan OR type plate OR pick from a quick list
function openHomeKeyAction(action){
  const label = action==='in' ? 'KEY IN' : 'KEY OUT';
  const cls   = action==='in' ? 'btn-in' : 'btn-out';
  // Default quick list: keys whose status matches the *natural* next step
  // - Key In: keys currently OUT
  // - Key Out: keys currently AVAILABLE
  const naturalKeys = db.keys.filter(k=>!k.spare && (action==='in' ? k.status==='out' : k.status==='available')).slice(0,8);

  openSheet(`
    <h3 style="display:flex;align-items:center;gap:8px">
      <span class="${cls}" style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.6px">${label}</span>

    </h3>

    <div class="row" style="margin-bottom:8px">
      <button class="btn secondary" id="hk-scan">📷 Scan QR</button>
      <button class="btn secondary" id="hk-gallery" style="position:relative;overflow:hidden">🖼️ From gallery
        <input id="hk-file" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer">
      </button>
    </div>

    <div class="search" style="margin-bottom:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="hk-q" placeholder="Type plate / serial / car…" autofocus>
    </div>
    <div id="hk-results"></div>

    <div class="listhead" style="margin-top:12px"><h2>Suggested · ${action==='in'?'currently out':'currently in'}</h2></div>
    <div id="hk-suggested">${naturalKeys.map(renderHkRow).join('') || '<div class="muted">Nothing matches the natural next step</div>'}</div>
  `);

  // Suggested row click
  bindHkRows();

  // Scan QR — open the scanner inside the sheet via temporary file/photo capture
  $('#hk-scan').onclick = ()=>{
    if(location.protocol === 'file:' || !window.isSecureContext){
      toast('Live camera needs HTTPS — use Take photo / Gallery');
    } else {
      closeSheet(); go('scan'); // delegate to full scan page; onScan will open the key
    }
  };
  $('#hk-file').addEventListener('change', async (e)=>{
    const f = e.target.files?.[0]; if(!f) return;
    e.target.value = '';
    if(typeof Html5Qrcode === 'undefined'){ toast('Scanner library missing'); return; }
    let host = document.getElementById('scan-tmp-host');
    if(!host){ host = document.createElement('div'); host.id='scan-tmp-host'; host.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1px;height:1px'; document.body.appendChild(host); }
    try {
      const tmp = new Html5Qrcode('scan-tmp-host');
      const text = await tmp.scanFile(f, true);
      const k = matchKeyByPayload(text);
      if(k) proceedWith(k); else toast('QR not in our list');
    } catch(_){ toast('No QR in image'); }
  });

  // Type-to-search
  $('#hk-q').addEventListener('input', ()=>{
    const q = ($('#hk-q').value||'').trim();
    const out = $('#hk-results');
    if(!q){ out.innerHTML=''; return; }
    const Q = q.toLowerCase();
    const matches = db.keys.filter(k=>!k.spare && [k.id,k.serial,k.reg,k.car,k.branch,k.parking].join(' ').toLowerCase().includes(Q)).slice(0,8);
    out.innerHTML = matches.length ? matches.map(renderHkRow).join('') : '<div class="muted" style="font-size:13px">No match</div>';
    bindHkRows();
  });

  function bindHkRows(){
    $$('.sheet [data-hk-id]').forEach(el=>el.addEventListener('click', ()=>{
      const k = db.keys.find(x=>x.id===el.dataset.hkId); if(k) proceedWith(k);
    }));
  }

  function proceedWith(k){
    // Force-replace insistence: if user picks a car whose status doesn't match the natural next step,
    // require explicit confirmation and the action will be recorded as FORCED in history.
    const wantInButNotOut  = action==='in'  && k.status==='available';
    const wantOutButNotIn  = action==='out' && k.status==='out';
    if(wantInButNotOut || wantOutButNotIn){
      const msg = wantInButNotOut
        ? `${k.reg} is already parked at ${k.parking||'—'}. Force-replace?\n• Previous session auto-closed\n• Action recorded as FORCED in history`
        : `${k.reg} is already OUT (last user may have forgotten to Key In). Force-replace?\n• Action recorded as FORCED in history`;
      if(!confirm(msg)) return;
    }
    closeSheet();
    if(action==='in') markIn(k); else markOut(k);
  }
}

function renderHkRow(k){
  const parked = k.status==='available';
  return `<div class="key-card" data-hk-id="${k.id}" style="margin-bottom:6px">
    <div class="qrwrap" data-payload="${qrPayload(k)}"></div>
    <div>
      <div class="title">${k.car}</div>
      <div class="meta"><span>🪪 ${k.reg}</span><span>🆔 ${serialDisplay(k)}</span><span>🏢 ${k.branch}</span><span>📍 ${parked?k.parking:'OUT'}</span></div>
    </div>
    <div class="muted">›</div>
  </div>`;
}

function matchKeyByPayload(text){
  const parts = (text||'').trim().split('|');
  if(parts[0]==='CARNET'){
    return db.keys.find(x=>x.id===parts[1]) || db.keys.find(x=>x.serial===parts[1]) || db.keys.find(x=>(x.reg||'').toUpperCase()===(parts[2]||'').toUpperCase());
  }
  const raw = text.trim();
  return db.keys.find(x=>x.serial===raw) || db.keys.find(x=>x.id===raw) || db.keys.find(x=>(x.reg||'').toUpperCase()===raw.toUpperCase());
}

let scanner = null;
async function startScanner(){

  try {

      onScan, ()=>{});

    region.innerHTML = `<div class="empty">Camera unavailable: ${e.message||e}<br>Use "Take photo" or "Pick from gallery" below.</div>`;

}
async function scanFromFile(e){
  const f = e.target.files?.[0]; if(!f) return;
  if(typeof Html5Qrcode === 'undefined'){
    toast('Scanner library not loaded — check internet');
    return;
  }
  // The library needs a target div; create a hidden temporary one so we don't fight viewScan's #scan-region.
  let host = document.getElementById('scan-tmp-host');
